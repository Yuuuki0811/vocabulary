rk（标记）→ 商业中用于识别产品的标记", "scene": "品牌注册、竞品分析、营销材料合规审查", "root": "", "family": "", "grammar": "可数名词；作主语或宾语时常用定冠词the或所有格（e.g., our trademark）；动词用法（trademarked）属正式法律语境，本词库仅列名词义项", "examples": [{"en": "This logo is a registered trademark of the company.", "zh": "此标识是该公司的注册商标。"}, {"en": "Avoid using competitors’ trademarks in your ad copy.", "zh": "广告文案中请勿使用竞争对手的商标。"}]}, {"word": "employer", "phonetic": "/ɪmˈplɔr.ər/", "meanings": ["雇主；用人单位"], "pos": "n.", "category": "人力", "syllables": "em·ploy·er", "phonicsNote": "重音在第二音节；/ɪm/弱于/ɛm/，/ər/为卷舌弱读，勿发/ə/+/r/两音", "mnemonic": "employ（雇用）+ -er（执行者）→ 雇用别人的人/组织", "scene": "劳动合同签署、员工关系管理、社保公积金申报", "root": "", "family": "", "grammar": "可数名词；常与'employee'构成逻辑对；作主语时多为机构（如a tech firm），语法上视为单数", "examples": [{"en": "The employer must provide a written offer letter before onboarding.", "zh": "雇主须在入职前提供书面录用函。"}, {"en": "As the employer, we’re responsible for payroll tax filings.", "zh": "作为雇主，我们负责工资税申报。"}]}, {"word": "operational", "phonetic": "/ˌɑp.əˈreɪ.ʃə.nəl/", "meanings": ["运营的；运作的"], "pos": "adj.", "category": "项目与运营", "syllables": "op·er·a·tion·al", "phonicsNote": "重音在第三音节；/ə/在首音节和第四音节均弱读；/ʃə/易误读为/ʃu/或/ʃi/", "mnemonic": "operation（运营）+ -al（形容词后缀）→ 描述与运营相关的", "scene": "跨部门流程协调、SOP制定、系统上线支持", "root": "", "family": "", "grammar": "形容词，常作前置定语（e.g., operational risk）或表语（e.g., The system is now operational）；比较级/最高级不常用，多用more/most operational", "examples": [{"en": "We need an operational plan before launching the new warehouse.", "zh": "新仓库启用前，我们需要一份运营计划。"}, {"en": "All teams are now operational after the system upgrade.", "zh": "系统升级后，所有团队均已投入正常运作。"}]}, {"word": "tactical", "phonetic": "/ˈtæk.tɪ.kəl/", "meanings": ["策略性的；战术的"], "pos": "adj.", "category": "战略与沟通", "syllables": "tac·ti·cal", "phonicsNote": "重音在第一音节，/kəl/ 轻读，勿误读为 /ˈtæk.ti.kəl/（三音节重音错位）", "mnemonic": "tac（谐音‘打’）+ tical → 打得准、打得巧 → 强调具体执行层面的策略性", "scene": "制定短期行动方案以支持长期战略目标", "root": "", "family": "", "grammar": "形容词作定语修饰名词；常与strategic构成对比（tactical = short-term, operational；strategic = long-term, directional）", "examples": [{"en": "We adjusted our tactical messaging to align with the regional campaign timeline.", "zh": "我们调整了战术层面的信息传递，以配合区域活动的时间表。"}, {"en": "The sales team developed a tactical plan for Q3 lead conversion.", "zh": "销售团队制定了第三季度潜在客户转化的战术计划。"}]}, {"word": "bargaining", "phonetic": "/ˈbɑr.ɡə.nɪŋ/", "meanings": ["讨价还价；谈判过程"], "pos": "n.", "category": "谈判", "syllables": "bar·gain·ing", "phonicsNote": "注意 /ɡə/ 中央元音弱读，非 /ɡeɪ/；结尾 -ing 发 /ɪŋ/，非 /iŋ/", "mnemonic": "bargain（议价）+ -ing → 正在发生的议价行为 → 谈判过程本身", "scene": "双方就价格、条款或条件进行协商以达成一致", "root": "", "family": "", "grammar": "动名词作主语或宾语；常与power、leverage、position等搭配，体现抽象能力或状态", "examples": [{"en": "Her strong preparation gave her an advantage in salary bargaining.", "zh": "她充分的准备使她在薪资谈判中占据优势。"}, {"en": "Collective bargaining is required before the new labor agreement takes effect.", "zh": "新劳工协议生效前须完成集体谈判。"}]}, {"word": "participation", "phonetic": "/pɑrˌtɪs.əˈpeɪ.ʃən/", "meanings": ["参与；参加"], "pos": "n.", "category": "会议", "syllables": "par·ti·ci·pa·tion", "phonicsNote": "重音在第四音节 /peɪ/；/ʃən/ 结尾清晰，勿省略为 /ʃn/", "mnemonic": "part（部分）+ i + cipation（联想 'citation' 表‘被点名’）→ 成为一部分并被认可 → 主动加入", "scene": "会议中发言、提问、回应或协同决策的行为", "root": "", "family": "", "grammar": "不可数名词；常与in搭配（participation in…），后接名词或动名词短语", "examples": [{"en": "Full participation in the workshop is expected from all department leads.", "zh": "所有部门负责人须全程参与本次研讨会。"}, {"en": "Low participation in the feedback session suggests the timing needs adjustment.", "zh": "反馈环节参与度低，表明时间安排需调整。"}]}, {"word": "enclosure", "phonetic": "/ɪnˈkləʊ.ʒər/", "meanings": ["附件；随函寄送的文件"], "pos": "n.", "category": "邮件", "syllables": "en·clo·sure", "phonicsNote": "重音在第二音节；/ʒər/ 类似 'measure' 尾音，非 /ʃər/", "mnemonic": "en-（进入）+ closure（封闭）→ 文件被‘封入’邮件中 → 随信附上的材料", "scene": "商务邮件末尾注明所附文件，如合同、报价单或简历", "root": "", "family": "", "grammar": "可数名词；常用单数形式指代一份或多份附件；常与'please find'或'attached'结构呼应", "examples": [{"en": "Please find the signed NDA as an enclosure to this e ivery is delayed.", "zh": "若交货延迟，买方保留在本罚则条款下采取强制执行措施的权利。"}, {"en": "Both parties must cooperate to enforce the confidentiality obligations.", "zh": "双方须配合履行保密义务的强制执行。"}]}, {"word": "seminar", "phonetic": "/ˈsɛmənɑr/", "meanings": ["研讨会；专题讲座（尤指专业或学术性）"], "pos": "n.", "category": "会议", "syllables": "sem·i·nar", "phonicsNote": "重音在第一音节；/ˈsɛmənɑr/，注意 /ɑr/ 非 /ər/；易误读为 /ˈsɛmɪnɑr/", "mnemonic": "semi-（半）+ nar（联想 'narrate' 讲述）→ 半讲授半研讨形式 → 研讨会", "scene": "内部能力建设、客户技术交流、行业政策解读会", "root": "", "family": "", "grammar": "可数名词；常用定冠词 the 或限定词（our, upcoming）修饰；作主语时谓语用单数", "examples": [{"en": "We’ll host a seminar on GDPR compliance for regional sales managers next month.", "zh": "我们将于下月为各区域销售经理举办一场关于GDPR合规的研讨会。"}, {"en": "Attendance at the product launch seminar is mandatory for all marketing staff.", "zh": "所有市场部员工必须参加本次产品发布研讨会。"}]}, {"word": "remind", "phonetic": "/rɪˈmaɪnd/", "meanings": ["提醒；使想起"], "pos": "v.", "category": "邮件", "syllables": "re·mind", "phonicsNote": "重音在第二音节；/rɪˈmaɪnd/，注意 /aɪ/ 发音清晰，勿弱化为 /ə/", "mnemonic": "re-（再）+ mind（头脑）→ 再进头脑 → 提醒", "scene": "会议前确认、截止日预警、待办事项跟进", "root": "", "family": "", "grammar": "及物动词；常用结构：remind + sb + (that) / to-infinitive / about sth；过去式 reminded 规则变化", "examples": [{"en": "I’m writing to remind you that the Q3 budget submission is due this Friday.", "zh": "谨此提醒您，第三季度预算提交截止日期为本周五。"}, {"en": "Could you please remind the team about the revised NDA template before signing?", "zh": "签署前，请您提醒团队使用修订后的保密协议模板。"}]}, {"word": "amortisation", "phonetic": "/əˌmɔr.təˈzeɪ.ʃən/", "meanings": ["摊销（将无形资产或贷款成本在一定期限内系统分摊）"], "pos": "n.", "category": "财务", "syllables": "a·mor·ti·sa·tion", "phonicsNote": "重音在第四音节；美式拼写为 amortization，但发音同 /əˌmɔr.təˈzeɪ.ʃən/", "mnemonic": "a-（不）+ mort（死）+ -isation → 使‘死亡成本’活化分摊 → 摊销", "scene": "无形资产会计处理、长期贷款利息分配、并购后商誉调整", "root": "", "family": "", "grammar": "不可数名词；常与 of 连用（amortisation of intangible assets）；作主语时谓语用单数", "examples": [{"en": "The software license will be recorded as an intangible asset and amortised over five ", "category": "人力", "syllables": "cre·den·tial", "phonicsNote": "重音在第二音节；/krəˈden.ʃəl/，注意 /ʃ/ 音；首音节弱读 /krə/", "mnemonic": "cred-（相信）+ ential（形容词/名词后缀）→ 让人信服的东西 → 资质证明", "scene": "候选人背景审核、供应商资质认证、内部岗位竞聘", "root": "", "family": "", "grammar": "可数名词；常用复数 credentials 表整体资质；常与 hold, verify, submit 搭配", "examples": [{"en": "All consultants must submit valid credentials before project onboarding.", "zh": "所有顾问须在项目启动前提交有效资质证明。"}, {"en": "Her academic credentials and industry experience align well with the role.", "zh": "她的学历资质和行业经验与该职位高度匹配。"}]}, {"word": "specification", "phonetic": "/ˌspɛs.ə.fəˈkeɪ.ʃən/", "meanings": ["规格；技术参数；详细要求"], "pos": "n.", "category": "项目与运营", "syllables": "spe·ci·fi·ca·tion", "phonicsNote": "重音在第四音节；/ˌspɛs.ə.fəˈkeɪ.ʃən/，注意 /keɪ/ 和 /ʃən/ 的清晰发音", "mnemonic": "specify（明确说明）+ -cation（名词后缀）→ 明确写下的要求 → 规格说明", "scene": "产品开发需求定义、采购招标文件编制、制造质量验收", "root": "", "family": "", "grammar": "不可数或可数名词；常以 the specification 或 specifications 形式出现；后接 for/of 表适用对象", "examples": [{"en": "The vendor failed to meet the technical specification for thermal resistance.", "zh": "该供应商未能达到热阻方面的技术规格要求。"}, {"en": "Please review the updated specification before final sign-off.", "zh": "请在最终签字前审阅更新后的规格文档。"}]}, {"word": "adaptive", "phonetic": "/əˈdæp.tɪv/", "meanings": ["适应性强的；能灵活调整的"], "pos": "adj.", "category": "战略与沟通", "syllables": "a·dap·tive", "phonicsNote": "重音在第二音节，/ə/弱读易误为/æ/；注意/tɪv/非/tiv/", "mnemonic": "ad-（向）+ apt（适合）+ -ive → 向适合的方向改变 → 适应性强的", "scene": "描述组织、团队或沟通方式对市场变化或客户反馈快速响应的能力", "root": "", "family": "", "grammar": "作表语或定语，常接to引导的介词短语（e.g., adaptive to change）；在商务写作中多用于被动结构或名词化表达（e.g., an adaptive approach）", "examples": [{"en": "Our team is highly adaptive to client feedback during product development.", "zh": "我们的团队在产品开发过程中能高度响应客户反馈。"}, {"en": "An adaptive communication strategy helped us enter three new markets last year.", "zh": "一套灵活的沟通策略帮助我们去年成功进入三个新市场。"}]}, {"word": "indemnity", "phonetic": "/ɪnˈdem.nə.ti/", "meanings": ["赔偿责任；补偿保障；免责条款"], "pos": "n.", "ca , "scene": "招聘初筛与候选人资料审核", "root": "", "family": "", "grammar": "可数名词；美式英语中常用带重音符号拼写以区别于动词resume /rɪˈzjuːm/；作宾语时常带定冠词或物主代词", "examples": [{"en": "Please submit your résumé and cover letter by Friday.", "zh": "请于周五前提交您的简历和求职信。"}, {"en": "She updated her résumé to highlight cross-functional project experience.", "zh": "她更新了简历，以突出跨职能项目经验。"}]}, {"word": "spec", "phonetic": "/spɛk/", "meanings": ["规格说明；技术或功能需求文档"], "pos": "n.", "category": "项目与运营", "syllables": "spec", "phonicsNote": "单音节，/spɛk/，易误读为/spɛkʃən/；非缩略语全称，日常即用此形", "mnemonic": "short for specification → sounds like ‘speck’ → tiny but critical details", "scene": "产品需求评审会或开发任务交接", "root": "", "family": "", "grammar": "可数名词，常作单数；与定冠词或物主代词连用；后接of或不定式表内容", "examples": [{"en": "The dev team won’t start coding until the final spec is approved.", "zh": "开发团队要等最终版规格说明书获批后才开始编码。"}, {"en": "We need to align the UI design with the client’s written spec.", "zh": "我们需要让UI设计与客户的书面规格说明保持一致。"}]}, {"word": "resilience", "phonetic": "/rɪˈzɪliəns/", "meanings": ["韧性；组织或个人应对压力、变化或逆境并恢复的能力"], "pos": "n.", "category": "战略与沟通", "syllables": "re·sil·ience", "phonicsNote": "重音在第二音节；/rɪˈzɪl-/ 易误读为/riˈzɪl-/；-ience发/əns/非/iəns/", "mnemonic": "resilience ≈ ‘re-silence’ + ‘-ence’ → bouncing back *in silence* after disruption", "scene": "高管战略复盘会议或危机沟通预案讨论", "root": "", "family": "", "grammar": "不可数抽象名词；常与preposition of或adjective + resilience搭配；谓语动词用单数", "examples": [{"en": "Building supply chain resilience is now a top priority for procurement leaders.", "zh": "构建供应链韧性已成为采购负责人的首要任务。"}, {"en": "The CEO emphasized cultural resilience during the restructuring announcement.", "zh": "首席执行官在重组公告中强调了企业文化韧性。"}]}, {"word": "indemnify", "phonetic": "/ɪnˈdɛm.nə.fɑɪ/", "meanings": ["赔偿；使免受损失；法律上承诺承担他人可能产生的责任或损失"], "pos": "v.", "category": "谈判", "syllables": "in·dem·ni·fy", "phonicsNote": "重音在第二音节；/nə.fɑɪ/易误读为/nɪ.faɪ/；注意-dem-非-dim-", "mnemonic": "in + demn (Latin ‘harm’) + -ify → ‘make harm not happen to you’", "scene": "合同条款谈判或法律尽职调查环节", "root": "", "family": "", "grammar": "及物动词；后接宾语（人/方）+ against/from + noun；常用于正式被动语态", "examples": [{"en": "The vendor agrees to indemnify the buyer against any third-party IP claims.", "zh": "供应商同意就任何第三方知识产权主张向买方提供赔偿。"}, {"en": "This clause does not indemnify the service provider for gross negligence.", "zh": "本条款不豁免服务提供商的重大过失责任。"}]}, {"word": "presentation", "phonetic": "/ˌprez.ənˈteɪ.ʃən/", "meanings": ["演示；陈述；介绍"], "pos": "n.", "category": "会议", "syllables": "pre·sen·ta·tion", "phonicsNote": "重音在第三音节，-ta-不读/tə/而读/ˈteɪ/", "mnemonic": "present（呈现）+ -ation（行为名词后缀）→ 把方案‘呈现’出来", "scene": "向管理层汇报季度策略；向客户展示新产品方案", "root": "", "family": "", "grammar": "抽象不可数名词，作主语或宾语时无需冠词（如：Presentation begins at 3 p.m.）；特指某次演示时可加定冠词或限定词（the presentation / our presentation）", "examples": [{"en": "Her presentation on market entry strategy convinced the investment committee.", "zh": "她关于市场进入策略的演示说服了投资委员会。"}, {"en": "Please keep your presentation under 15 minutes to allow time for Q&A.", "zh": "请将您的演示控制在15分钟内，以便留出问答时间。"}]}, {"word": "forwarding", "phonetic": "/ˈfɔːr.wə.dɪŋ/", "meanings": ["转发（邮件、信息等）；货运代理（行业用法）"], "pos": "n.", "category": "邮件", "syllables": "for·ward·ing", "phonicsNote": "重音在第一音节，-ward-不弱读为/wərd/，-ing发/ɪŋ/非/ən/", "mnemonic": "forward（向前）+ -ing（动作）→ 把邮件‘向前’传给下一人", "scene": "内部协作中将客户询价邮件转给销售团队；设置邮箱自动转发规则", "root": "", "family": "", "grammar": "动名词作主语或宾语，常与介词on/about搭配（e.g., forwarding on pricing inquiries）；不可数，无复数形式", "examples": [{"en": "Email forwarding must be configured before the team leaves for the trade show.", "zh": "团队出发参加展会前，必须配置好邮件转发功能。"}, {"en": "He handled all forwarding of client requests to the appropriate department.", "zh": "他负责将所有客户请求转发至相关部门。"}]}, {"word": "solvency", "phonetic": "/ˈsɑːl.vən.si/", "meanings": ["偿债能力；清偿力"], "pos": "n.", "category": "财务", "syllables": "sol·ven·cy", "phonicsNote": "重音在第一音节，-ven-读/vən/非/vɛn/；-cy结尾发/si/", "mnemonic": "solvent（有偿付能力的）+ -cy（状态名词后缀）→ 公司‘能还钱’的状态", "scene": "银行评估贷款申请人信用；审计报告中披露企业流动性风险", "root": "", "family": "", "grammar": "不可数抽象名词，常与介词of连用表所属（solvency of the firm），或与形容词strong/weak搭配；不加冠词泛指概念", "examples": [{"en": "The audit confirmed the company’s solvency despite declining revenues.", "zh": "尽管收入下降，审计确认了公司的偿债能力。"}, {"en": "Regulators require annual disclosure of solvency ratios for licensed insurers.", "zh": "监管机构要求持牌保险公司每年披露偿付能力比率。"}]}, {"word": "audience", "phonetic": "/ˈɔː.di.əns/", "meanings": ["目标受众；听众；观众"], "pos": "n.", "category": "市场", "syllables": "au·di·ence", "phonicsNote": "重音在第一音节，-di-读/di/非/dee/；-ence发/əns/", "mnemonic": "audio（听觉）相关 → 听你说话的那群人", "scene": "制定社交媒体广告投放人群；分析用户调研数据以定义核心受众", "root": "", "family": "", "grammar": "集合名词，单复数同形；作主语时谓语动词依语境用单数（the audience is engaged）或复数（the audience were divided in opinion）；常与定冠词或限定词连用", "examples": [{"en": "Our new campaign targets a younger audience through TikTok and Instagram.", "zh": "我们的新活动通过TikTok和Instagram触达更年轻的受众。"}, {"en": "Understanding your audience’s pain points is essential for effective messaging.", "zh": "理解目标受众的痛点，是实现有效信息传递的关键。"}]}, {"word": "CV", "phonetic": "/ˌsiːˈviː/", "meanings": ["简历（curriculum vitae的缩写）"], "pos": "n.", "category": "人力", "syllables": "C·V", "phonicsNote": "字母逐个读，/siː viː/，不读作单词", "mnemonic": "C for 'career', V for 'vital details' — both start with C and V", "scene": "招聘流程中筛选候选人材料；海外求职者提交标准化职业履历", "root": "", "family": "", "grammar": "缩略词，作为可数名词使用，复数加-s（CVs）；美式英语中通常称résumé，但CV仍用于学术/国际场景；首字母大写，不加冠词泛指时可用零冠词（Send CVs to hr@company.com）", "examples": [{"en": "Shortlisted candidates will be invited for interviews after CV review.", "zh": "初选候选人将在简历审核后获邀参加面试。"}, {"en": "Please submit your CV and cover letter by Friday.", "zh": "请于周五前提交您的简历和求职信。"}]}, {"word": "specifications", "phonetic": "/ˌspɛsəfəˈkeɪʃənz/", "meanings": ["技术规格；详细要求"], "pos": "n.", "category": "项目与运营", "syllables": "spec·i·fi·ca·tions", "phonicsNote": "重音在第四音节；-tions 发 /ʃənz/，非 /tʃənz/", "mnemonic": "spec（缩写自 special）+ fications（联想 'fixations'，即‘固定要求’）→ 明确固定的特殊要求", "scene": "项目启动阶段审阅交付物技术参数", "root": "", "family": "", "grammar": "复数名词作主语，谓 pdates in real time.", "zh": "我来演示报表仪表盘如何实时更新。"}, {"en": "We’ll demonstrate compliance with GDPR through our audit logs.", "zh": "我们将通过审计日志证明符合GDPR要求。"}]}, {"word": "apology", "phonetic": "/əˈpɑː.lə.dʒi/", "meanings": ["道歉；致歉信"], "pos": "n.", "category": "邮件", "syllables": "a·pol·o·gy", "phonicsNote": "重音在第二音节；/əˈpɑː.lə.dʒi/，注意 /dʒi/ 结尾，非 /dʒə/", "mnemonic": "a + pology（联想 ‘policy’ 政策？不！→ ‘I’m sorry’ 的正式政策 = 道歉是专业沟通的必守条款）", "scene": "因交付延迟向关键客户发送正式致歉邮件并附补救方案", "root": "", "family": "", "grammar": "不可数名词表抽象行为（make an apology），也可可数表具体信函（send an apology）", "examples": [{"en": "Please accept our sincere apology for the shipment delay.", "zh": "敬请接受我们对此次发货延迟的诚挚歉意。"}, {"en": "The apology email included a discount voucher and revised timeline.", "zh": "这封致歉邮件附带了一张折扣券及修订后的时间表。"}]}, {"word": "insolvent", "phonetic": "/ɪnˈsɑl.vənt/", "meanings": ["资不抵债的；无力偿债的"], "pos": "adj.", "category": "财务", "syllables": "in·sol·vent", "phonicsNote": "重音在第二音节，/sɑl/ 不读 /sɔl/；注意 /vənt/ 轻读", "mnemonic": "in-（不）+ solvent（有偿付能力的）→ 不能还债", "scene": "财务审计、破产听证、信贷评估", "root": "", "family": "", "grammar": "作表语形容词，常接系动词be或become；不可用very修饰，可用completely、technically等副词强化", "examples": [{"en": "The company was declared insolvent after failing to meet its debt obligations for six months.", "zh": "该公司连续六个月未能履行债务义务，被裁定破产。"}, {"en": "We cannot extend further credit to an insolvent client.", "zh": "我们不能向资不抵债的客户继续提供信用额度。"}]}, {"word": "demographic", "phonetic": "/ˌdem.əˈɡræf.ɪk/", "meanings": ["人口统计学的；按人口特征划分的"], "pos": "adj.", "category": "市场", "syllables": "de·mo·graph·ic", "phonicsNote": "重音在第三音节，/ˈɡræf/ 发音清晰，勿弱化为/grəf/", "mnemonic": "demo（人群）+ graphic（描绘）→ 描绘人群特征 → 人口统计的", "scene": "市场细分、广告投放、用户画像建模", "root": "", "family": "", "grammar": "作定语形容词，常修饰名词（如demographic data, demographic trend）；不可单独作主语或宾语", "examples": [{"en": "Our new product targets the 25–34 demographic with high disposable income.", "zh": "我们的新产品面向可支配收入较高的25–34岁人群。"}, {"en": "The campaign’s performance varied significantly across each demographic segment.", "zh": "该营销活动在各个人口统计细分群体中的表现差异显著。"}]}, {"word": "expertise", "phonetic": "/ˌek.spɚˈtiz/", "meanings": ["专门知识；专业技能"], "pos": "n.", "category": "人力", "syllables": "ex·per·tise", "phonicsNote": "重音在第二音节；/tiz/ 为清晰清音结尾，非/tiːz/ 或/diz/", "mnemonic": "expert（专家）+ -ise（名词后缀）→ 专家所拥有的东西 → 专业知识", "scene": "人才招聘、跨部门协作、能力建设评估", "root": "", "family": "", "grammar": "不可数名词，无复数形式；前不可加a/an，但可与great, deep, specific等形容词搭配", "examples": [{"en": "Her expertise in supply chain optimization helped reduce lead times by 20%.", "zh": "她在供应链优化方面的专业知识使交货周期缩短了20%。"}, {"en": "The project requires legal and regulatory expertise not currently available in-house.", "zh": "该项目需要目前公司内部尚不具备的法律与合规专业技能。"}]}, {"word": "standard", "phonetic": "/ˈstæn.dɚd/", "meanings": ["标准；规范；基准"], "pos": "n.", "category": "项目与运营", "syllables": "stan·dard", "phonicsNote": "重音在第一音节；/dɚd/ 中/r/轻微卷舌，/æ/ 短而清晰", "mnemonic": "stand（站）+ ard（方向）→ 站在统一方向 → 衡量基准", "scene": "质量审核、SOP制定、供应商准入评估", "root": "", "family": "", "grammar": "可数名词；作‘行业标准’时常用单数加the（the industry standard），作泛指时可用复数（standards）表示多项规范", "examples": [{"en": "All deliverables must comply with the ISO 9001 quality standard.", "zh": "所有交付物必须符合ISO 9001质量标准。"}, {"en": "We revised our internal documentation standards to align with GDPR requirements.", "zh": "我们修订了内部文档规范，以符合GDPR要求。"}]}, {"word": "sustainability", "phonetic": "/səˌsteɪ.nəˈbɪl.ə.ti/", "meanings": ["可持续性；可持续发展能力"], "pos": "n.", "category": "战略与沟通", "syllables": "sus·tain·a·bil·i·ty", "phonicsNote": "重音在第四音节 /bɪl/；/ə/ 在非重读音节中多发为schwa，避免强读为/æ/或/i/", "mnemonic": "sustain（维持）+ -ability（能力）→ 维持长期发展的能力", "scene": "ESG报告发布、投资者路演、品牌价值观声明", "root": "", "family": "", "grammar": "不可数名词；常与commitment to, focus on, report on等介词短语搭配；不可说a sustainability", "examples": [{"en": "Investors increasingly evaluate companies based on their ESG performance and long-term sustainability.", "zh": "投资者日益依据企业的ESG表现及长期可持续性进行评估。"}, {"en": "Our annual sustainability report outlines progress on carbon reduction and ethical sourcing.", "zh": "我们的年度可持续发展报告概述了碳减排与道德采购方面的进展。"}]}, {"word": "guarantee", "phonetic": "/ˌɡærənˈti/", "meanings": ["保证；担保；保修"], "pos": "n./v.", "category": "谈判", "syllables": "gar·an·tee", "phonicsNote": "重音在第二音节，/ti/ 不发 /tɪ/；注意 /ɡærən/ 中 /r/ 需卷舌", "mnemonic": "发音似‘给俺提’——对方谈判时‘给俺一个提（保）证’才放心", "scene": "合同条款磋商、售后服务承诺、履约担保", "root": "", "family": "", "grammar": "作名词时常用结构：guarantee of + 名词（抽象）；作动词时后接 that 从句或直接宾语，that 可省略", "examples": [{"en": "We guarantee delivery within 10 business days.", "zh": "我们保证在10个工作日内交货。"}, {"en": "The contract includes a guarantee of product quality.", "zh": "该合同包含产品质量保证条款。"}]}, {"word": "demonstration", "phonetic": "/ˌdɛmənˈstreɪʃən/", "meanings": ["演示；说明；示威（此处仅取商务义）"], "pos": "n.", "category": "会议", "syllables": "dem·on·stra·tion", "phonicsNote": "重音在第三音节 /ˈstreɪ/；/ʃən/ 发 /ʃən/ 而非 /ʃn/", "mnemonic": "联想‘demo + stration’→‘demo展示’+‘stration’像‘station’（站点），即‘在演示站上操作’", "scene": "产品发布会、客户技术会议、内部培训中的功能实操环节", "root": "", "family": "", "grammar": "不可数名词，表抽象行为；作可数名词指具体某次演示，常与冠词或数量词连用（a demonstration, several demonstrations）", "examples": [{"en": "Please join our live demo session for the new CRM platform.", "zh": "请参加我们新CRM平台的现场演示会。"}, {"en": "The sales team gave a clear demonstration of how the software integrates with existing tools.", "zh": "销售团队清晰演示了该软件如何与现有工具集成。"}]}, {"word": "inconvenience", "phonetic": "/ˌɪnkənˈviːniəns/", "meanings": ["不便；麻烦"], "pos": "n.", "category": "邮件", "syllables": "in·con·ven·ience", "phonicsNote": "重音在第三音节 /ˈviː/；/əns/ 发 /əns/，非 /æns/；注意 /ɪn/ 开口小，勿读成 /ɛn/", "mnemonic": "in-（不）+ convenience（便利）→‘不便利’= 不便", "scene": "道歉邮件、日程变更通知、系统维护公告等需表达体谅的正式沟通", "root": "", "family": "", "grammar": "不可数名词；常用搭配：for your inconvenience（固定介词短语，表‘给您带来的不便’）；avoid / cause / regret the inconvenience", "examples": [{"en": "We apologize for any inconvenience caused by the server outage.", "zh": "服务器中断给您带来的任何不便，我们深表歉意。"}, {"en": "Thank you for your patience and understanding during this temporary inconvenience.", "zh": "感谢您在此短暂不便期间的耐心与理解。"}]}, lables": "cour·te·ous", "phonicsNote": "重音在首音节；/ˈkɜːr.ti.əs/，注意 /tʃ/ 不发音，-teous 读作 /ti.əs/", "mnemonic": "court（宫廷）+ eous → 宫廷式礼节 → 极其礼貌", "scene": "向高层客户或跨文化合作伙伴发送正式跟进邮件", "root": "", "family": "", "grammar": "作表语或定语；常与 'polite', 'professional' 并列使用，构成商务邮件语气基调", "examples": [{"en": "Her reply was prompt and courteous, which helped maintain goodwill.", "zh": "她的回复迅速且礼貌，有助于维系良好关系。"}, {"en": "Always remain courteous—even when declining a request.", "zh": "即使拒绝请求，也务必保持礼貌。"}]}, {"word": "shareholder", "phonetic": "/ˈʃer.hoʊ.lɚ/", "meanings": ["股东；持有公司股份的个人或机构"], "pos": "n.", "category": "财务", "syllables": "share·hold·er", "phonicsNote": "重音在首音节；/ˈʃer.hoʊ.lɚ/，注意 /hoʊ/ 发长音，非 /hɑː/", "mnemonic": "share（股份）+ holder（持有者）→ 持股之人", "scene": "财报发布说明会或年度股东大会沟通", "root": "", "family": "", "grammar": "可数名词；常用复数形式（shareholders）指整体利益相关方；常与 'stakeholder' 区分（后者范围更广）", "examples": [{"en": "The CFO presented Q2 results directly to major shareholders.", "zh": "首席财务官直接向主要股东汇报了第二季度业绩。"}, {"en": "Dividend policy must balance growth needs with shareholder expectations.", "zh": "股息政策须兼顾发展需求与股东预期。"}]}, {"word": "generation", "phonetic": "/ˌdʒen.əˈreɪ.ʃən/", "meanings": ["一代人；产生；（数据/内容等）生成"], "pos": "n.", "category": "市场", "syllables": "gen·er·a·tion", "phonicsNote": "重音在第三音节；/ˌdʒen.əˈreɪ.ʃən/，注意 /reɪ/ 发长音，-tion 读 /ʃən/", "mnemonic": "gen（产生）+ eration → 产生新人群/新产品 → 市场聚焦‘Z世代’或‘AI生成内容’", "scene": "消费者洞察报告或数字营销策略制定", "root": "", "family": "", "grammar": "可数名词；‘a new generation of customers’ 中为泛指；‘the generation of leads’ 中为抽象不可数用法", "examples": [{"en": "Our campaign targets the digital-native generation with short-form video.", "zh": "本活动以数字原住民一代为目标受众，采用短视频形式。"}, {"en": "Lead generation via LinkedIn has doubled since last quarter.", "zh": "通过领英获取销售线索的数量较上季度翻倍。"}]}, {"word": "potential", "phonetic": "/pəˈten·ʃəl/", "meanings": ["潜力；潜在的可能；有发展潜力的人或事物"], "pos": "n./adj.", "category": "人力", "syllables": "po·ten·tial", "phonicsNote": "重音在第二音节；/ʃəl/易误读为/shul/", "mnemonic": "‘poten’像‘power ten’（十倍能量），暗示未释放  of this issue depends on mutual concessions.", "zh": "该问题的解决取决于双方让步。"}]}, {"word": "followup", "phonetic": "/ˈfɑ·loʊ·ʌp/", "meanings": ["跟进；后续行动；后续沟通"], "pos": "n.", "category": "会议", "syllables": "fol·low·up", "phonicsNote": "重音在第一音节；/ʌp/非/əp/", "mnemonic": "字面即‘follow + up’，强调向上推进、不中断", "scene": "会后任务分配、客户回访、行动计划追踪", "root": "", "family": "", "grammar": "复合名词，无连字符（美式）；作主语/宾语时视为单数，谓语动词用单数", "examples": [{"en": "Please send the meeting followup by EOD Friday.", "zh": "请于本周五下班前发送会议跟进纪要。"}, {"en": "Her followup with the client confirmed delivery timing.", "zh": "她对客户的后续沟通确认了交货时间。"}]}, {"word": "formal", "phonetic": "/ˈfɔːr.məl/", "meanings": ["正式的；正规的；拘谨的"], "pos": "adj.", "category": "邮件", "syllables": "for·mal", "phonicsNote": "重音在第一音节，/ɔːr/ 如 'or'，非 /ɑːr/", "mnemonic": "form（表格、格式）+ al → 遵循固定格式 → 正式的", "scene": "撰写对外商务邮件、会议邀请、合同函件等需体现专业性与礼节的场合", "root": "", "family": "", "grammar": "作定语修饰名词时前置；在系表结构中作表语，常搭配 formal meeting/email/notice", "examples": [{"en": "Please send a formal written confirmation by Friday.", "zh": "请于周五前发送一份正式的书面确认。"}, {"en": "Our partnership agreement requires formal approval from both legal teams.", "zh": "我们的合作协议需双方法务团队正式批准。"}]}, {"word": "stockholder", "phonetic": "/ˈstɑːk.hoʊ.lɚ/", "meanings": ["股东；股票持有人"], "pos": "n.", "category": "财务", "syllables": "stock·hold·er", "phonicsNote": "重音在第一音节；/hoʊ.lɚ/ 中 /oʊ/ 如 'go'，/lɚ/ 是卷舌音", "mnemonic": "stock（股票）+ holder（持有者）→ 持有公司股票的人", "scene": "财报披露、股东大会通知、投资者关系沟通、分红政策说明", "root": "", "family": "", "grammar": "可数名词，常与冠词或所有格连用；复数 stockholders 常用于泛指全体股东", "examples": [{"en": "The annual report will be distributed to all stockholders before the AGM.", "zh": "年度报告将在年度股东大会前分发给全体股东。"}, {"en": "Stockholder value is a key metric for our board’s performance review.", "zh": "股东价值是我们董事会绩效评估的关键指标。"}]}, {"word": "funnel", "phonetic": "/ˈfʌn.əl/", "meanings": ["漏斗；（营销）流量转化路径；筛选流程"], "pos": "n.", "category": "市场", "syllables": "fun·nel", "phonicsNote": "重音在第一音节；/ʌ/ 如 'cup'，非 /uː/；双写 l 不发音", "mnemonic": "形状像 funnel（漏斗 tion needed unless you spot an issue.", "zh": "这是一封非正式跟进邮件——除非发现问题，否则无需操作。"}, {"en": "We’ll share the draft informally first, then circulate the formal version next week.", "zh": "我们将先非正式地分享初稿，下周再分发正式版本。"}]}, {"word": "stock", "phonetic": "/stɑːk/", "meanings": ["库存；股份；股票；现货"], "pos": "n.", "category": "财务", "syllables": "stock", "phonicsNote": "单音节词；/ɑː/ 在美式发音中开口较大，勿读成 /ɒ/ 或 /ʌ/", "mnemonic": "仓库里堆满'stock'（货物），股市里买卖'stock'（股份）", "scene": "财务报表审阅、供应链汇报或投资者沟通中的资产构成说明", "root": "", "family": "", "grammar": "不可数名词表‘库存总量’；可数名词表‘某类股票’；复数 stocks 多指多种股票或不同类别库存", "examples": [{"en": "Inventory stock declined 12% year-on-year due to supply chain delays.", "zh": "受供应链延误影响，库存同比下降12%。"}, {"en": "The company’s common stock trades on the NASDAQ under the ticker XYZ.", "zh": "该公司普通股在纳斯达克上市，股票代码为XYZ。"}]}, {"word": "referral", "phonetic": "/rɪˈfər.əl/", "meanings": ["推荐；转介；介绍客户的行为或结果"], "pos": "n.", "category": "市场", "syllables": "re·fer·ral", "phonicsNote": "重音在第二音节，/rɪˈfər.əl/，注意/r/不省略，非/rəˈfər.əl/", "mnemonic": "refer（参考、推荐）+ -al（名词后缀）→ 由他人推荐而来的线索", "scene": "客户获取与合作伙伴渠道管理", "root": "", "family": "", "grammar": "不可数名词作主语时谓语动词用单数；常与介词from搭配表示来源", "examples": [{"en": "Our highest-converting channel is referral from existing customers.", "zh": "我们转化率最高的渠道是现有客户的推荐。"}, {"en": "Each successful referral earns the referrer a $50 credit.", "zh": "每成功推荐一位新客户，推荐人可获得50美元账户积分。"}]}, {"word": "capacity", "phonetic": "/kəˈpæs.ə.ti/", "meanings": ["能力；产能；职位承载力；资源上限"], "pos": "n.", "category": "人力", "syllables": "ca·pac·i·ty", "phonicsNote": "重音在第二音节，/kəˈpæs.ə.ti/，注意/ti/发短音，非/tiː/", "mnemonic": "cap（帽子，引申为‘容纳’）+ -acity（表状态）→ 能容纳多少，即承载能力", "scene": "团队负荷评估与招聘规划", "root": "", "family": "", "grammar": "作不可数名词表抽象能力（如capacity to lead），作可数名词表具体容量单位（e.g., 20 FTE capacity）", "examples": [{"en": "The engineering team is operating at full capacity this quarter.", "zh": "本季度工程团队已满负荷运转。"}, {"en": "We’re hiring two project managers to increase delivery capacity.", "zh": "我们正招聘两名项目经理以提升交付能力。"}]}, {"word": "fault", "phonetic": "/fɔːlt/", "meanings": ["过错；责任；缺陷（尤指系统或流程中的）"], "pos": "n.", "category": "项目与运营", "syllables": "fault", "phonicsNote": "单音节词，/fɔːlt/，注意元音为/ɔː/，非/fɒlt/或/fʌlt/", "mnemonic": "发音同‘fall out’（出问题）→ 出问题的地方就是fault", "scene": "事故复盘与跨部门责任界定", "root": "", "family": "", "grammar": "常与介词with/on搭配（e.g., fault with the process; fault lies on procurement）；be at fault为固定搭配", "examples": [{"en": "The root cause analysis showed no single team was at fault.", "zh": "根本原因分析显示没有单一团队应承担责任。"}, {"en": "A software bug—not human error—was the fault in the data sync failure.", "zh": "数据同步失败的症结在于软件漏洞，而非人为失误。"}]}, {"word": "disruptive", "phonetic": "/dɪsˈrʌp.tɪv/", "meanings": ["颠覆性的；打破常规的；造成显著干扰的"], "pos": "adj.", "category": "战略与沟通", "syllables": "dis·rup·tive", "phonicsNote": "重音在第二音节，/dɪsˈrʌp.tɪv/，注意/tɪv/轻读，非/tiːv/", "mnemonic": "dis-（否定）+ rupt（断裂）+ -ive → 引起断裂式改变的", "scene": "创新提案陈述与行业趋势分析", "root": "", "family": "", "grammar": "作定语时前置（a disruptive technology），作表语需搭配系动词（The model is disruptive）；比较级常用more disruptive", "examples": [{"en": "This AI tool is not just efficient—it’s truly disruptive to legacy workflows.", "zh": "这款AI工具不仅高效，更真正颠覆了传统工作流。"}, {"en": "Investors favor startups with a clear disruptive value proposition.", "zh": "投资者青睐拥有明确颠覆性价值主张的初创企业。"}]}, {"word": "jurisdiction", "phonetic": "/ˌdʒʊr.əsˈdɪk.ʃən/", "meanings": ["司法管辖权；职权范围；管辖区域"], "pos": "n.", "category": "谈判", "syllables": "ju·ris·dic·tion", "phonicsNote": "重音在第三音节，/ˌdʒʊr.əsˈdɪk.ʃən/，注意/dɪk/非/dæk/，/ʃən/为弱读", "mnemonic": "juris（法律）+ diction（说、规定）→ 法律说了算的范围", "scene": "跨境合同条款协商与合规责任划分", "root": "", "family": "", "grammar": "不可数名词，常与介词under/in/of连用（e.g., under U.S. jurisdiction; subject to the jurisdiction of the court）", "examples": [{"en": "The contract specifies that disputes fall under Singaporean jurisdiction.", "zh": "合同明确规定争议适用新加坡司法管辖。"}, {"en": "Data storage must comply with the jurisdiction where users are based.", "zh": "数据存储必须符合用户所在地的司法管辖区要求。"}]}, {"word": "convene", "phonetic": "/kənˈviːn/", "m emonic": "con-（共同）+ solid（稳固）+ -ation → 共同加固，形成统一实体", "scene": "企业并购后组织架构或财务报表的统一处理", "root": "", "family": "", "grammar": "不可数名词；常作主语或宾语，搭配介词of（consolidation of departments）；可受strategic, financial等形容词修饰", "examples": [{"en": "The consolidation of regional offices reduced administrative costs by 18%.", "zh": "区域办公室的整合使行政成本降低了18%。"}, {"en": "Financial consolidation must comply with GAAP reporting standards.", "zh": "财务合并必须符合公认会计准则的报告要求。"}]}, {"word": "negotiation", "phonetic": "/nɪˌɡoʊ.ʃiˈeɪ.ʃən/", "meanings": ["谈判；协商"], "pos": "n.", "category": "谈判", "syllables": "ne·go·ti·a·tion", "phonicsNote": "重音在第四音节；-sha- 发 /ʃeɪ/；注意 /nɪˌɡoʊ/ 开头弱读", "mnemonic": "negotia（谐音‘你搞他’）+ -tion → 谈判是双方互动博弈的过程", "scene": "采购合同条款或薪资待遇的面对面磋商", "root": "", "family": "", "grammar": "不可数名词；常用单数形式表达抽象过程；可与preliminary, final, collective等前置修饰语搭配", "examples": [{"en": "Both parties entered negotiation in good faith.", "zh": "双方本着善意进入谈判。"}, {"en": "Salary negotiation typically follows the final interview round.", "zh": "薪资谈判通常在终面之后进行。"}]}, {"word": "interruption", "phonetic": "/ˌɪn.təˈrʌp.ʃən/", "meanings": ["中断；打扰；暂停"], "pos": "n.", "category": "会议", "syllables": "in·ter·rup·tion", "phonicsNote": "重音在第三音节；-rup- 发 /rʌp/，注意短元音", "mnemonic": "inter-（在…之间）+ rupt（破裂）→ 在进行中突然破裂 → 中断", "scene": "线上会议中因网络故障或他人闯入导致流程暂停", "root": "", "family": "", "grammar": "可数名词；单数常指一次事件，复数interruptions泛指多次干扰；常与unexpected, brief, frequent等形容词连用", "examples": [{"en": "Please mute your mic to avoid audio interruption.", "zh": "请关闭麦克风以避免音频中断。"}, {"en": "The meeting resumed after a two-minute interruption.", "zh": "会议在两分钟中断后继续进行。"}]}, {"word": "relevance", "phonetic": "/ˈrel.ə.vəns/", "meanings": ["相关性；切题性"], "pos": "n.", "category": "邮件", "syllables": "rel·e·vance", "phonicsNote": "重音在第一音节，/ˈrel/ 不读 /riˈlev/；注意 -vance 发 /vəns/，非 /væns/", "mnemonic": "re-（再次）+ lev（举起，联想‘让议题被提起’）→ 再次被提起的内容才具相关性", "scene": "撰写商务邮件时强调信息与收件人需求的匹配度", "root": "", "family": "", "grammar": "抽象不可数名词，常与介词 to 连用（relevance to…）；作主语或宾语时不加冠词", "examples": [{"en": "Please clarify the relevance of this data to our Q3 budget review.", "zh": "请说明此数据与我们第三季度预算审核的相关性。"}, {"en": "The relevance of your proposal was highlighted in yesterday’s meeting.", "zh": "您提案的相关性在昨日会议中被重点提及。"}]}, {"word": "principal", "phonetic": "/ˈprɪn.sə.pəl/", "meanings": ["委托人；资金本金；主要负责人"], "pos": "n.", "category": "财务", "syllables": "prin·ci·pal", "phonicsNote": "重音在第一音节；易与形容词 principal /prɪnˈsɪp.əl/（主要的）混淆，此处为名词发音", "mnemonic": "‘prin-’像 ‘king’（君主），委托人或出资方即交易中的‘决策君主’", "scene": "财务往来、贷款协议、投资文件中指代出资方或本金金额", "root": "", "family": "", "grammar": "可数名词；在财务语境中常作单数，与 interest 并列（principal and interest）；无复数形式表‘本金’义", "examples": [{"en": "The loan agreement specifies repayment of principal before interest.", "zh": "贷款协议规定先偿还本金，再支付利息。"}, {"en": "Our firm acts as principal in this transaction, not as an agent.", "zh": "我方在此交易中作为委托人，而非代理人。"}]}, {"word": "endorse", "phonetic": "/ɪnˈdɔːrs/", "meanings": ["背书；公开支持；签署（支票）"], "pos": "v.", "category": "市场", "syllables": "en·dorse", "phonicsNote": "重音在第二音节；/dɔːrs/ 同 door，注意不读 /enˈdɔːrz/（美式 r 弱化但清晰）", "mnemonic": "en-（使…）+ dose（剂量）→ 给品牌‘加剂量’式公开支持，强化信任", "scene": "品牌合作、KOL营销、产品发布中表达权威认可", "root": "", "family": "", "grammar": "及物动词；后接宾语（人/组织/产品）；可用于进行时（is endorsing）表当前营销动作", "examples": [{"en": "A Fortune 500 CEO endorsed our sustainability report on LinkedIn.", "zh": "一位《财富》500强企业CEO在领英上公开支持了我们的可持续发展报告。"}, {"en": "The influencer will endorse the new skincare line starting next month.", "zh": "该网红将从下月起推广这款新护肤系列产品。"}]}, {"word": "wage", "phonetic": "/weɪdʒ/", "meanings": ["工资（尤指按小时/日计）；开展（斗争）"], "pos": "n.", "category": "人力", "syllables": "wage", "phonicsNote": "单音节；/weɪdʒ/ 同 wedge，注意不读 /wɑːdʒ/ 或 /wɒdʒ/", "mnemonic": "wage → ‘way to get cash’（拿钱的方式）→ 按工时结算的现金报酬", "scene": "人力资源沟通、薪酬谈判、劳动合规文档中指基础劳动报酬", "root": "", "family": "", "grammar": "通常用作不可数名词（pay a fair wage）；复数 wages 指‘总工资额’或‘多期工资’，但单数 wage 强调单位报酬标准", "examples": [{"en": "We adjusted the hourly wage to meet state minimum requirements.", "zh": "我们已调整小时工资，以满足州最低工资要求。"}, {"en": "Wage transparency is now required in all job postings.", "zh": "所有职位招聘启事现须注明薪资范围。"}]}, {"word": "maintain", "phonetic": "/meɪnˈteɪn/", "meanings": ["维持；保养；坚持（主张）"], "pos": "v.", "category": "项目与运营", "syllables": "main·tain", "phonicsNote": "重音在第二音节；/meɪn/ 同 main，/ˈteɪn/ 同 tain（如 obtain），注意不省略 /t/", "mnemonic": "main（主要）+ tain（保持）→ 主要任务就是保持系统稳定运行", "scene": "IT系统运维、设备管理、服务SLA履约、流程持续性保障", "root": "", "family": "", "grammar": "及物动词；后接名词/代词作宾语；常用于一般现在时表常规职责（we maintain…）或现在完成时表示持续状态（has maintained…）", "examples": [{"en": "Our team maintains the CRM platform to ensure 99.9% uptime.", "zh": "我团队负责维护CRM平台，确保99.9%正常运行时间。"}, {"en": "She has maintained the same vendor relationship for eight years.", "zh": "她已维持同一供应商关系达八年之久。"}]}, {"word": "consolidate", "phonetic": "/kənˈsɑl.ə.deɪt/", "meanings": ["（使）合并；（使）统一；巩固"], "pos": "v.", "category": "战略与沟通", "syllables": "con·sol·i·date", "phonicsNote": "重音在第二音节，/deɪt/ 不读 /dɪt/", "mnemonic": "con-（一起）+ solid（坚固）→ 拉在一起变坚固 → 合并以增强实力", "scene": "企业并购、财报整合、跨部门协作优化", "root": "", "family": "", "grammar": "及物动词，后接宾语；常用于被动语态表示战略动作完成", "examples": [{"en": "The company will consolidate its three regional offices into one hub by Q3.", "zh": "该公司将于第三季度前将其三个区域办事处合并为一个中心。"}, {"en": "Our market position has been consolidated after the acquisition.", "zh": "收购完成后，我们的市场地位得到巩固。"}]}, {"word": "negotiable", "phonetic": "/nɪˈɡoʊ.ʃi.ə.bəl/", "meanings": ["可协商的；可谈判的"], "pos": "adj.", "category": "谈判", "syllables": "ne·go·tia·ble", "phonicsNote": "重音在第二音节，/ʃi/ 易误读为 /si/；结尾 -able 发 /ə.bəl/", "mnemonic": "negotiate（谈判）+ -able（能…的）→ 能谈的 → 可协商的", "scene": "合同条款讨论、价格磋商、交付条件设定", "root": "", "family": "", "grammar": "作表语或定语，常修饰 terms, price, deadline 等名词；含情态隐含义（非绝对，留有余地）", "examples": [{"en": "The delivery date is negotiable, depending on your production schedule.", "zh": "交货日期可协商，视贵方生产计划而定。"}, {"en": "All pricing terms in this proposal are negotiable except the licensing fee.", "zh": "本方案中所有定价条款均可协商，许可费除外。"}]}, {"word": "interrupt", "phonetic": "/ˌɪn.təˈrʌpt/", "meanings": ["打断；中断（会议、流程、通信）"], "pos": "v.", "category": "会议", "syllables": "in·ter·rupt", "phonicsNote": "重音在第三音节，/ˈrʌpt/ 易误读为 /rəpt/；注意 t 不浊化", "mnemonic": "inter-（在…之间）+ rupt（断裂）→ 在中间断开 → 打断发言或流程", "scene": "线上会议发言插话、议程临时调整、紧急问题插入讨论", "root": "", "family": "", "grammar": "及物动词，主语常为人或事件；可用于进行时强调突发干扰", "examples": [{"en": "Please don’t interrupt while the CFO is presenting the Q2 forecast.", "zh": "请勿在首席财务官汇报二季度预测时打断。"}, {"en": "The system upgrade interrupted our video conference for eight minutes.", "zh": "系统升级导致我们的视频会议中断了八分钟。"}]}, {"word": "reference", "phonetic": "/ˈref.ər.əns/", "meanings": ["参考；参照；推荐信；引文"], "pos": "n.", "category": "邮件", "syllables": "ref·er·ence", "phonicsNote": "重音在第一音节，/ˈref/；-ence 发 /əns/，非 /ens/", "mnemonic": "refer（提及）+ -ence（行为/结果）→ 提及的东西 → 参考依据", "scene": "邮件中引用先前沟通、附上推荐人信息、标注文件版本或条款出处", "root": "", "family": "", "grammar": "不可数名词表‘参考行为’；可数名词表‘具体参考项’（如 a reference, references）", "examples": [{"en": "For your reference, I’ve attached the signed NDA and the latest version of the SOW.", "zh": "供您参考，我已附上已签署的保密协议及最新版工作说明书。"}, {"en": "Could you provide two professional references for the vendor evaluation?", "zh": "您能为供应商评估提供两封职业推荐信吗？"}]}, {"word": "capital", "phonetic": "/ˈkæp.ə.təl/", "meanings": ["资本；资金；本金；（大写）"], "pos": "n.", "category": "财务", "syllables": "cap·i·tal", "phonicsNote": "重音在第一音节，/ˈkæp/；注意 /təl/ 中 /t/ 清晰，不吞音", "mnemonic": "CAP（首字母缩略联想：Cash And Property）→ 实体拥有的钱和资产 → 资本", "scene": "融资提案、资产负债表分析、投资决策、营运资金管理", "root": "", "family": "", "grammar": "不可数名词表抽象资金概念；作可数名词时指‘一家公司的资本总额’或‘某类资本’（e.g., working capital）", "examples": [{"en": "We need $2 million in working capital to scale operations next year.", "zh": "我们明年扩大运营需200万美元的营运资金。"}, {"en": "The startup raised additional capital from Series B investors.", "zh": "该初创公司从B轮融资投资者处募集了额外资本。"}]}, {"word": "influencer", "phonetic": "/ˈɪn.flu.ən.sɚ/", "meanings": ["有影响力的人；常指在社交媒体上能影响受众消费决策的个体"], "pos": "n.", "category": "市场", "syllables": "in·flu·en·cer", "phonicsNote": "重音在第一音节；/ən.sɚ/ 易误读为 /en.ser/", "mnemonic": "influence（影响）+ -er（人）→ 施加影响的人", "scene": "社交媒体营销、KOL合作、品牌推广", "root": "", "family": "", "grammar": "可数名词，作主语或宾语时需搭配冠词或限定词；常与介词on/about搭配表影响对象", "examples": [{"en": "We partnered with a fitness influencer to launch our new protein bar.", "zh": "我们携手一位健身领域网红推出新款蛋白棒。"}, {"en": "The campaign’s success depended heavily on the influencer’s authentic engagement.", "zh": "该活动的成功很大程度上取决于这位网红的真实互动。"}]}, {"word": "payroll", "phonetic": "/ˈpeɪ.rəl/", "meanings": ["工资单；员工薪资总额；也指人力资源部门中负责薪资发放的职能"], "pos": "n.", "category": "人力", "syllables": "pay·roll", "phonicsNote": "重音在第一音节；/rəl/ 非 /rol/，注意/r/后弱读元音", "mnemonic": "pay（支付）+ roll（名册）→ 记录应付款项的员工名册", "scene": "薪资核算、HR系统操作、月度财务结算", "root": "", "family": "", "grammar": "不可数名词；作主语时谓语动词用单数；常与动词process、manage、run连用", "examples": [{"en": "The payroll department must finalize payments before Friday.", "zh": "薪资部门必须在周五前完成付款。"}, {"en": "Outsourcing payroll reduced our administrative overhead by 20%.", "zh": "外包薪资业务使我们的行政开支降低了20%。"}]}, {"word": "repair", "phonetic": "/rɪˈper/", "meanings": ["维修；修复；指恢复设备、系统或流程的正常功能"], "pos": "v./n.", "category": "项目与运营", "syllables": "re·pair", "phonicsNote": "重音在第二音节；/rɪˈper/ 易误读为 /ˈrɪ.pər/（同prepare）", "mnemonic": "re-（再次）+ pair（配对/恢复原状）→ 使失常部分重新匹配功能", "scene": "设备维护、IT系统故障处理、供应链中断后的恢复", "root": "", "family": "", "grammar": "作动词时为及物动词，后接宾语；作名词时为不可数，但可加a进行特指（如a repair）", "examples": [{"en": "The server outage required urgent repair to avoid data loss.", "zh": "服务器宕机需紧急维修，以防数据丢失。"}, {"en": "Contractors will handle all structural repairs before the facility reopens.", "zh": "承包商将在设施重新开放前完成所有结构维修。"}]}, {"word": "restructure", "phonetic": "/ˌriːˈstrʌk.tʃɚ/", "meanings": ["重组；对公司架构、部门职能或业务流程进行系统性调整"], "pos": "v.", "category": "战略与沟通", "syllables": "re·struc·ture", "phonicsNote": "重音在第二音节；/ˈstrʌk.tʃɚ/ 中/tʃ/清晰，勿吞音", "mnemonic": "re-（重新）+ structure（结构）→ 重新搭建组织结构", "scene": "企业转型、并购整合、成本优化方案落地", "root": "", "family": "", "grammar": "及物动词，后接宾语（如the organization, the team）；常用被动语态强调动作承受者", "examples": [{"en": "Leadership decided to restructure the sales division to improve regional responsiveness.", "zh": "管理层决定重组销售部门，以提升区域响应能力。"}, {"en": "The company was restructured to separate its consumer and enterprise units.", "zh": "该公司进行了重组，将消费者业务与企业业务分设。"}]}, {"word": "nonnegotiable", "phonetic": "/ˌnɑːn.nɪˈɡoʊ.ʃi.ə.bəl/", "meanings": ["不可协商的；指条款、条件或要求不得修改或让步"], "pos": "adj.", "category": "谈判", "syllables": "non·ne·go·tia·ble", "phonicsNote": "重音在第三音节；/nɪˈɡoʊ.ʃi.ə.bəl/ 中/ʃi/易误读为/si/", "mnemonic": "non-（不）+ negotiable（可协商的）→ 没有商量余地的", "scene": "合同签署、采购议价、薪酬谈判、合规条款确认", "root": "", "family": "", "grammar": "形容词，多作前置定语或表语；常与is/was或must be连用，强调强制性", "examples": [{"en": "Delivery date is nonnegotiable due to the client’s regulatory deadline.", "zh": "交付日期不可协商，因客户有监管截止期限。"}, {"en": "Confidentiality terms in the NDA are strictly nonnegotiable.", "zh": "保密协议中的保密条款严格不可协商。"}]}, {"word": "intervention", "phonetic": "/ˌɪn.tɚˈven.ʃən/", "meanings": ["干预；介入（尤指为解决问题或防止恶化）"], "pos": "n.", "category": "会议", "syllables": "in·ter·ven·tion", "phonicsNote": "重音在第三音节，/vən/易误读为/vɛn/；注意/tʃən/结尾", "mnemonic": "inter-（在…之间）+ vention（来自vent，'来'）→ 有人‘进来’插手 → 干预", "scene": "跨部门协调会议中，管理层对项目偏差发起及时干预", "root": "", "family": "", "grammar": "不可数名词作主语时谓语动词用单数；常与'by'或'from'搭配表施动者", "examples": [{"en": "The project manager requested an immediate intervention from the steering committee.", "zh": "项目经理请求指导委员会立即介入。"}, {"en": "Early intervention is critical to avoid scope creep in agile sprints.", "zh": "及早干预对避免敏捷冲刺中的范围蔓延至关重要。"}]}, {"word": "refer", "phonetic": "/rɪˈfɝː/", "meanings": ["提交（给某人/某部门处理）；参阅；提及"], "pos": "v.", "category": "邮件", "syllables": "re·fer", "phonicsNote": "重音在第二音节；/rɪˈfɝː/中/ɝː/为卷舌长元音，勿读作/rɛfər/", "mnemonic": "re-（再次）+ fer（带来）→ 把问题‘再带来’给别人处理 → 提交/转交", "scene": "内部邮件中将客户投诉转交至客户服务部处理", "root": "", "family": "", "grammar": "及物动词后接to表示动作方向（refer sth. to sb.）；被动语态常用'is referred to'", "examples": [{"en": "Please refer all billing inquiries to accounts@company.com.", "zh": "请将所有账单咨询发送至accounts@company.com。"}, {"en": "This request has been referred to the compliance team for review.", "zh": "此项请求已转交合规团队审核。"}]}, {"word": "capitalization", "phonetic": "/ˌkæp.ɪ.təl.əˈzeɪ.ʃən/", "meanings": ["资本化；（公司）总市值；大写（格式）"], "pos": "n.", "category": "财务", "syllables": "cap·i·tal·i·za·tion", "phonicsNote": "重音在第四音节；/ˌkæp.ɪ.təl.əˈzeɪ.ʃən/中/əˈzeɪ/易误读为/əˈzaɪ/", "mnemonic": "capital（资本）+ -ization（状态）→ 将支出转为资产入账的过程；也指公司‘资本的体量’", "scene": "财报分析会议中讨论无形资产资本化政策与市场估值差异", "root": "", "family": "", "grammar": "不可数名词；作主语时谓语动词用单数；常与'of'连用引出被资本化的对象", "examples": [{"en": "R&D costs are capitalized only when technical feasibility is demonstrated.", "zh": "研发费用仅在技术可行性得到证实后方可资本化。"}, {"en": "The company’s market capitalization fell below $1 billion after the earnings miss.", "zh": "财报不及预期后，该公司市值跌破10亿美元。"}]}, {"word": "visibility", "phonetic": "/ˌvɪz.əˈbɪl.ə.ti/", "meanings": ["可见度；曝光度；（数据/流程）可追溯性"], "pos": "n.", "category": "市场", "syllables": "vi·si·bil·i·ty", "phonicsNote": "重音在第三音节；/bɪl/易误读为/baɪl/；注意结尾/-ə.ti/非/-i.ti/", "mnemonic": "visible（看得见的）+ -ity（状态）→ ‘能被看见’的程度 → 曝光度/可见性", "scene": "品牌推广复盘会中评估社媒活动对产品搜索量的可见度提升效果", "root": "", "family": "", "grammar": "不可数名词；常与'increased', 'enhanced', 'low'等形容词搭配；'visibility into [sth.]'表对某事的洞察", "examples": [{"en": "Our Q3 campaign improved brand visibility among Gen Z by 42%.", "zh": "我司第三季度活动使Z世代群体中的品牌曝光度提升了42%。"}, {"en": "Real-time dashboards provide greater visibility into supply chain delays.", "zh": "实时仪表板提升了对供应链延误的可追溯性。"}]}, {"word": "pension", "phonetic": "/ˈpen.ʃən/", "meanings": ["养老金；退休金计划"], "pos": "n.", "category": "人力", "syllables": "pen·sion", "phonicsNote": "重音在第一音节；/ˈpen.ʃən/中/ʃən/易误读为/ʃn/或/sən/", "mnemonic": "pension sounds like 'pensioner'（领养老金者）→ 直接关联退休收入", "scene": "HR政策宣讲会中说明企业年金计划的缴费比例与领取条件", "root": "", "family": "", "grammar": "可数名词；单复数同形；常与'plan', 'scheme', 'fund'等词搭配；'pension contributions'为固定搭配", "examples": [{"en": "Employees contribute 5% of salary to the defined-contribution pension plan.", "zh": "员工按工资5%向固定缴款型养老金计划供款。"}, {"en": "The new pension policy takes effect on January 1, 2025.", "zh": "新养老金政策将于2025年1月1日生效。"}]}, {"word": "replace", "phonetic": "/rɪˈpleɪs/", "meanings": ["替换；取代；更换（人员、设备、流程等）"], "pos": "v.", "category": "项目与运营", "syllables": "re·place", "phonicsNote": "重音在第二音节，/rɪ-/ 易误读为 /riː-/", "mnemonic": "re-（再）+ place（放）→ 再放一个进去 → 替换", "scene": "设备故障后启用备用件；员工离职后招聘新人；系统升级中切换新平台", "root": "", "family": "", "grammar": "及物动词，后接宾语；常用于被动语态表示被替换的主体", "examples": [{"en": "We’ll replace the outdated server next Tuesday to minimize downtime.", "zh": "我们将于下周二更换过时的服务器，以最大限度减少停机时间。"}, {"en": "The project manager was replaced after missing two key deadlines.", "zh": "项目经理因连续错过两个关键截止日期而被替换。"}]}, {"word": "restructuring", "phonetic": "/riːˈstrʌk.tʃər.ɪŋ/", "meanings": ["重组；机构或业务结构的调整"], "pos": "n.", "category": "战略与沟通", "syllables": "re·struc·tur·ing", "phonicsNote": "重音在第二音节；/tʃər/ 发音易误作 /tʃɚ/ 或 /ʃər/", "mnemonic": "re-（重新）+ structure（结构）+ -ing（动作/状态）→ 重新搭建结构", "scene": "公司优化汇报线、合并部门、剥离非核心业务、调整股权架构", "root": "", "family": "", "grammar": "动名词作主语或宾语；常与介词of连用引出被重组的对象", "examples": [{"en": "The restructuring of the sales division will be announced at the town hall.", "zh": "销售部门的重组方案将在全员大会上公布。"}, {"en": "Cost savings from restructuring are expected to exceed $2 million annually.", "zh": "重组带来的成本节约预计每年将超过200万美元。"}]}, {"word": "mutually", "phonetic": "/ˈmjuː.tʃu.əl.i/", "meanings": ["相互地；彼此地"], "pos": "adv.", "category": "谈判", "syllables": "mu·tu·al·ly", "phonicsNote": "重音在第一音节；/ˈmjuː/ 易误读为 /mjuːˈtʃuː/", "mnemonic": "mutual（相互的）+ -ly（副词后缀）→ 相互地", "scene": "协商条款时强调双方义务；签署互惠协议；达成共识性表述", "root": "", "family": "", "grammar": "修饰形容词（如 beneficial）、动词（如 agree）或整个从句；常与 mutually exclusive/beneficial/agreed 搭配", "examples": [{"en": "Both parties agreed to keep all negotiation details mutually confidential.", "zh": "双方同意对所有谈判细节承担相互保密义务。"}, {"en": "The NDA ensures that sensitive information is shared only on a mutually agreed basis.", "zh": "保密协议确保敏感信息仅在双方共同同意的基础上共享。"}]}, {"word": "quest sponse", "phonicsNote": "重音在第二音节，/spɑns/ 中/a/发/ɑ/（如father），美式不卷舌；注意p不送气，易误加/t/音", "mnemonic": "re-（再次）+ sponse（=send，联想）→ 再次发送 → 回应", "scene": "会后行动项确认、客户问询跟进、管理层质询答复", "root": "", "family": "", "grammar": "可数名词；常用单数表一次回应（a response），复数responses强调多个独立答复；常接to（response to…）", "examples": [{"en": "Please provide your written response to the proposal by Friday.", "zh": "请于周五前提交您对该提案的书面答复。"}, {"en": "The CEO’s response to the investor’s question clarified the timeline.", "zh": "首席执行官对投资者提问的回应明确了时间表。"}]}, {"word": "invitation", "phonetic": "/ˌɪn.vəˈteɪ.ʃən/", "meanings": ["邀请；请柬；引诱"], "pos": "n.", "category": "邮件", "syllables": "in·vi·ta·tion", "phonicsNote": "重音在第三音节，-ta- 发 /teɪ/，非 /tə/", "mnemonic": "invite + -ation → 动作结果：发出的邀请", "scene": "商务邮件中发送会议、活动或合作邀约", "root": "", "family": "", "grammar": "不可数名词表抽象行为（如发出邀请的动作），也可用作可数名词指具体请柬", "examples": [{"en": "Please confirm your attendance by replying to this invitation.", "zh": "请通过回复本邀请函确认您的出席。"}, {"en": "We’ve sent formal invitations to all key stakeholders for the Q3 strategy review.", "zh": "我们已向所有关键利益相关方发送了第三季度战略评审的正式邀请函。"}]}, {"word": "financing", "phonetic": "/fəˈnæn.sɪŋ/", "meanings": ["融资；资金筹措"], "pos": "n.", "category": "财务", "syllables": "fi·nan·cing", "phonicsNote": "重音在第二音节，-nan- 发 /næn/，非 /nən/", "mnemonic": "finance + -ing → 正在进行的资金安排行为", "scene": "企业讨论贷款、股权融资或项目资金来源时", "root": "", "family": "", "grammar": "动名词作主语或宾语，常与介词for/on搭配表示目的或领域", "examples": [{"en": "The project’s success depends heavily on securing external financing.", "zh": "该项目的成功在很大程度上取决于获得外部融资。"}, {"en": "We’re evaluating financing options for the new manufacturing line.", "zh": "我们正在评估新生产线的融资方案。"}]}, {"word": "distribution", "phonetic": "/ˌdɪs.trəˈbjuː.ʃən/", "meanings": ["分销；分配；分布"], "pos": "n.", "category": "市场", "syllables": "dis·tri·bu·tion", "phonicsNote": "重音在第三音节，-bu- 发 /bjuː/，注意 /j/ 音", "mnemonic": "distribute + -ion → 分发行为的结果", "scene": "制定渠道策略、管理经销商网络或物流覆盖范围时", "root": "", "family": "", "grammar": "不可数名词，常与of连用引出被分配对象（e.g., distribution of products）", "examples": [{"en": "Our distribution network covers over 80% of Tier-2 cities in the region.", "zh": "我们的分销网络覆盖该地区超80%的二线城市。"}, {"en": "Improving product distribution is a top priority for next fiscal year.", "zh": "提升产品分销效率是下财年的首要任务。"}]}, {"word": "insurance", "phonetic": "/ɪnˈʃʊr.əns/", "meanings": ["保险；保障"], "pos": "n.", "category": "人力", "syllables": "in·sur·ance", "phonicsNote": "重音在第二音节，-sur- 发 /ʃʊr/，非 /sɜr/；注意 /ʃ/ 音", "mnemonic": "insure + -ance → 提供保障的行为或状态", "scene": "员工福利沟通、劳动合同附件或HR政策说明中", "root": "", "family": "", "grammar": "不可数名词，通常不加冠词；与health/life等形容词连用构成复合概念", "examples": [{"en": "All full-time employees are enrolled in the company’s group health insurance plan.", "zh": "所有全职员工均已加入公司团体健康保险计划。"}, {"en": "The offer letter outlines salary, bonus structure, and insurance benefits.", "zh": "录用通知书列明了薪资、奖金结构及保险福利。"}]}, {"word": "install", "phonetic": "/ɪnˈstɔːl/", "meanings": ["安装；部署；使就职"], "pos": "v.", "category": "项目与运营", "syllables": "in·stall", "phonicsNote": "重音在第二音节，-stall- 发 /stɔːl/，/ɔː/ 如law，非 /æl/", "mnemonic": "in + stall（原义‘放置’）→ 放入并固定到位", "scene": "IT系统上线、设备启用或新流程落地执行阶段", "root": "", "family": "", "grammar": "及物动词，后接直接宾语；过去式/分词为 installed，无双写", "examples": [{"en": "The vendor will install the new CRM software during the weekend maintenance window.", "zh": "供应商将在周末维护窗口期安装新客户关系管理软件。"}, {"en": "Before we install the updated safety protocol, all team leads must complete training.", "zh": "在实施更新后的安全规程前，所有团队负责人须完成培训。"}]}, {"word": "divest", "phonetic": "/dɪˈvest/", "meanings": ["剥离（资产、业务或股份）"], "pos": "v.", "category": "战略与沟通", "syllables": "di·vest", "phonicsNote": "重音在第二音节，/vɛst/ 不读作 /vɪst/", "mnemonic": "di-（分开）+ vest（穿→象征持有）→ 把持有的东西脱掉 → 剥离", "scene": "企业战略重组、退出非核心业务、合规性资产处置", "root": "", "family": "", "grammar": "及物动词，常接宾语（如 assets, stake, division）；被动语态常见于正式公告", "examples": [{"en": "The company plans to divest its underperforming retail division by Q3.", "zh": "该公司计划在第三季度前剥离其业绩不佳的零售事业部。"}, {"en": "Regulatory pressure forced the firm to be divested of its telecom assets.", "zh": "监管压力迫使该公司剥离其电信资产。"}]}, {"word": "fairness", "phonetic": "/ˈfer.nəs/", "meanings": ["公平性；公正性"], "pos": "n.", "category": "谈判", "syllables": "fair·ness", "phonicsNote": "/fɛr/ 同 'far'，非 /fer/；结尾 -ness 发 /nəs/，轻读", "mnemonic": "fair（公平）+ -ness（状态）→ 公平的状态", "scene": "合同条款协商、利益分配讨论、第三方调解过程", "root": "", "family": "", "grammar": "不可数名词，常与介词 of 连用（fairness of terms），或作主语/宾语受抽象修饰（e.g., perceived fairness）", "examples": [{"en": "Both parties emphasized fairness in the royalty rate calculation.", "zh": "双方均强调特许权使用费率计算的公平性。"}, {"en": "The mediator ensured fairness throughout the negotiation process.", "zh": "调解员确保了整个谈判过程的公正性。"}]}, {"word": "alignment", "phonetic": "/əˈlaɪn.mənt/", "meanings": ["一致；协同；对齐"], "pos": "n.", "category": "会议", "syllables": "a·line·ment", "phonicsNote": "重音在第二音节；/aɪ/ 如 'eye'，非 /i/；-ment 发 /mənt/", "mnemonic": "align（使对齐）+ -ment（结果）→ 达成一致的结果", "scene": "跨部门目标同步会、项目启动会、年度战略对齐会议", "root": "", "family": "", "grammar": "不可数名词，常用搭配：strategic alignment, team alignment, alignment on goals；常作主语或宾语，后接介词 with/on/about", "examples": [{"en": "Today’s session focuses on alignment across sales and marketing KPIs.", "zh": "今日会议聚焦销售与市场关键绩效指标的一致性。"}, {"en": "We need full alignment on the timeline before finalizing the budget.", "zh": "在敲定预算前，我们必须就时间表达成完全一致。"}]}, {"word": "invite", "phonetic": "/ɪnˈvaɪt/", "meanings": ["邀请；招致（尤指负面结果）"], "pos": "v.", "category": "邮件", "syllables": "in·vite", "phonicsNote": "重音在第二音节；/aɪ/ 如 'eye'，注意不要误读为 /ɪt/", "mnemonic": "in（进入）+ vite（联想 'vital'）→ 让重要的人进入会议/流程 → 邀请", "scene": "发送会议邀请、征询意见、发起协作请求", "root": "", "family": "", "grammar": "及物动词；正式商务邮件中常用被动式（e.g., You are invited…）或委婉主动式（We invite you…）；后接 to-infinitive 表目的", "examples": [{"en": "We invite you to review the draft proposal and share feedback by Friday.", "zh": "诚邀您审阅提案初稿，并于周五前反馈意见。"}, {"en": "You are invited to join the QBR meeting scheduled for next Tuesday.", "zh": "诚邀您参加定于下周二举行的季度业务回顾会议。"}]}, {"word": "refinance", "phonetic": "/ˌriː.fɪˈnæns/", "meanings": ["再融资；重新安排贷款"], "pos": "v.", "category": "财务", "syllables": "re·fi·nance", "phonicsNote": "重音在第三音节；/ˈnæns/ 同 'dance'，非 /nəns/；re- 发 /riː/", "mnemonic": "re-（再次）+ finance（融资）→ 再次进行融资操作", "scene": "债务结构优化、利率下调窗口期、并购资金安排", "root": "", "family": "", "grammar": "及物动词，常接 loan, debt, mortgage 等宾语；可用于主动/被动语态，现在分词 refinance-ing 表持续动作（e.g., refinancing existing debt）", "examples": [{"en": "The firm will refinance $200M in senior debt at a lower fixed rate.", "zh": "该公司将以更低的固定利率对2亿美元优先债务进行再融资。"}, {"en": "Ongoing refinancing efforts aim to extend maturities and reduce interest costs.", "zh": "当前的再融资工作旨在延长到期期限并降低利息成本。"}]}, {"word": "distributor", "phonetic": "/dɪˈstrɪb.jə.t̬ɚ/", "meanings": ["分销商；经销商"], "pos": "n.", "category": "市场", "syllables": "dis·trib·u·tor", "phonicsNote": "重音在第二音节，/jə/易弱读为/ə/，注意/t̬ɚ/为美式闪音", "mnemonic": "distribute（分发）+ -or（人）→ 分发货物的人", "scene": "渠道管理与销售网络搭建", "root": "", "family": "", "grammar": "可数名词，作主语或宾语时需搭配冠词或限定词；常与介词for、of连用表所属关系", "examples": [{"en": "Our new distributor in Mexico will handle logistics and after-sales support.", "zh": "我们在墨西哥的新分销商将负责物流及售后服务。"}, {"en": "We’re evaluating three potential distributors for the Southeast Asia market.", "zh": "我们正在评估三家东南亚市场的潜在分销商。"}]}, {"word": "allowance", "phonetic": "/əˈlaʊ.əns/", "meanings": ["津贴；补贴；允许额度"], "pos": "n.", "category": "人力", "syllables": "al·low·ance", "phonicsNote": "首音节弱读/ə/，第二音节重读/ˈlaʊ/，末音节/-əns/不可读作/-æns/", "mnemonic": "allow（允许）+ -ance（名词后缀）→ 公司‘允许’员工获得的额外款项", "scene": "薪酬福利设计与HR政策执行", "root": "", "family": "", "grammar": "不可数名词（泛指津贴制度）或可数名词（指具体某类津贴），常与for、on、as等介词搭配说明用途", "examples": [{"en": "The relocation allowance covers temporary housing for up to six weeks.", "zh": "搬迁津贴涵盖最长六周的临时住宿费用。"}, {"en": "Employees receive a monthly transportation allowance based on job level.", "zh": "员工按职级领取月度交通补贴。"}]}, {"word": "implementation", "phonetic": "/ˌɪm.plə.menˈteɪ.ʃən/", "meanings": ["实施；执行；落实"], "pos": "n.", "category": "项目与运营", "syllables": "im·ple·men·ta·tion", "phonicsNote": "重音在第四音节/teɪ/，/ˌɪm/易误读为/ɪm/，注意/menˈteɪ/中/t/清晰送气", "mnemonic": "implement（实施动词）+ -ation（名词化）→ 把计划‘变成现实’的过程", "scene": "IT系统上线、流程优化落地、新政策推行", "root": "", "family": "", "grammar": "抽象不可数名词，常与of连用引出被实施的内容；作主语时谓语动词用单数", "examples": [{"en": "The implementation of the new CRM system begins next Monday.", "zh": "新客户关系管理系统将于下周一启动实施。"}, {"en": "Delayed implementation affected Q3 sales training rollout.", "zh": "实施延迟影响了第三季度销售培训的开展。"}]}, {"word": "globalization", "phonetic": "/ˌɡlo.bə.ləˈzeɪ.ʃən/", "meanings": ["全球化"], "pos": "n.", "category": "战略与沟通", "syllables": "glob·al·i·za·tion", "phonicsNote": "重音在第四音节/zeɪ/，/ˌɡlo.bə.lə/中第二个/ə/易被忽略，注意/z/非/s/", "mnemonic": "global（全球的）+ -ization（状态名词）→ 世界变‘平’的过程", "scene": "跨国品牌定位、跨文化团队协作、国际合规沟通", "root": "", "family": "", "grammar": "不可数抽象名词，作主语时谓语动词用单数；常与of连用引出全球化对象（如markets, supply chains）", "examples": [{"en": "Globalization has increased demand for multilingual customer service teams.", "zh": "全球化提升了对多语种客服团队的需求。"}, {"en": "Our strategy addresses risks associated with rapid globalization.", "zh": "我们的战略应对快速全球化带来的相关风险。"}]}, {"word": "flexibility", "phonetic": "/ˌflek.səˈbɪl.ə.t̬i/", "meanings": ["灵活性；弹性"], "pos": "n.", "category": "谈判", "syllables": "flex·i·bil·i·ty", "phonicsNote": "重音在第三音节/bɪl/，/ˌflek.sə/中/ə/易弱化，注意/t̬i/为美式闪音结尾", "mnemonic": "flex（弯曲）+ -ibility（可…性）→ 能‘弯而不折’的协商姿态", "scene": "合同条款磋商、交付时间调整、付款条件协商", "root": "", "family": "", "grammar": "不可数名词，常与in、with、regarding等介词搭配说明灵活领域；形容词flexible需变形为名词形式", "examples": [{"en": "We value flexibility in delivery schedules during peak season.", "zh": "我们在旺季重视交货时间安排的灵活性。"}, {"en": "The supplier showed flexibility by accepting partial payments.", "zh": "该供应商通过接受分期付款展现了灵活性。"}]}, {"word": "synchronize", "phonetic": "/ˈsɪŋ.krə.naɪz/", "meanings": ["使同步；使协调一致"], "pos": "v.", "category": "会议", "syllables": "sin·chro·nize", "phonicsNote": "重音在第一音节，/ŋk/连读易误读为/nk/；注意结尾/-aɪz/非/-ɪz/", "mnemonic": "syn-（共同）+ chron（时间）→ 共同时间 → 同步", "scene": "跨时区团队会议安排、日程系统对接、项目里程碑对齐", "root": "", "family": "", "grammar": "及物动词，后接宾语（如 schedules, calendars, systems）；常用于祈使句或被动语态（e.g., be synchronized）", "examples": [{"en": "Please synchronize your calendar with the project timeline before Friday.", "zh": "请在周五前将您的日历与项目时间表同步。"}, {"en": "All regional sales reports must be synchronized by 9 a.m. EST.", "zh": "所有区域销售报告须于美国东部时间上午9点前完成同步。"}]}, {"word": "RSVP", "phonetic": "/ɑːrˌesˌviːˈpiː/", "meanings": ["请回复（法语 répondez s’il vous plaît 的缩写）"], "pos": "v./n.", "category": "邮件", "syllables": "R·S·V·P", "phonicsNote": "全大写字母逐个读音；/ɑːr/开头，勿读作‘rsvp’单音节词", "mnemonic": "R=Reply, S=Soon, V=Very, P=Please → ‘请尽快回复’", "scene": "正式会议邀请函、线上研讨会注册确认、客户活动报名跟进", "root": "", "family": "", "grammar": "作动词时为及物动词，常接宾语（e.g., RSVP to the event）；作名词时不可数，常与‘by’连用（e.g., RSVP by May 10）", "examples": [{"en": "Kindly RSVP to the kickoff meeting invitation by Wednesday.", "zh": "请于周三前回复本次启动会邀请函。"}, {"en": "RSVP is required for catering purposes.", "zh": "为便于安排餐饮，请务必回复。"}]}, {"word": "loan", "phonetic": "/loʊn/", "meanings": ["贷款；借出的款项"], "pos": "n.", "category": "财务", "syllables": "loan", "phonicsNote": "单音节，/oʊ/如‘go’，勿读作/lʌn/；易与‘lawn’同音但义异", "mnemonic": "loan sounds like ‘own’ — when you take a loan, you don’t own the money yet", "scene": "企业融资申请、银行授信审批、内部资金调拨协议", "root": "", "family": "", "grammar": "可数名词；常用搭配：apply for a loan, repay a loan, secure a loan；介词with（lender）或from（source）", "examples": [{"en": "The company applied for a short-term loan to cover Q3 payroll.", "zh": "该公司申请了一笔短期贷款以支付第三季度薪资。"}, {"en": "Interest on the loan is calculated monthly.", "zh": "该贷款利息按月计算。"}]}, {"word": "wholesaler", "phonetic": "/ˈhoʊl.seɪ.lɚ/", "meanings": ["批发商；向零售商批量供货的企业"], "pos": "n.", "category": "市场", "syllables": "whole·sal·er", "phonicsNote": "重音在第一音节；/seɪ/如‘say’，非/səl/；-er发/ɚ/轻音", "mnemonic": "whole + seller → sells in the whole (bulk), not piece by piece", "scene": "B2B渠道拓展、供应链谈判、新品上市分销策略制定", "root": "", "family": "", "grammar": "可数名词；常与介词‘to’（e.g., sell to a wholesaler）或‘for’（e.g., distributor for a wholesaler）搭配；定语从句中作主语或宾语", "examples": [{"en": "We partnered with a national wholesaler to expand distribution in the Midwest.", "zh": "我们已与一家全国性批发商合作，以拓展中西部地区的分销渠道。"}, {"en": "The wholesaler offers volume discounts on orders over $50,000.", "zh": "该批发商对超过5万美元的订单提供批量折扣。"}]}, {"word": "bonus", "phonetic": "/ˈboʊ.nəs/", "meanings": ["奖金；额外奖励"], "pos": "n.", "category": "人力", "syllables": "bo·nus", "phonicsNote": "重音在第一音节；/oʊ/如‘go’；复数bonuses /ˈboʊ.nə.sɪz/，非*-i", "mnemonic": "bonus sounds like ‘bonus points’ — extra value beyond base pay", "scene": "年度绩效评估、销售激励方案设计、入职签约奖励发放", "root": "", "family": "", "grammar": "可数名词；常用搭配：receive a bonus, qualify for a bonus, tie bonus to KPIs；介词on（e.g., bonus on revenue）或for（e.g., bonus for retention）", "examples": [{"en": "Sales representatives earn a quarterly bonus based on target achievement.", "zh": "销售代表根据目标达成情况获得季度奖金。"}, {"en": "The sign-on bonus is paid after 60 days of employment.", "zh": "签约奖金将于入职满60天后发放。"}]}, {"word": "execution", "phonetic": "/ˌɛk.səˈkjuː.ʃən/", "meanings": ["执行；实施；完成"], "pos": "n.", "category": "项目与运营", "syllables": "ex·e·cu·tion", "phonicsNote": "重音在第三音节，/kjuː/ 不读 /kuː/", "mnemonic": "执行（execution）像‘一击必中’——'ex-'（出）+ 'cut'（切）+ '-ion'（动作），任务一刀到位", "scene": "项目交付阶段的进度把控与结果达成", "root": "", "family": "", "grammar": "不可数名词，常与定冠词the或所有格连用；作主语时谓语动词用单数", "examples": [{"en": "The execution of the Q3 marketing plan is on schedule.", "zh": "第三季度营销计划的执行进度正常。"}, {"en": "Poor execution led to a 15% delay in product launch.", "zh": "执行不力导致产品上市推迟了15%。"}]}, {"word": "internationalization", "phonetic": "/ˌɪn.tər.næʃ.ən.əl.əˈzeɪ.ʃən/", "meanings": ["国际化；使具备国际适应性"], "pos": "n.", "category": "战略与沟通", "syllables": "in·ter·na·tion·al·i·za·tion", "phonicsNote": "重音在倒数第二音节 /əˈzeɪ.ʃən/；注意 /ʃən/ 结尾，非 /sən/", "mnemonic": "international（国际的）+ -ization（变成…的过程）→ 让产品/业务‘走向世界’的过程", "scene": "企业拓展海外市场前对产品、流程与沟通体系的适配改造", "root": "", "family": "", "grammar": "抽象不可数名词；常作主语或宾语，后接of短语说明对象", "examples": [{"en": "Our platform’s internationalization includes right-to-left language support.", "zh": "我们平台的国际化包括对从右向左书写的语言支持。"}, {"en": "Internationalization must precede localization in global rollout.", "zh": "在全球推广中，国际化必须先于本地化。"}]}, {"word": "tolerance", "phonetic": "/ˈtɒl.ər.əns/", "meanings": ["容忍度；承受限度；公差（工程）"], "pos": "n.", "category": "谈判", "syllables": "tol·er·ance", "phonicsNote": "美式常弱化首音节 /ˈtɑː.lər.əns/，注意 /r/ 卷舌及 /əns/ 轻读", "mnemonic": "tolerate（容忍）+ -ance（状态）→ 谈判中‘能忍多少’的底线刻度", "scene": "跨文化商务谈判中对条款弹性、时间偏差或风格差异的接受边界", "root": "", "family": "", "grammar": "不可数名词；可与介词for/of搭配，表‘对…的容忍度’", "examples": [{"en": "The buyer has low tolerance for payment delays beyond 30 days.", "zh": "买方对超过30天的付款延迟容忍度很低。"}, {"en": "We discussed tolerance for scope changes during the kickoff call.", "zh": "我们在启动会上讨论了对范围变更的容忍度。"}]}, {"word": "coordination", "phonetic": "/koʊˌɔːr.dəˈneɪ.ʃən/", "meanings": ["协调；协作；配合"], "pos": "n.", "category": "会议", "syllables": "co·or·di·na·tion", "phonicsNote": "重音在第四音节 /neɪ.ʃən/；/də/ 易弱读为 /də/ 或 /dɪ/", "mnemonic": "co-（共同）+ ordination（排序/组织）→ 多方‘排好队、步调一致’", "scene": "跨部门会议中议程同步、任务分派与时间节点对齐", "root": "", "family": "", "grammar": "不可数名词；常与lack of、improve、require等动词/名词搭配", "examples": [{"en": "Effective coordination among teams ensured the meeting ended on time.", "zh": "团队间高效协调确保会议准时结束。"}, {"en": "Please confirm your availability to support coordination for next week’s workshop.", "zh": "请确认您是否可协助安排下周研讨会的相关协调工作。"}]}, {"word": "subscribe", "phonetic": "/səbˈskraɪb/", "meanings": ["订阅；注册（服务）；同意（观点）"], "pos": "v.", "category": "邮件", "syllables": "sub·scribe", "phonicsNote": "重音在第二音节 /ˈskraɪb/；/b/ 不送气，/skraɪb/ 易误读为 /skriːb/", "mnemonic": "sub-（在下）+ scribe（写）→ ‘写下名字加入名单’即订阅", "scene": "用户通过邮件列表注册接收公司资讯、产品更新或活动通知", "root": "", "family": "", "grammar": "及物动词，后接to + 名词/动名词；subscribe to a service/list 是固定搭配", "examples": [{"en": "You can subscribe to our newsletter with one click.", "zh": "您可一键订阅我们的电子简报。"}, {"en": "All new hires must subscribe to the internal policy alerts.", "zh": "所有新员工须订阅内部 function log(){const k=dayKey();return db.logs[k]||(db.logs[k]={newIds:[],reviewIds:[],correct:0,attempts:0,practices:0,checked:false,xp:0})}
function activity(type,id){let l=log();if(type==='new'&&!l.newIds.includes(id)){l.newIds.push(id);l.xp+=10}if(type==='review'&&!l.reviewIds.includes(id)){l.reviewIds.push(id);l.xp+=5}if(type==='practice'){l.practices++;l.xp+=2}if(l.newIds.length>=db.settings.newGoal&&l.reviewIds.length>=db.settings.reviewGoal){l.checked=true;rewardSquirrel()}save()}
function streak(){let k=dayKey(),n=0;if(!db.logs[k]?.checked)k=previousDay(k);while(db.logs[k]?.checked){n++;k=previousDay(k)}return n}
function totals(){return Object.values(db.logs).reduce((a,l)=>({xp:a.xp+(l.xp||0),attempts:a.attempts+(l.attempts||0),correct:a.correct+(l.correct||0),practices:a.practices+(l.practices||0)}),{xp:0,attempts:0,correct:0,practices:0})}

function render(){const active=['detail','quiz','flash'].includes(view)?(view==='detail'?origin:'review'):view; $('tabs').innerHTML=[['today','今日'],['library','词库'],['add','录入'],['review','复习'],['progress','成长']].map(([v,t])=>`<button class="${active===v?'active':''}" onclick="go('${v}')"><svg viewBox="0 0 24 24">${icons[v]}</svg>${t}</button>`).join('');({today:renderToday,library:renderLibrary,add:renderAdd,review:renderReview,progress:renderProgress,settings:renderSettings,detail:renderDetail,quiz:renderQuiz,flash:renderFlash}[view]||renderToday)()}
function heading(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">MAKE IT PART OF YOUR DAY</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function status(w){return `<span class="badge status-${w.status}">${({new:'新词',weak:'模糊',mastered:'已掌握'})[w.status]||'新词'}</span>`}
function wordrow(w){return `<button class="wordrow" onclick="openWord('${w.id}')"><div><strong>${esc(w.word)}</strong><p class="sub">${esc(w.meanings?.join('；')||'尚未生成释义')} · ${esc(w.category||'未分类')}</p></div><div class="row">${w.generating?'<span class="pill">生成中</span>':w.generationError?'<span class="pill">待重试</span>':''}${status(w)}<span class="arrow">›</span></div></button>`}
function dueWords(){return db.words.filter(w=>w.learned&&w.due<=Date.now())}
function shuffleItems(list){let a=list.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function upgradeSeed(){if(SEED.length<=200||db.seedRevision>=SEED.length)return;let have=new Set(db.words.map(w=>norm(w.word))),deleted=new Set(db.deletedSeeds||[]);for(let x of SEED.slice(200)){if(!have.has(norm(x.word))&&!deleted.has(norm(x.word))){db.words.push(normalizeWord(x));have.add(norm(x.word))}}db.categories=[...new Set([...db.categories,...SEED.map(x=>x.category)])];db.seedRevision=SEED.length}
function todayCandidates(){let builtins=new Set(SEED.map(w=>norm(w.word)));let custom=db.words.filter(w=>!w.learned&&!builtins.has(norm(w.word))).slice().reverse();let remaining=db.words.filter(w=>!w.learned&&builtins.has(norm(w.word)));let score=w=>{let h=2166136261;for(let c of dayKey()+w.word)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};remaining.sort((a,b)=>score(a)-score(b));return [...custom,...remaining]}
function accountCard(){return `<section class="card"><h3>我们一起进步</h3>${learningAccount?`<p class="sub">当前账户：${esc(learningAccount.name)}。学习记录独立，只分享进度摘要。</p><div class="row" style="margin-top:14px"><button class="secondary" onclick="showPartnerProgress()">双方进度与排行榜</button><button class="plain" onclick="logoutAccount()">退出 / 切换账户</button></div>`:`<p class="sub">为你和男朋友各创建一个账户。此阶段账户保存在本机后台，跨手机同步还需线上部署。</p><label>账户名称</label><input id="accountName" autocomplete="username" maxlength="20" placeholder="如：Yuki"><label>密码（至少8个字符）</label><input id="accountPassword" type="password" autocomplete="current-password"><div class="row" style="margin-top:14px"><button class="primary" onclick="accountLogin(false)">登录</button><button class="secondary" onclick="accountLogin(true)">创建账户</button></div>`}<div id="partnerProgress" style="margin-top:14px"></div></section>`}
function switchLocalProfile(user){stopAudio();learningAccount=user;activeStorageKey=KEY+':account:'+user.id;let raw=localStorage.getItem(activeStorageKey);if(raw)db=JSON.parse(raw);else if(!localStorage.getItem(KEY+':claimed')){localStorage.setItem(KEY+':claimed',user.id)}else db=base();upgradeSeed();filter='';search='';weakOnly=false;currentId=null;feedback='';save();render()}
async function refreshAccount(){try{let x=await backendRequest('/api/accounts/me');if(x.user)switchLocalProfile(x.user)}catch(e){}}
async function accountLogin(create){let name=$('accountName').value.trim(),password=$('accountPassword').value;try{let x=await backendRequest('/api/accounts/'+(create?'register':'login'),{name,password});$('accountPassword').value='';switchLocalProfile(x.user);toast('已进入 '+x.user.name+' 的学习空间')}catch(e){toast(e.message)}}
async function logoutAccount(){try{await backendRequest('/api/accounts/logout',{ok:true});learningAccount=null;activeStorageKey=KEY;db=JSON.parse(localStorage.getItem(KEY)||'null')||base();view='settings';render()}catch(e){toast(e.message)}}
async function syncProgress(){if(!learningAccount)return;let l=log();try{await backendRequest('/api/accounts/progress',{...weekSummary(),day:dayKey(),newToday:l.newIds.length,reviewToday:l.reviewIds.length,streak:streak(),mastered:db.words.filter(w=>w.status==='mastered').length,totalLearned:db.words.filter(w=>w.learned).length,fedDays:(db.petRewards||[]).length,feedCount:db.petFeedCount||0,achievements:achievementList().filter(a=>a.on).length,newGoal:db.settings.newGoal,reviewGoal:db.settings.reviewGoal})}catch(e){}}

function awardTestAcorn(id){db.acornAwards=db.acornAwards||{};let key=dayKey()+':'+id;if(db.acornAwards[key])return false;db.acornAwards[key]=true;db.acorns=(db.acorns||0)+1;return true}

let routeBusy=false;
function routeContext(){let l=log();return {day:dayKey(),newGoal:db.settings.newGoal,reviewGoal:db.settings.reviewGoal,newCompleted:l.newIds.length,reviewCompleted:l.reviewIds.length,due:dueWords().length,weak:db.words.filter(w=>w.status==='weak').length,mastered:db.words.filter(w=>w.status==='mastered').length,accuracy:l.attempts?Math.round(l.correct/l.attempts*100):null,practiceCount:l.practices,checked:l.checked}}
function routeKey(){let c=routeContext();return [c.day,c.newGoal,c.reviewGoal,c.newCompleted>=c.newGoal,c.reviewCompleted>=c.reviewGoal,c.due>0,c.checked].join(':')}
function dailyRouteHTML(newRemaining,reviewRemaining){let route=db.dailyRoute?.day===dayKey()?db.dailyRoute:null;let steps=route?.steps||[{title:'唤醒记忆',action:`先复习到期表达，还需完成 ${reviewRemaining} 项复习。`,reason:'主动回忆，让记忆更牢。'},{title:'学以致用',action:`优先学新录入的表达，还需 ${newRemaining} 项。听原音、跟读，再造句。`,reason:'少量新学，把词放进工作场景。'},{title:'测试与巩固',action:'用小测试检查掌握情况；答对获得橡果，错题提前复习。',reason:'完成后查看明天的复习安排。'}];return `<div class="card"><div class="row between"><span class="badge">${route?'AI 今日建议':'基础学习路线'}</span><button class="pill" id="routeBtn" ${routeBusy?'disabled':''} onclick="generateDailyRoute(true)">${routeBusy?'正在规划…':'AI 更新路线'}</button></div>${steps.map((x,i)=>`<div style="margin-top:15px"><strong>0${i+1} · ${esc(x.title)}</strong><p class="sub">${esc(x.action)}</p></div>${i<2?'<div class="rule"></div>':''}`).join('')}<p class="tiny" style="margin-top:15px">${route?'基于学习进度摘要生成，建议不改变你的目标和复习排期。':'AI 未生成时仍可按基础路线学习。'}${db.routeError?'<br>'+esc(db.routeError):''}</p></div>`}
async function generateDailyRoute(force=false){let k=routeKey();if(routeBusy||!hasAI()||(!force&&db.routeAttemptKey===k))return;let c=routeContext(),count=db.routeCalls?.day===c.day?db.routeCalls.count:0;if(count>=3){if(force)toast('今天已生成3次路线，明天再更新。');return}routeBusy=true;db.routeAttemptKey=k;db.routeCalls={day:c.day,count:count+1};save();if(view==='today')renderToday();try{let x=await aiJSON(`你是商务英语学习教练。根据今日进度摘要设计恰好三步今日路线：${JSON.stringify(c)}。第一步到期复习和薄弱回忆，第二步少量新学、跟读和造句，第三步客观小测试、错题回流和下次复习。目标已达成时建议巩固或休息，不强加大量新词。准确率样本少时不要断言掌握程度。使用明快中文，每步只写一个具体动作，action不超过25个汉字，title不超过6个汉字，reason留空。不提年龄性别国籍；不声称查看了个人聊天。不得更改目标或复习算法。返回 JSON {"steps":[{"title":"短标题","action":"具体动作，最多25字","reason":""}]}，steps必须三个。`);if(!Array.isArray(x.steps)||x.steps.length!==3||!x.steps.every(t=>typeof t.title==='string'&&typeof t.action==='string'&&t.title.trim()&&t.action.trim()))throw Error('路线内容不完整，请稍后重试');db.dailyRoute={day:c.day,key:k,createdAt:new Date().toISOString(),steps:x.steps.map(t=>({title:t.title.slice(0,20),action:t.action.slice(0,160),reason:typeof t.reason==='string'?t.reason.slice(0,80):''}))};db.routeError='';save()}catch(e){db.routeError='AI 路线暂未更新：'+e.message;save()}finally{routeBusy=false;if(view==='today')renderToday()}}
let quickMatchIds=[];
function quickLookup(text){let q=norm(text);quickMatchIds=[];if(!q){$('quickResults').innerHTML='';return}let matches=db.words.filter(w=>norm(w.word+' '+(w.meanings||[]).join(' ')).includes(q));matches.sort((a,b)=>(norm(b.word)===q)-(norm(a.word)===q));let shown=matches.slice(0,5);quickMatchIds=shown.map(w=>w.id);$('quickResults').innerHTML=shown.length?shown.map(wordrow).join(''):'<p class="tiny">词库中暂无匹配内容，可到录入页添加。</p>'}
function openQuickResult(){if(quickMatchIds.length)openWord(quickMatchIds[0],'today')}
function renderToday(){let l=log(),due=dueWords(),unlearned=todayCandidates(),p=planToday(),newRemaining=Math.max(0,(p?.new_count??db.settings.newGoal)-l.newIds.length),rRemaining=Math.max(0,(p?.review_count??db.settings.reviewGoal)-l.reviewIds.length);$('main').innerHTML=heading('让英语，成为你的底气。',new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}),`<span class="badge">连续 ${streak()} 天</span>`)+`<div class="today-top-grid"><section class="card hero"><div class="eyebrow">YOUR DAILY MOMENTUM</div><h2>${due.length?'先唤醒记忆，再学一点新知。':'今天的小积累，明天的从容表达。'}</h2><p class="sub">新学 ${l.newIds.length}/${db.settings.newGoal} · 复习 ${l.reviewIds.length}/${db.settings.reviewGoal}</p><div class="progress"><i style="width:${Math.min(100,(Math.min(l.newIds.length,db.settings.newGoal)+Math.min(l.reviewIds.length,db.settings.reviewGoal))/(db.settings.newGoal+db.settings.reviewGoal)*100)}%"></i></div><div class="row" style="margin-top:22px"><button class="primary" onclick="startDaily()">开始今日学习 →</button><span class="tiny" style="color:#d6e6ff">约 10–15 分钟</span></div><div class="art" aria-hidden="true"></div></section>${squirrelCard()}</div><div class="stats"><div class="stat"><strong>${due.length}</strong><span>到期复习</span></div><div class="stat"><strong>${db.words.filter(w=>w.status==='mastered').length}</strong><span>牢固掌握</span></div><div class="stat"><strong>${totals().xp}</strong><span>积累的成长值</span></div></div><div class="grid"><div><div class="section-title"><h3>今天的路线</h3><small>少量 · 多次 · 主动回忆</small></div>${dailyRouteHTML(newRemaining,rRemaining)}</div><div><section class="quick-lookup-card"><div class="section-title"><h3>快速查词</h3></div><input id="quickLookup" aria-label="快速查词" placeholder="输入英文或中文…" style="margin-top:12px" oninput="quickLookup(this.value)" onkeydown="if(event.key==='Enter')openQuickResult()"><div id="quickResults" class="list" style="margin-top:10px"></div></section><div class="section-title"><h3>${p?'学习计划 · 今日':'开口练一练'}</h3><button class="pill" onclick="go('progress')">查看计划 ›</button></div><div class="card"><span class="badge">${p?'DAY '+p.day:'口语训练'}</span><h3 style="margin-top:12px">${esc(p?.title||'把一个词，变成一句话。')}</h3><p class="sub">${esc(p?.note||'复制学习提示词到 ChatGPT，用语音模式模拟一场商务对话。')}</p><button class="secondary" style="margin-top:16px" onclick="${p?'startPlanDay('+Number(p.day)+')':'dailyChat()'}">${p?'开始今日任务':'生成 ChatGPT 练习提示词'} →</button></div></div></div><div class="section-title"><h3>今日新词</h3><button class="pill" onclick="go('library')">全部词库 ›</button></div><p class="tiny" style="margin-bottom:10px">优先学习新录入的内容，再从未学词库推荐。</p><div class="list">${unlearned.slice(0,3).map(wordrow).join('')||'<div class="empty">新词都已开始学习。去复习巩固吧。</div>'}</div>`;if(hasAI()&&!routeBusy&&db.routeAttemptKey!==routeKey())generateDailyRoute()}
function startDaily(){let l=log(),due=dueWords();if(due.length&&l.reviewIds.length<db.settings.reviewGoal){startReview('quiz');return}let p=planToday();if(p&&!p.done){startPlanDay(p.day);return}let w=todayCandidates()[0];if(w)openWord(w.id,'today');else go('review')}
function renderLibrary(){let cats=db.categories,items=db.words.filter(w=>(!filter||w.category===filter)&&(!weakOnly||w.status==='weak')&&(!search||norm(w.word+' '+w.meanings.join(' ')).includes(norm(search))));$('main').innerHTML=heading('你的商务词库',`${db.words.length} 项表达 · 单词、词组和句子一起学`,`<button class="secondary" onclick="go('add')">＋ 录入</button>`)+`<input id="search" aria-label="搜索单词或中文" placeholder="搜索单词、句子或中文释义…" value="${esc(search)}" oninput="librarySearch(this.value)"><div class="row" style="margin-top:12px"><select style="flex:1" aria-label="按分类筛选" onchange="filter=this.value;renderLibrary()"><option value="">所有分类</option>${cats.map(c=>`<option ${filter===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="${weakOnly?'secondary':'plain'}" onclick="weakOnly=!weakOnly;renderLibrary()">薄弱项 ${db.words.filter(w=>w.status==='weak').length}</button><button class="plain" onclick="newCategory()">＋分类</button></div><div class="section-title"><small>显示 ${items.length} 项</small><button class="pill" onclick="reviewCat=filter;startReview('quiz','all')">测试此分类</button></div><div class="list">${items.slice().reverse().slice(0,100).map(wordrow).join('')||'<div class="empty">暂无匹配项。</div>'}</div>${items.length>100?`<p class="hint" style="margin-top:15px">为手机保持流畅，显示前 100 项。请搜索或按分类查看剩余内容。</p>`:''}`}
function librarySearch(s){search=s;const el=$('search'),p=el.selectionStart;renderLibrary();$('search').focus();$('search').setSelectionRange(p,p)}
function newCategory(){const c=prompt('新分类名称');if(c?.trim()){if(!db.categories.includes(c.trim()))db.categories.push(c.trim());save();if(view==='library')renderLibrary();else renderDetail()}}
function openWord(id,from){if(!db.words.some(w=>w.id===id))return;if(view==='flash'||view==='quiz')reviewDetailReturn=view;else if(view!=='detail')reviewDetailReturn=null;stopAudio();origin=from||(['detail','quiz','flash'].includes(view)?origin:view);if(!['today','library','add','review','progress'].includes(origin))origin='library';currentId=id;view='detail';feedback='';render();window.scrollTo(0,0)}

const AFFIX_HINTS={agreement:['suffix','-ment','把动词变成表示结果或状态的名词','agree','agree 是同意，agreement 是达成的协议。'],payment:['suffix','-ment','表示动作或动作的结果','pay','pay 是付款，payment 是付款这件事。'],shipment:['suffix','-ment','表示动作或结果','ship','ship 是发货，shipment 是货运或一批货物。'],employment:['suffix','-ment','表示状态或过程','employ','employ 是雇用，employment 是就业或雇用状态。'],management:['suffix','-ment','把动词转成名词','manage','manage 是管理，management 是管理活动。'],development:['suffix','-ment','表示过程或结果','develop','develop 是发展，development 是发展过程。'],leadership:['suffix','-ship','表示身份、地位或能力','leader','leader 是领导者，leadership 是领导能力。'],partnership:['suffix','-ship','表示关系或状态','partner','partner 是伙伴，partnership 是合作关系。'],ownership:['suffix','-ship','表示身份或状态','owner','owner 是拥有者，ownership 是所有权。'],reimbursement:['suffix','-ment','表示动作或结果','reimburse','reimburse 是报销，reimbursement 是报销款或报销行为。'],unconditional:['prefix','un-','表示否定','conditional','conditional 是有条件的，加 un- 变成无条件的。'],reschedule:['prefix','re-','重新，再次','schedule','schedule 是安排，re- 表示重新安排。'],renegotiate:['prefix','re-','重新，再次','negotiate','negotiate 是谈判，re- 表示再次谈判。'],reorganize:['prefix','re-','重新','organize','organize 是组织，re- 表示重新组织。'],reorganization:['prefix','re-','重新','organization','organization 是组织，re- 提醒你重组。'],disagree:['prefix','dis-','表示否定或相反','agree','agree 是同意，disagree 是不同意。'],disagreement:['prefix','dis-','否定或相反','agreement','agreement 是一致，disagreement 是分歧。'],international:['prefix','inter-','在……之间','national','national 与国家有关，inter- 提醒你国家之间。'],overpayment:['prefix','over-','过量，超过','payment','付款超过应付金额，就是 overpayment。'],underestimate:['prefix','under-','不足，低于','estimate','estimate 是估计，under- 表示估得偏低。'],overestimate:['prefix','over-','过度，超过','estimate','over- 表示估得偏高。'],reusable:['prefix','re-','再次','usable','usable 是可用的，reusable 是可重复使用的。']};

 style="margin-top:12px">音节拼写用于辅助阅读，实际声音以音标与原音为准。开/闭音节、元音组合等规则不能覆盖所有例外。</p><a class="tiny" href="https://www.readingrockets.org/topics/spelling-and-word-study/articles/six-syllable-types" target="_blank" rel="noopener">阅读六类音节规则 ↗</a></section><section class="card"><h3>跟读 · 录下你的进步</h3><p class="sub">先听一遍，再录一句；交替播放，比较重音与停顿。</p><div class="row" style="margin-top:17px"><button id="recordBtn" class="secondary" onclick="toggleRecord()">● 开始录音</button><button class="plain" onclick="speak(current().word)">原音对比</button></div><div id="recordArea">${recordUrl&&recordForId===w.id?`<audio controls src="${esc(recordUrl)}"></audio>`:''}</div><p class="tiny" style="margin-top:10px">每张词卡保留最近一次录音，再录会覆盖；刷新后仍可回放。仅保存在此浏览器，不上传；清理网站数据会删除。需要麦克风权限与 HTTPS / localhost。</p></section>${affixModule(w)}<section class="card"><h3>联想记忆 · 让词有一个画面</h3><p style="margin-top:13px">${esc(w.mnemonic||'等待生成个性化联想。')}</p>${w.scene?`<div class="island"><div class="eyebrow">PICTURE THIS</div>${esc(w.scene)}</div>`:''}</section><section class="card"><h3>商务语法 · 用得自然</h3><p style="margin-top:13px">${esc(w.grammar||'语法提示尚未生成。')}</p></section><section class="card wide"><h3>把它放进真实对话</h3>${w.examples.length?w.examples.map((e,i)=>`<div class="example"><p class="en">${esc(e.en)}</p><p class="zh">${esc(e.zh)}</p><button class="pill" onclick="speak(current().examples[${i}].en)">▷ 例句发音</button></div>`).join(''):'<p class="sub">例句尚未生成。</p>'}</section>${split?`<section class="card wide"><h3>继续拆开这句话</h3><p class="sub">意群在前，单词在后。点击进入对应卡片。</p>${splitBlocks(split,false)}</section>`:''}<section class="card wide"><h3>轮到你了 · 商务造句</h3><p class="sub">用 ${esc(w.word)} 写一句工作中会用到的话。</p><textarea id="practice" placeholder="例如：We need to negotiate a better price.">${esc(w.practiceDraft||'')}</textarea><div class="row" style="margin-top:12px"><button class="primary" id="correctBtn" onclick="correctSentence()">AI 批改</button><button class="secondary" onclick="correctionChat()">复制到ChatGPT</button></div><div id="feedback" style="margin-top:14px">${correctionHistoryHTML(w)}</div></section><section class="card wide"><h3>巩固与归类</h3><div class="pills">${[['new','新词'],['weak','模糊'],['mastered','已掌握']].map(([s,t])=>`<button class="pill ${w.status===s?'active':''}" onclick="mark('${s}')">${t}</button>`).join('')}</div><p class="tiny">手动标记是自我评估；测试结果会进一步调整掌握度与复习间隔。</p><label>分类</label><div class="row"><select style="flex:1" onchange="current().category=this.value;save();renderDetail()">${[...new Set([...db.categories,w.category||'未分类'])].map(c=>`<option ${w.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="plain" onclick="newCategory()">＋分类</button></div><div class="row" style="margin-top:17px"><button class="primary" onclick="finishLearning()">✓ 学完，进入测试</button><button class="danger" onclick="deleteWord(currentId)">删除此词卡</button></div><p class="tiny" style="margin-top:12px">${w.learned?'下次复习：'+new Date(w.due).toLocaleString('zh-CN'):'首次学完后，安排 10 分钟后的回忆测试。'}</p></section></div>`;loadRecording(w)}
function mark(s){let w=current();w.status=s;if(s!=='new'){if(!w.learned){w.learned=true;activity('new',w.id)}w.due=Date.now()+(s==='mastered'?86400000:600000)}save();renderDetail()}

function speak(text,after){if(!('speechSynthesis'in window)){toast('当前浏览器不支持朗读，请使用 Safari 或 Chrome。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=db.settings.speed;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>/^en/.test(v.lang))||null;u.onstart=()=>{if($('speakState'))$('speakState').textContent='正在播放原音…'};u.onend=()=>{if($('speakState'))$('speakState').textContent='播放完成。';after?.()};u.onerror=()=>toast('朗读暂不可用，请检查设备的英语语音。');speechSynthesis.speak(u)}

let savedRecordingKey='',savedRecordingMime='',recordLoadVersion=0;

function audioStore(mode,key,value){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('此浏览器不支持录音保存'));return}let req=window.indexedDB.open('business-english-audio',1);req.onupgradeneeded=()=>req.result.createObjectStore('recordings');req.onerror=()=>reject(Error('录音存储无法打开'));req.onsuccess=()=>{let database=req.result,tx=database.transaction('recordings',mode==='get'?'readonly':'readwrite'),table=tx.objectStore('recordings'),op=mode==='get'?table.get(key):mode==='delete'?table.delete(key):table.put(value,key);let result;op.onsuccess=()=>{result=op.result};tx.oncomplete=()=>{database.close();resolve(result)};tx.onerror=()=>{database.close();reject(Error('录音未保存，可能是存储空间不足'))}}})}
function recordingControls(saved=true){return `<audio controls src="${esc(recordUrl)}"></audio><div class="row" style="margin-top:8px"><button class="pill" onclick="downloadRecording()">下载录音</button><button class="pill" onclick="deleteRecording()">🗑 删除录音</button><span class="tiny">${saved?'已保存在此浏览器':'保存失败，当前页面仍可回放，请下载'}</span></div>`}
async function loadRecording(w){let id=w.id,key=recordingKey(w),version=++recordLoadVersion;if(recordUrl&&savedRecordingKey===key){recordForId=id;if($('recordArea'))$('recordArea').innerHTML=recordingControls();return}try{let x=await audioStore('get',key);if(version!==recordLoadVersion||currentId!==id||view!=='detail'||activeStorageKey+':'+norm(w.word)!==key)return;if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=null;recordForId=null;savedRecordingKey=key;if(x?.blob){savedRecordingMime=x.blob.type;recordUrl=URL.createObjectURL(x.blob);recordForId=id;$('recordArea').innerHTML=recordingControls();$('recordBtn').textContent='● 再录一次'}}catch(e){}}
async function toggleRecord(){if(recording?.state==='recording'){recording.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('此环境不支持录音。请在 HTTPS 或 localhost 打开。');return}try{let w=current(),recordedId=w.id,key=recordingKey(w),capturedProfile=activeStorageKey;let capturedStream=await navigator.mediaDevices.getUserMedia({audio:true});stream=capturedStream;let chunks=[],recorder=new MediaRecorder(capturedStream);recording=recorder;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{clearTimeout(toggleRecord.timer);capturedStream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(!blob.size){toast('没有录到声音，请重试');return}let saved=true;try{await audioStore('put',key,{blob,createdAt:new Date().toISOString()})}catch(e){saved=false;toast(e.message+'，请下载录音')}if(activeStorageKey!==capturedProfile)return;if(recordUrl)URL.revokeObjectURL(recordUrl);savedRecordingKey=key;savedRecordingMime=blob.type;recordForId=recordedId;recordUrl=URL.createObjectURL(blob);if($('recordArea')&&currentId===recordedId&&view==='detail'){$('recordArea').innerHTML=recordingControls(saved);$('recordBtn').textContent='● 再录一次'}activity('practice',recordedId)};recorder.start();$('recordBtn').textContent='■ 停止录音';toggleRecord.timer=setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},60000)}catch(e){stream?.getTracks().forEach(t=>t.stop());toast('录音未开始：'+e.message)}}
function downloadRecording(){if(!recordUrl)return;downloadURL(recordUrl,'商务跟读.'+(savedRecordingMime.includes('mp4')?'m4a':savedRecordingMime.includes('ogg')?'ogg':'webm'))}
async function deleteRecording(){let id=currentId,key=recordingKey();try{await audioStore('delete',key);if(currentId!==id)return;recordLoadVersion++;if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=null;recordForId=null;savedRecordingKey='';$('recordArea').innerHTML='';$('recordBtn').textContent='● 开始录音';toast('这条录音已删除')}catch(e){toast(e.message)}}

function splitEnglish(text){let sentences=(text.match(/[^.!?]+(?:[.!?]+["”']?|$)/g)||[]).map(s=>s.trim()).filter(Boolean);let phrases=new Set(),words=new Set();let known=['look forward to','in terms of','as soon as possible','by the end of','on behalf of','follow up on','get back to','reach an agreement','cash flow','payment terms','market share','action items','next steps','due to','in order to','as a result','business plan','sales pipeline'];for(let s of sentences){let n=norm(s);for(let p of known)if(n.includes(p))phrases.add(p);let chunks=s.split(/[,;:—]|\b(?:but|because|although|while|which|that|and)\b/i).map(x=>x.trim().replace(/[.!?]$/,'')).filter(x=>x.split(/\s+/).length>=2&&x.split(/\s+/).length<=7);chunks.forEach(x=>phrases.add(x));(s.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).forEach(x=>words.add(x.toLowerCase()))}return {sentences,phrases:[...phrases],words:[...words]}}
function splitBlocks(r,withSentences=true){return `${withSentences?`<h3 style="margin-top:18px">01 · 句子 ${r.sentences.length}</h3><div class="list" style="margin:12px 0">${r.sentences.map(s=>`<button class="wordrow" onclick="learnText(this.dataset.text)" data-text="${esc(s)}"><span>${esc(s)}</span><span>›</span></button>`).join('')}</div>`:''}<h3 style="margin-top:18px">${withSentences?'02':'01'} · 词组 / 意群 ${r.phrases.length}</h3><p class="tiny">按标点、连接词和常用搭配切分的离线建议，可在 ChatGPT 中进一步核对。</p><div class="pills">${r.phrases.map(s=>`<button class="tagbutton" data-text="${esc(s)}" onclick="learnText(this.dataset.text)">${esc(s)}</button>`).join('')}</div><h3 style="margin-top:18px">${withSentences?'03':'02'} · 单词 ${r.words.length}</h3><div class="pills">${r.words.map(s=>`<button class="pill" data-text="${esc(s)}" onclick="learnText(this.dataset.text)">${esc(s)}</button>`).join('')}</div>`}
async function learnText(text){let w=db.words.find(w=>norm(w.word)===norm(text));if(w){openWord(w.id);if(missingLearning(w).length&&!w.generationError)await generateCards([w.id]);return}const seed=SEED.find(w=>norm(w.word)===norm(text));let n=normalizeWord(seed||{word:text,category:'切分学习'});db.words.push(n);if(!db.categories.includes(n.category))db.categories.push(n.category);save();openWord(n.id,'add');if(!seed)await generateCards([n.id])}

function scheduleResult(w,correct,quality=4){if(!w.learned){w.learned=true;activity('new',w.id)}let l=log();l.attempts++;if(correct)l.correct++;l.xp+=correct?4:1;if(correct){if(w.lastSuccess!==dayKey()){w.reps=(w.reps||0)+1;w.ease=Math.max(1.3,(w.ease||2.5)+(.1-(5-quality)*(.08+(5-quality)*.02)));w.interval=w.reps===1?1:w.reps===2?3:Math.max(1,Math.round((w.interval||3)*w.ease));w.interval=Math.min(180,w.interval);w.due=Date.now()+w.interval*86400000;w.status=w.reps>=3&&w.interval>=7?'mastered':'weak';w.lastSuccess=dayKey()}}else{w.lastSuccess='';w.reps=0;w.lapses=(w.lapses||0)+1;w.ease=Math.max(1.3,(w.ease||2.5)-.2);w.interval=0;w.due=Date.now()+600000;w.status='weak'}activity('review',w.id);save()}

function renderProgress(){let l=log(),t=totals(),learned=db.words.filter(w=>w.learned).length,mastered=db.words.filter(w=>w.status==='mastered').length,p=db.plan,done=p?.days.filter(d=>d.done).length||0;let dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return dayKey(d)});let achievements=achievementList();$('main').innerHTML=heading('看见自己的进步。','成长不必轰轰烈烈，持续就有力量。')+`<div class="stats"><div class="stat"><strong>${streak()}</strong><span>连续打卡天数</span></div><div class="stat"><strong>${learned}</strong><span>已学习表达</span></div><div class="stat"><strong>Lv.${Math.floor(t.xp/100)+1}</strong><span>${t.xp} 成长值</span></div></div><div class="grid"><section class="card"><div class="row between"><h3>今日打卡</h3><span class="badge">${l.checked?'✓ 目标完成':'进行中'}</span></div><label>新学 ${l.newIds.length} / ${db.settings.newGoal}</label><div class="progress"><i style="width:${db.settings.newGoal?Math.min(100,l.newIds.length/db.settings.newGoal*100):100}%"></i></div><label>复习 ${l.reviewIds.length} / ${db.settings.reviewGoal}</label><div class="progress"><i style="width:${db.settings.reviewGoal?Math.min(100,l.reviewIds.length/db.settings.reviewGoal*100):100}%"></i></div><div class="week">${dates.map(k=>`<div class="daydot ${db.logs[k]?.checked?'done':''}"><i>${db.logs[k]?.checked?'✓':k.slice(-2)}</i>${new Date(k+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'short'})}</div>`).join('')}</div><p class="tiny">同一项每天只计一次新学或复习；达到两个目标自动打卡。连续 3 / 7 / 30 天可领取额外成长值。</p><div class="row" style="margin-top:15px"><button class="secondary" onclick="go('settings')">调整目标</button><button class="primary" onclick="claimReward()">领取坚持奖励</button></div></section><section class="card"><h3>近七天 · 练习节奏</h3><div class="bars">${dates.map(k=>{let x=db.logs[k],n=(x?.newIds?.length||0)+(x?.reviewIds?.length||0);return`<div><span>${n}</span><i style="height:${Math.min(75,n*4)}px"></i><span>${k.slice(5)}</span></div>`}).join('')}</div><div class="rule"></div><div class="row between"><span>累计测试正确率</span><strong>${t.attempts?Math.round(t.correct/t.attempts*100)+'%':'尚未测试'}</strong></div><p class="tiny">${t.correct} 次正确 / ${t.attempts} 次作答；抽认卡自评也计入。近七天按不重复学习项统计。</p><div class="row between" style="margin-top:12px"><span>词库掌握进度</span><strong>${mastered}/${db.words.length}</strong></div><div class="progress"><i style="width:${mastered/db.words.length*100}%"></i></div></section></div><section class="card"><div class="row between"><h3>学习计划${p?' · '+esc(p.name):''}</h3><button class="pill" onclick="importMode='plan';go('add')">${p?'导入新计划':'＋ 导入计划'}</button></div>${p?`<p class="sub">${done}/${p.days.length} 天完成 · 从 ${esc(p.start)} 开始 · 按完成顺序推进</p><div class="progress"><i style="width:${done/p.days.length*100}%"></i></div>${p.days.map(d=>`<div class="plan-day ${d.done?'done':planToday()?.day===d.day?'current':''}"><div class="row between"><label style="margin:0;flex:1"><input type="checkbox" ${d.done?'checked':''} onchange="togglePlan(${d.day},this.checked)"> 第 ${d.day} 天 · ${esc(d.title)}</label><button class="pill" onclick="startPlanDay(${d.day})">学习 →</button></div><p class="sub">新学 ${d.new_count} · 复习 ${d.review_count} · ${esc(d.words.join(' / '))}</p>${d.note?`<p class="tiny">${esc(d.note)}</p>`:''}</div>`).join('')}`:'<p class="sub">把 ChatGPT 生成的分日计划导入这里，每天有明确任务。点击当天“学习”会同步每日目标；勾选不会虚增学习次数。</p><button class="secondary" style="margin-top:15px" onclick="planChat()">让 ChatGPT 生成 7 天计划</button>'}</section>${achievementWall(achievements)}`}
function claimReward(){let n=streak(),l=log(),milestone=[30,7,3].find(x=>n>=x);if(!milestone){toast('连续达标 3 天后，可领取第一份坚持奖励。');return}db.rewards=db.rewards||{};let key=dayKey()+':'+milestone;if(db.rewards[key]){toast('今天已领取，坚持明天再来。');return}db.rewards[key]=true;l.xp+=milestone===30?50:milestone===7?20:10;save();renderProgress();toast('坚持奖励已到账。每一次开口，都在变得更好。')}
function planChat(){promptPanel(`请为商务英语学习者设计可执行的7天商务英语计划，每天约15分钟，用ChatGPT练口语。覆盖谈判、会议、邮件、财务、市场、人力、项目。每天5个新词、10项复习（第一天复习目标设0）。优先使用常用商务英语词。安排跟读、场景造句和角色扮演，在 note 写明确行动。只返回 JSON：{"plan":{"name":"商务开口7天","days":[{"day":1,"title":"...","words":["..."],"new_count":5,"review_count":0,"note":"..."}]}}，生成完整7天。`,'生成个人学习计划')}
function renderSettings(){$('main').innerHTML=`<button class="back" onclick="go('today')">← 返回今日</button>`+heading('让它适合你的节奏。','每个学习账户分别保存本机词库；只分享进度摘要。')+accountCard()+`<section class="card"><h3>每日目标</h3><div class="grid"><div><label>新学词数 / 表达数</label><input id="goalNew" type="number" min="0" max="200" value="${db.settings.newGoal}"></div><div><label>复习词数 / 表达数</label><input id="goalReview" type="number" min="0" max="200" value="${db.settings.reviewGoal}"></div></div><button class="primary" style="margin-top:15px" onclick="saveGoals()">保存目标</button><p class="tiny" style="margin-top:10px">建议开始时每日 5 新词 + 10 复习；第一天可把复习目标设为 0。</p></section>${connectionCard()}<section class="card"><h3>数据备份与恢复</h3><p class="sub">导出包含词库、掌握度、计划、打卡与设置，自动排除 API 密钥。录音单独保存在本机浏览器，不进入 JSON 备份；可逐条下载。</p><div class="row" style="margin-top:15px"><button class="primary" onclick="exportBackup()">导出 JSON 备份</button><a class="plain" href="./business-english.html" download>下载单文件 HTML</a><button class="secondary" onclick="$ ('backupFile').click()">恢复 JSON 备份</button><input type="file" id="backupFile" accept=".json,application/json" hidden onchange="readBackup(this)"></div><p class="tiny" style="margin-top:12px">当前存储：${storageOK?'本机浏览器可用':'不可用，请导出后再关闭'}。清理浏览器数据会删除学习记录。</p></section><section class="card"><h3>添加到手机主屏幕</h3><div class="row" style="margin-top:15px"><button class="secondary" onclick="installApp()">查看安装方式</button><button class="plain" onclick="downloadIcon()">下载应用图标</button></div><p class="sub">iPhone：Safari 打开网页 → 分享 → 添加到主屏幕。Android：Chrome 菜单 → 添加到主屏幕（或安装应用）。需要可访问的 HTTPS 地址；本地文件可直接学习，但部分手机不支持给文件创建主屏幕入口。</p><p class="tiny" style="margin-top:12px">下载的单文件嵌入图标、移动端元信息与动态 manifest，离线可查看内置词库。已发布网页版额外提供标准 manifest、图标与离线缓存；首次成功联网打开后可缓存应用。录音与 AI 功能仍受设备和网络条件影响。</p></section>`}
function saveGoals(){let n=boundedCount($('goalNew').value,5),r=boundedCount($('goalReview').value,10);if(n+r===0){toast('至少保留一个学习目标。');return}db.settings.newGoal=n;db.settings.reviewGoal=r;save();let l=log();if(l.newIds.length>=n&&l.reviewIds.length>=r){l.checked=true;rewardSquirrel();save()}toast('每日目标已保存。')}
function saveAI(){db.settings.endpoint=$('endpoint').value.trim();db.settings.model=$('model').value.trim();sessionKey=$('apiKey').value.trim();db.settings.saveKey=$('saveKey').checked;if(db.settings.saveKey)db.settings.apiKey=sessionKey;else delete db.settings.apiKey;save();$('aiStatus').textContent=hasAI()?'配置已保存，建议测试连接。':'配置未完整；请填写接口、模型和密钥。';toast('设置已保存。')}
async function testAI(){saveAI();if(!hasAI()){toast('请先完成配置。');return}$('testAI').disabled=true;$('aiStatus').textContent='正在连接…';try{let x=await aiJSON('Return only {"ok":true}');$('aiStatus').textContent=x.ok?'✓ 连接成功，可自动生成资料与批改。':'接口可达，但返回格式需检查。'}catch(e){$('aiStatus').textContent='连接失败：'+e.message+'。请检查接口格式、密钥与 CORS 跨域许可。'}finally{$('testAI').disabled=false}}
function clearAI(){sessionKey='';delete db.settings.apiKey;db.settings.saveKey=false;save();renderSettings();toast('密钥已清除。')}
function downloadURL(url,name){let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}
function exportBackup(){let x=JSON.parse(JSON.stringify(db));delete x.settings.apiKey;x.settings.saveKey=false;x.exportedAt=new Date().toISOString();let url=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));downloadURL(url,'商语-备份-'+dayKey()+'.json');setTimeout(()=>URL.revokeObjectURL(url),10000);toast('备份已导出，不包含 API 密钥。')}
async function readBackup(input){let f=input.files[0];if(!f)return;try{if(f.size>10000000)throw Error('备份超过 10MB');restoreBackup(extractJSON(await f.text()))}catch(e){toast('恢复失败：'+e.message)}}
function validatedBackup(obj){if(obj.version!==1||!Array.isArray(obj.words)||!obj.logs||typeof obj.logs!=='object'||!obj.settings)throw Error('不是商语 v1 备份');let clean=base();clean.seedRevision=Number(obj.seedRevision)||200;clean.deletedSeeds=Array.isArray(obj.deletedSeeds)?obj.deletedSeeds.filter(x=>typeof x==='string'):[];clean.acorns=Math.max(0,Math.min(100000,Number(obj.acorns)||0));clean.petFeedCount=Math.max(0,Math.min(100000,Number(obj.petFeedCount)||0));clean.acornAwards=obj.acornAwards&&typeof obj.acornAwards==='object'&&!Array.isArray(obj.acornAwards)?Object.fromEntries(Object.entries(obj.acornAwards).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}:/.test(k)&&v===true)):{};clean.petRewards=Array.isArray(obj.petRewards)?obj.petRewards.filter(k=>typeof k==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(k)):[];clean.words=obj.words.map(x=>{let w=normalizeWord(x);w.id=uid();w.status=['new','weak','mastered'].includes(x.status)?x.status:'new';w.learned=!!x.learned;w.lastSuccess=typeof x.lastSuccess==='string'?x.lastSuccess:'';for(let k of ['reps','lapses','interval','due'])w[k]=Number.isFinite(+x[k])?Math.max(0,+x[k]):0;w.ease=Math.max(1.3,Math.min(3,Number(x.ease)||2.5));w.practiceDraft=typeof x.practiceDraft==='string'?x.practiceDraft:'';w.correctionHistory=Array.isArray(x.correctionHistory)?x.correctionHistory.filter(t=>typeof t?.corrected==='string').slice(-20).map(cleanCorrection):[];if(x.lastCorrection&&typeof x.lastCorrection.corrected==='string')w.lastCorrection=cleanCorrection(x.lastCorrection);w._oldId=x.id;return w});let idMap=Object.fromEntries(clean.words.map(w=>[w._oldId,w.id]));clean.words.forEach(w=>delete w._oldId);clean.categories=[...new Set(clean.words.map(w=>w.category).concat(Array.isArray(obj.categories)?obj.categories.filter(c=>typeof c==='string'):[]))];clean.logs={};for(let [k,l]of Object.entries(obj.logs)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!l||typeof l!=='object')continue;clean.logs[k]={newIds:(Array.isArray(l.newIds)?l.newIds:[]).map(id=>idMap[id]).filter(Boolean),reviewIds:(Array.isArray(l.reviewIds)?l.reviewIds:[]).map(id=>idMap[id]).filter(Boolean),correct:Math.max(0,Number(l.correct)||0),attempts:Math.max(0,Number(l.attempts)||0),practices:Math.max(0,Number(l.practices)||0),xp:Math.max(0,Number(l.xp)||0),checked:!!l.checked}}
clean.settings={...clean.settings,newGoal:boundedCount(obj.settings.newGoal,5),reviewGoal:boundedCount(obj.settings.reviewGoal,10),speed:Math.max(.5,Math.min(1.2,Number(obj.settings.speed)||.85)),endpoint:typeof obj.settings.endpoint==='string'?obj.settings.endpoint:'',model:typeof obj.settings.model==='string'?obj.settings.model:''};if(clean.settings.newGoal+clean.settings.reviewGoal===0)clean.settings.newGoal=5;
if(obj.plan&&Array.isArray(obj.plan.days)){let seen=new Set();clean.plan={name:String(obj.plan.name||'恢复的计划'),start:/^\d{4}-\d{2}-\d{2}$/.test(obj.plan.start)?obj.plan.start:dayKey(),days:obj.plan.days.map((d,i)=>{let day=Number(d.day)||i+1;if(!Number.isInteger(day)||day<1||seen.has(day))throw Error('备份计划 day 无效');seen.add(day);return{day,title:String(d.title||''),words:Array.isArray(d.words)?d.words.filter(w=>typeof w==='string'):[],new_count:boundedCount(d.new_count,5),review_count:boundedCount(d.review_count,10),note:String(d.note||''),done:!!d.done}})}}clean.rewards=obj.rewards&&typeof obj.rewards==='object'?obj.rewards:{};return clean}
function restoreBackup(obj){let clean=validatedBackup(obj);showModal(`<h3>恢复这份备份？</h3><p class="sub">包含 ${clean.words.length} 项表达与 ${Object.keys(clean.logs).length} 天记录。恢复会替换当前本机数据，建议先导出当前备份。</p><div class="row" style="margin-top:15px"><button class="secondary" onclick="exportBackup()">先备份当前数据</button><button class="primary" id="confirmRestore">确认恢复</button></div>`);$('confirmRestore').onclick=()=>{db=clean;sessionKey='';save();closeModal();go('today');toast('备份已恢复。')}}
function installApp(){if(installPrompt){installPrompt.prompt();installPrompt=null;return}showModal('<h3>把商语放到主屏幕</h3><p style="margin-top:15px">iPhone：用 Safari 打开 HTTPS 网页，点分享按钮，再点“添加到主屏幕”。</p><p style="margin-top:15px">Android：用 Chrome 打开网页，点右上角菜单，选择“添加到主屏幕”。浏览器可能创建快捷方式，而不是完整离线应用。</p><p class="hint" style="margin-top:15px">本地 HTML 文件在部分手机无法创建入口。可以把同一个 HTML 放到你自己的 HTTPS 静态网页空间，学习数据仍只存在手机本机。不同网址或浏览器不共享 localStorage。</p>')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
let canvas=document.createElement('canvas');canvas.width=canvas.height=512;let ctx=canvas.getContext('2d');ctx.fillStyle='#2868bd';ctx.fillRect(0,0,512,512);ctx.fillStyle='#e8f3ff';ctx.font='bold 300px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('B.',270,270);let icon=canvas.toDataURL('image/png');$('appIcon').href=icon;$('favicon').href=icon;const manifest={name:'商语 · 商务英语记忆',short_name:'商语',start_url:location.protocol==='file:'?'./':location.pathname,display:'standalone',background_color:'#f3f7fc',theme_color:'#2868bd',icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any'}]};$('manifest').href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));function downloadIcon(){downloadURL(icon,'商语-图标.png')}
if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){fetch('./manifest.webmanifest').then(r=>{if(r.ok&&r.headers.get('content-type')?.includes('manifest')){$('manifest').href='./manifest.webmanifest';$('appIcon').href='./icon.png';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}}).catch(()=>{})}upgradeSeed();db.words.forEach(w=>{if(w.generating){w.generating=false;w.generationError='上次生成被中断，请重试'}});rewardSquirrel();if(storageOK)save();view='today';render();ensureBackend().then(()=>{if(view==='today')renderToday()}).catch(()=>{});refreshAccount();if(initialError)setTimeout(()=>toast(initialError),100);window.addEventListener('pagehide',()=>{stopAudio();stream?.getTracks().forEach(t=>t.stop())});
</script></body></html>

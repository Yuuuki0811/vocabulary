<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百炼后台配置</title><style>body{font:17px system-ui;background:#f5f7f4;color:#173d35;margin:0;padding:24px}main{max-width:500px;margin:30px auto;background:white;padding:24px;border-radius:20px}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:10px;border:1px solid #ccd8d1}button{background:#17665b;color:white;margin-top:20px}p{line-height:1.6}small{color:#637a70}a{color:#17665b}</style><main><h2>连接百炼学习助手</h2><p>仅在这台电脑的后台保存密钥。配置完成后可测试自动生成；手机使用仍需部署线上后台。</p><p><strong>需要“模型服务 → API Key”的密钥，不是智能体的密钥库。</strong>请从百炼控制台复制 API Key 和对应的业务空间 ID（北京地域）。</p><form id="form"><label>百炼 API Key</label><input id="key" type="password" autocomplete="off" required placeholder="只填在这里，不要发到聊天里"><label>业务空间 ID</label><input id="workspace" required placeholder="从百炼接口示例中取得 WorkspaceId"><label>模型名称</label><input id="model" required value="qwen-plus"><button id="save">保存到本机后台</button></form><p id="status" role="status"></p><a href="/">返回学习网页，验证 AI 连接 →</a><p><small>此页不会回显已保存的密钥，也不会把密钥写入浏览器存储、日志或 GitHub。</small></p></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('save'),s=document.getElementById('status');b.disabled=true;try{const r=await fetch('/api/configure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.getElementById('key').value,workspace:document.getElementById('workspace').value,model:document.getElementById('model').value})});const x=await r.json();if(!r.ok)throw Error(x.error);document.getElementById('key').value='';s.textContent=x.message}catch(e){s.textContent=e.message}finally{b.disabled=false}}</script></html>

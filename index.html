ives earn a 5% commission on all closed deals.","zh":"销售人员就所有成交订单获得5%的佣金。"},{"en":"The compensation committee approved a revised commission plan for FY2025.","zh":"薪酬委员会批准了2025财年修订后的佣金方案。"}]},{"word":"execute","category":"项目与运营","meanings":["执行；实施；完成（计划、合同、交易）"],"examples":[{"en":"The team executed the go-to-market plan ahead of schedule.","zh":"团队提前完成了上市推广计划。"},{"en":"Before we execute the merger agreement, legal must complete due diligence.","zh":"在我们执行并购协议前，法务必须完成尽职调查。"}]},{"word":"localization","category":"战略与沟通","meanings":["本地化；本地化过程"],"examples":[{"en":"Localization goes beyond translation—it includes adapting date formats, currency, and cultural references.","zh":"本地化不止于翻译——还包括调整日期格式、货币单位和文化参照。"},{"en":"The marketing team delayed the campaign launch to allow time for full localization.","zh":"营销团队推迟了活动上线时间，以便完成全部本地化工作。"}]},{"word":"reservation","category":"谈判","meanings":["预订；保留意见； reservations（复数）指顾虑、疑虑"],"examples":[{"en":"We have a reservation about the payment timeline.","zh":"我们对付款时间表有所保留。"},{"en":"Please confirm your hotel reservation by Friday.","zh":"请于周五前确认您的酒店预订。"}]},{"word":"coordinate","category":"会议","meanings":["协调；使配合；整理（信息、资源等）"],"examples":[{"en":"She will coordinate the Q&A session with the legal team.","zh":"她将与法务团队协调问答环节。"},{"en":"We need to coordinate meeting times across three time zones.","zh":"我们需要协调横跨三个时区的会议时间。"}]},{"word":"unsubscribe","category":"邮件","meanings":["退订（邮件列表、服务等）"],"examples":[{"en":"Click ‘Unsubscribe’ at the bottom of this email to stop future updates.","zh":"点击本邮件底部的‘退订’以停止接收后续更新。"},{"en":"All users can unsubscribe from promotional emails anytime.","zh":"所有用户可随时退订促销邮件。"}]},{"word":"debtor","category":"财务","meanings":["债务人；欠款方"],"examples":[{"en":"The debtor failed to settle the invoice within 30 days.","zh":"该债务人未在30天内结清发票。"},{"en":"We reviewed the list of debtors before sending reminders.","zh":"我们在发送催款提醒前审核了债务人名单。"}]},{"word":"wholesale","category":"市场","meanings":["批发；大批量销售；以批发价"],"examples":[{"en":"Our company sells products wholesale to regional distributors.","zh":"我司向区域分销商批发产品。"},{"en":"Wholesale prices are typically 40% lower than retail.","zh":"批发价通常比零售价低40%。"}]},{"word":"overtime","category":"人力","meanings":["加班时间；加班费"],"examples":[{"en":"All overtime must be pre-approved by the manager.","zh":"所有加班必须事先获得经理批准。"},{"en":"We pay 1.5 times the regular rate for overtime hours.","zh":"我们对加班小时按正常时薪的1.5倍支付。"}]},{"word":"scheduling","category":"项目与运营","meanings":["排程；日程安排"],"examples":[{"en":"Scheduling is critical to meeting the Q3 launch deadline.","zh":"排程对按时完成第三季度发布至关重要。"},{"en":"The team uses software to automate scheduling of maintenance windows.","zh":"团队使用软件自动安排维护窗口期。"}]},{"word":"communication","category":"战略与沟通","meanings":["沟通；交流；通讯"],"examples":[{"en":"Clear communication reduces misunderstandings across teams.","zh":"清晰的沟通可减少团队间的误解。"},{"en":"Leadership emphasized transparent communication during the restructuring.","zh":"管理层在重组期间强调透明沟通。"}]},{"word":"impasse","category":"谈判","meanings":["僵局；僵持状态"],"examples":[{"en":"The talks reached an impasse over pricing terms.","zh":"双方在定价条款上陷入僵局。"},{"en":"Both sides agreed to bring in a mediator to break the impasse.","zh":"双方同意引入调解人以打破僵局。"}]},{"word":"circulate","category":"会议","meanings":["分发；传阅；流通"],"examples":[{"en":"Please circulate the agenda at least 48 hours before the meeting.","zh":"请至少提前48小时分发会议议程。"},{"en":"The revised contract draft was circulated to all stakeholders for review.","zh":"修订后的合同草案已传阅给所有相关方审阅。"}]},{"word":"confidentiality","category":"邮件","meanings":["保密性；机密性"],"examples":[{"en":"All project documents are subject to strict confidentiality.","zh":"所有项目文件均须严格保密。"},{"en":"We must ensure confidentiality when sharing client data via email.","zh":"通过邮件共享客户数据时，我们必须确保保密性。"}]},{"word":"creditor","category":"财务","meanings":["债权人；贷方"],"examples":[{"en":"The company listed its major creditors in the annual financial statement.","zh":"该公司在年度财务报表中列出了主要债权人。"},{"en":"Late payment may damage our relationship with key creditors.","zh":"付款延迟可能损害我们与关键债权人的关系。"}]},{"word":"retail","category":"市场","meanings":["零售；零售业"],"examples":[{"en":"Our new product will launch first in retail stores before online channels.","zh":"新产品将先在实体零售店上市，再登陆线上渠道。"},{"en":"The brand expanded its direct-to-consumer retail operations last quarter.","zh":"该品牌上季度拓展了直面消费者的零售业务。"}]},{"word":"leave","category":"人力","meanings":["休假；请假；离职（正式/中性）"],"examples":[{"en":"Employees must submit leave requests at least three business days in advance.","zh":"员工须至少提前三个工作日提交休假申请。"},{"en":"She gave two weeks' notice and is scheduled to leave next Friday.","zh":"她已提交两周通知，计划于下周五离职。"}]},{"word":"timeline","category":"项目与运营","meanings":["时间表；里程碑计划"],"examples":[{"en":"The revised timeline reflects delays in vendor approvals.","zh":"修订后的时间表反映了供应商审批的延误。"},{"en":"Let’s align our team’s deliverables with the master project timeline.","zh":"让我们团队的交付物与主项目时间表保持一致。"}]},{"word":"articulate","category":"战略与沟通","meanings":["清晰有力地表达（观点、需求等）","善于沟通的"],"examples":[{"en":"She articulated the new market-entry strategy in under five minutes.","zh":"她在五分钟内清晰阐明了新的市场进入策略。"},{"en":"An articulate spokesperson is essential for investor briefings.","zh":"一位表达清晰的发言人对投资者简报至关重要。"}]},{"word":"deadlock","category":"谈判","meanings":["僵局；谈判或讨论中双方无法达成一致的状态"],"examples":[{"en":"The talks reached a deadlock over royalty rates.","zh":"双方在特许权使用费率上陷入僵局。"},{"en":"We need a neutral mediator to help break the deadlock.","zh":"我们需要一名中立调解人来打破僵局。"}]},{"word":"observer","category":"会议","meanings":["列席者；不参与表决但有权听取会议内容的人员"],"examples":[{"en":"The compliance officer attended as an observer, with no voting rights.","zh":"合规官以列席者身份参会，无表决权。"},{"en":"Two external auditors were appointed observers for the quarterly review.","zh":"两名外部审计师被指定为季度评审会的列席者。"}]},{"word":"disclose","category":"邮件","meanings":["披露（机密、财务或法律相关信息）"],"examples":[{"en":"Please do not disclose confidential pricing terms in external emails.","zh":"请勿在对外邮件中披露保密的价格条款。"},{"en":"All material facts must be disclosed to shareholders before the vote.","zh":"所有重大事实须在投票前向股东披露。"}]},{"word":"expenditure","category":"财务","meanings":["支出；花费（尤指组织或项目的资金流出）"],"examples":[{"en":"Q3 capital expenditure exceeded the forecast by 12%.","zh":"第三季度资本支出超出预测12%。"},{"en":"Travel-related expenditure must be submitted with original receipts.","zh":"与差旅相关的支出须附原始票据提交。"}]}];

function splitBlocks(r,withSentences=true){return `${withSentences?`<h3 style="margin-top:18px">01 · 句子 ${r.sentences.length}</h3><div class="list" style="margin:12px 0">${r.sentences.map(s=>`<button class="wordrow" onclick="learnText(this.dataset.text)" data-text="${esc(s)}"><span>${esc(s)}</span><span>›</span></button>`).join('')}</div>`:''}<h3 style="margin-top:18px">${withSentences?'02':'01'} · 词组 / 意群 ${r.phrases.length}</h3><p class="tiny">按标点、连接词和常用搭配切分的离线建议，可在 ChatGPT 中进一步核对。</p><div class="pills">${r.phrases.map(s=>`<button class="tagbutton" data-text="${esc(s)}" onclick="learnText(this.dataset.text)">${esc(s)}</button>`).join('')}</div><h3 style="margin-top:18px">${withSentences?'03':'02'} · 单词 ${r.words.length}</h3><div class="pills">${r.words.map(s=>`<button class="pill" data-text="${esc(s)}" onclick="learnText(this.dataset.text)">${esc(s)}</button>`).join('')}</div>`}
async function learnText(text){let w=db.words.find(w=>norm(w.word)===norm(text));if(w){openWord(w.id);if(missingLearning(w).length&&!w.generationError)await generateCards([w.id]);return}const seed=SEED.find(w=>norm(w.word)===norm(text));let n=normalizeWord(seed||{word:text,category:'切分学习'});db.words.push(n);if(!db.categories.includes(n.category))db.categories.push(n.category);save();openWord(n.id,'add');if(!seed)await generateCards([n.id])}
function renderAdd(){$('main').innerHTML=heading('把工作中的英语，变成积累。','添加你想学习的内容，AI 自动生成学习资料。')+`<div class="pills">${[['split','段落三层切分'],['text','单词 / 句子'],['json','ChatGPT JSON'],['plan','学习计划']].map(([v,t])=>`<button class="pill ${importMode===v?'active':''}" onclick="importText=$('importInput')?.value||importText;importMode='${v}';renderAdd()">${t}</button>`).join('')}</div><section class="card"><h3>${({text:'每行一条，自动识别类型',json:'粘贴 ChatGPT 返回的 JSON',split:'先句子，再词组，最后单词',plan:'导入你的分日学习计划'})[importMode]}</h3><p class="sub">${({text:'输入英语即可。已有词自动合并；新词自动生成释义、音标、例句。',json:'支持 words 数组。缺字段留空，不会让整批导入失败。',split:'保存的句子，在详情页也能继续拆分。',plan:'支持 plan.name 与 plan.days，任务目标会与打卡联动。'})[importMode]}</p><textarea id="importInput" style="margin-top:16px;min-height:190px" placeholder="${esc(({text:'negotiate\nWe need to revise the budget.\npayment terms',json:'{"words":[{"word":"negotiate","phonetic":"/nɪˈɡoʊʃieɪt/","meanings":["谈判"],"category":"谈判"}]}',split:'We need to negotiate better payment terms. Please send us your proposal by Friday.',plan:'{"plan":{"name":"商务英语 7 天","days":[{"day":1,"title":"谈判开场","words":["negotiate","proposal"],"new_count":2,"review_count":3,"note":"练一次角色扮演"}]}}'})[importMode])}">${esc(importText)}</textarea><div class="row" style="margin-top:14px"><button class="primary" id="importBtn" ${importBusy?'disabled':''} onclick="runImport()">${importMode==='split'?'自动三层切分':importMode==='plan'?'导入计划':'一键导入'} →</button>${importMode==='text'||importMode==='split'?'<button class="secondary" onclick="importChat()">生成 ChatGPT 提示词</button>':''}<button class="plain" onclick="$ ('importFile').click()">选择 JSON 文件</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="readImportFile(this)"></div><p class="hint" style="margin-top:16px">${hasAI()?'已配置 AI：导入新内容时自动生成。请留意接口费用。':'还未配置 AI：录入内容先保存为词卡；请到设置连接学习助手后即可自动生成。'}</p><div id="importState" role="status"></div></section>${splitResult&&importMode==='split'?`<section class="card">${splitBlocks(splitResult)}</section>`:''}`}
function extractJSON(text){text=String(text).trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');try{return JSON.parse(text)}catch(e){let a=text.indexOf('{'),b=text.lastIndexOf('}');if(a>=0&&b>a)return JSON.parse(text.slice(a,b+1));throw Error('没有找到有效 JSON')}}
function normalizeWord(x){if(!x||typeof x.word!=='string'||!x.word.trim())throw Error('word 必须是非空英文字符串');let arr=Array.isArray(x.meanings)?x.meanings:typeof x.meanings==='string'?[x.meanings]:[];return{word:x.word.trim(),phonetic:typeof x.phonetic==='string'?x.phonetic:'',meanings:arr.filter(m=>typeof m==='string'),category:typeof x.category==='string'&&x.category.trim()?x.category.trim():'未分类',mnemonic:typeof x.mnemonic==='string'?x.mnemonic:'',examples:Array.isArray(x.examples)?x.examples.filter(e=>e&&typeof e.en==='string').map(e=>({en:e.en,zh:typeof e.zh==='string'?e.zh:''})):[],affixes:Array.isArray(x.affixes)?x.affixes.filter(a=>a&&['prefix','suffix'].includes(a.type)&&typeof a.part==='string'&&typeof a.meaning==='string'&&typeof a.stem==='string').map(a=>({type:a.type,part:a.part,meaning:a.meaning,stem:a.stem,memory:typeof a.memory==='string'?a.memory:''})):[],root:typeof x.root==='string'?x.root:'',pos:typeof x.pos==='string'?x.pos:'',syllables:typeof x.syllables==='string'?x.syllables:'',phonicsNote:typeof x.phonicsNote==='string'?x.phonicsNote:'',scene:typeof x.scene==='string'?x.scene:'',family:typeof x.family==='string'?x.family:'',grammar:typeof x.grammar==='string'?x.grammar:'',id:uid(),kind:['word','phrase','sentence'].includes(x.kind)?x.kind:kind(x.word),status:'new',reps:0,lapses:0,ease:2.5,interval:0,due:0,learned:false}}
function mergeWords(list){if(!Array.isArray(list))throw Error('words 应为数组');let added=0,updated=0,skipped=0,ids=[];for(let x of list){try{let n=normalizeWord(x);n.userAdded=true;let old=db.words.find(w=>norm(w.word)===norm(n.word));if(old){for(let k of ['phonetic','meanings','mnemonic','examples','root','pos','syllables','phonicsNote','scene','family','grammar','affixes'])if(Array.isArray(n[k])?n[k].length:n[k])old[k]=n[k];if(x.category)old.category=n.category;old.userAdded=true;old.enrichFailed=false;ids.push(old.id);updated++}else{db.words.push(n);ids.push(n.id);added++}let actualCat=old?.category||n.category;if(!db.categories.includes(actualCat))db.categories.push(actualCat)}catch(e){skipped++}}save();return{added,updated,skipped,ids}}
async function runImport(){if(importBusy)return;importText=$('importInput').value.trim();if(!importText){toast('请先输入内容。');return}try{if(importMode==='split'){splitText=importText;splitResult=splitEnglish(splitText);renderAdd();return}if(importMode==='plan'){importPlan(extractJSON(importText));return}let r;if(importMode==='json'){let obj=extractJSON(importText);if(obj.plan&&!obj.words){importPlan(obj);return}r=mergeWords(obj.words)}else{let lines=importText.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(lines.length>200)throw Error('一次最多200条');r=mergeWords(lines.map(word=>db.words.find(w=>norm(w.word)===norm(word))||SEED.find(w=>norm(w.word)===norm(word))||{word,category:'我的录入'}))}importText='';search='';filter='';weakOnly=false;importBusy=true;view='library';render();toast(`已保存 ${r.ids.length} 项，正在补全资料`);await generateCards(r.ids)}catch(e){toast('录入失败：'+e.message)}finally{importBusy=false}}
async function readImportFile(input){let f=input.files[0];if(!f)return;if(f.size>10000000){toast('文件太大，请选择小于 10MB 的 JSON。');return}try{let text=await f.text(),obj=extractJSON(text);if(obj.version&&obj.logs&&obj.settings&&Array.isArray(obj.words)){restoreBackup(obj);return}importText=text;importMode=obj.plan?'plan':'json';renderAdd()}catch(e){toast('文件读取失败：'+e.message)}}
const wordPrompt=words=>`你是商务英语教练。为以下英语生成可靠学习资料：${JSON.stringify(words)}。每项给出中文释义、美式 IPA、词性、商务分类、两个自然且不同场景的双语例句、与例句相关的轻量语法点、鲜明好记的联想故事与画面场景。单词按读音和六类音节原则提供 syllables（·分隔）；只有容易误读处加 phonicsNote，不要滥用中文谐音；词组和句子必须按完整单词组成的意群切分，用 · 分隔意群，不把每个单词拆成碎片。phonicsNote 简要写重音、连读或弱读提示，不确定不要编造。affixes仅填写能确认的现代英语前缀或后缀，格式 [{"type":"prefix或suffix","part":"前后缀","meaning":"中文作用","stem":"基础词","memory":"简短构词记忆点"}]，没有或不确定返回 []；不要仅凭字母结尾强拆。只有确有依据的词根/词缀才填写 root，并给 family（/分隔）；不确定留空，不要猜词源。不要声称已联网查证；资料不确定时留空。只输出 JSON：{"words":[{"word":"原始英语","phonetic":"/IPA/","meanings":["中文"],"pos":"n./v./adj.","category":"主题","syllables":"","phonicsNote":"","mnemonic":"","scene":"","root":"","family":"","grammar":"","examples":[{"en":"","zh":""},{"en":"","zh":""}]}]}。保留原始英语文本。`;
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制，可粘贴到ChatGPT。')}catch(e){showModal(`<h3>复制到ChatGPT</h3><textarea id="copyBox" style="min-height:260px;margin-top:15px">${esc(text)}</textarea><p class="sub">当前环境不能自动复制，请长按或全选复制。</p>`);$('copyBox').select()}}
function promptPanel(text,title){lastPrompt=text;showModal(`<h3>${title}</h3><p class="sub">在ChatGPT 发送下方内容。生成资料后把 JSON 复制到网页的“ChatGPT JSON”导入。</p><textarea id="copyBox" style="margin-top:14px;min-height:220px">${esc(text)}</textarea><div class="row" style="margin-top:13px"><button class="primary" onclick="copyText($('copyBox').value)">复制提示词</button><a class="secondary" href="https://chatgpt.com/" target="_blank" rel="noopener">打开ChatGPT ↗</a></div>`)}
function importChat(){importText=$('importInput').value;let words=importMode==='split'?[importText]:importText.split(/\n+/).map(s=>s.trim()).filter(Boolean);if(!words.length){toast('先输入要学习的英语。');return}promptPanel(wordPrompt(words),'让 ChatGPT 自动生成学习资料')}
function wordChat(){let w=current();promptPanel(`你是我的商务英语口语教练。今天练习 ${w.word}（${w.meanings.join('；')}），场景是${w.category}。请在语音模式下：先示范自然发音与重音；让我跟读；再用包含这个表达的真实商务角色扮演，一次只问一个问题，等我回答；纠正语法、用词和语气，先肯定准确之处，给简明中文解释与一条地道改进句。最后让我不看提示再次说出该表达。请从一句简单英语开始。`,'用ChatGPT 练口语')}
function speakingSelection(){let groups=new Map();for(let w of db.words){if(!['word','phrase'].includes(w.kind)||!w.meanings?.length)continue;let cat=w.category||'未分类';if(!groups.has(cat))groups.set(cat,[]);groups.get(cat).push(w)}let eligible=[...groups.entries()].filter(([cat,items])=>items.length>=2);if(!eligible.length)return null;let [category,pool]=eligible[Math.floor(Math.random()*eligible.length)];let count=Math.min(pool.length,2+Math.floor(Math.random()*3));return{category,items:shuffleItems(pool).slice(0,count)}}
function dailyChat(){let selected=speakingSelection();if(!selected){toast('需要同一分类中至少两个有释义的单词或短语。');return}let {category,items}=selected;promptPanel(`你是我的商务英语口语教练。我正在提升商务英语口语。今天的主题是“${category}”，练习以下 ${items.length} 个单词或短语：${items.map(w=>w.word+'（'+w.meanings.join('；')+'）').join('、')}。请围绕同一个商务主题设计10分钟口语训练。依次进行：简单中文释义→示范发音→跟读→一次一个问题的商务角色扮演→纠正我的表达→不看提示复述→三个小测试。用语音模式陪我练，不要一次输出所有答案。最后根据我的表现建议下一次练习时间。`,'今日口语陪练 · '+category)}
function showModal(html){$('modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="操作窗口"><div class="card"><div class="row between" style="margin-bottom:16px"><span class="tiny">商语 · 个人学习空间</span><button class="plain" onclick="closeModal()">关闭 ×</button></div>${html}</div></div>`;$('modal').querySelector('button')?.focus()}

let backendAvailable=false,backendVerified=false;
const CLOUD_AI='https://businesglish-ai-qgdrvkbcwd.cn-hangzhou.fcapp.run';
let cloudAccess='';try{cloudAccess=localStorage.getItem('business-ai-access')||'';const params=new URLSearchParams(location.hash.slice(1));if(params.has('assistant')){cloudAccess=params.get('assistant');localStorage.setItem('business-ai-access',cloudAccess);history.replaceState(null,'',location.pathname+location.search)}}catch{}
function isLocalAI(){return location.hostname==='localhost'||location.hostname==='127.0.0.1'}
async function connectCloudAI(){const code=$('cloudCode').value.trim();if(!code){toast('请输入学习助手访问码');return}cloudAccess=code;try{await ensureBackend();localStorage.setItem('business-ai-access',code);renderSettings();toast('学习助手已连接，录入后可自动生成');resumePendingGeneration()}catch(e){backendAvailable=false;toast(e.message)}}
function disconnectCloudAI(){cloudAccess='';backendAvailable=backendVerified=false;localStorage.removeItem('business-ai-access');renderSettings()}

function hasAI(){return backendAvailable||backendVerified}
async function ensureBackend(){let x=await backendRequest('/api/status');backendAvailable=!!x.available;if(!backendAvailable)throw Error('后台尚未配置，请到设置中连接百炼');return true}
async function backendRequest(path,body){const local=isLocalAI();if(!local&&path.startsWith('/api/accounts/'))throw Error('双人账户后台尚未上线，当前先支持 AI 自动生成');if(!local&&!cloudAccess)throw Error('请先到设置连接学习助手');let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),65000);try{let r=await fetch((local?'':CLOUD_AI)+path,{method:body?'POST':'GET',credentials:local?'same-origin':'omit',headers:{...(body?{'Content-Type':'application/json'}:{}),...(!local?{'Authorization':'Bearer '+cloudAccess}:{})},body:body?JSON.stringify(body):undefined,signal:controller.signal});let x=await r.json();if(!r.ok){if(r.status===401||r.status===403)backendAvailable=backendVerified=false;throw Error(x.error||'后台暂时不可用')}return x}finally{clearTimeout(timer)}}
async function aiJSON(prompt){await ensureBackend();return backendRequest('/api/generate',{prompt})}
async function checkBackend(){try{let x=await backendRequest('/api/status');backendAvailable=x.available}catch(e){backendAvailable=false}renderSettings()}
async function verifyBackend(){toast('正在验证真实 AI 连接…');try{let x=await backendRequest('/api/test',{prompt:'test'});backendVerified=x.ok===true;if(!backendVerified)throw Error('验证未通过');toast('AI 连接验证成功')}catch(e){backendVerified=false;toast(e.message)}renderSettings()}
function connectionCard(){let connected=hasAI();return `<section class="card"><div class="row between"><h3>学习助手</h3><span class="badge">${connected?'服务可用':'暂未连接'}</span></div><p class="sub">${connected?'录入后自动生成中文释义、发音建议和商务例句，也可进行 AI 批改。':'连接后，新录入的单词和句子会自动生成学习资料。'}</p>${!isLocalAI()?`${connected?'<button class="plain" style="margin-top:12px" onclick="disconnectCloudAI()">断开连接</button>':'<label for="cloudCode">学习助手访问码</label><input id="cloudCode" type="password" autocomplete="off" placeholder="输入私享访问码"><button class="primary" style="margin-top:12px" onclick="connectCloudAI()">连接学习助手</button>'}`:''}${connected?'<button class="secondary" style="margin-top:12px" onclick="verifyBackend()">验证 AI 连接</button>':'<button class="plain" style="margin-top:12px" onclick="checkBackend()">重新检查连接</button>'}<p class="tiny" style="margin-top:12px">访问码仅用于此学习网页，不是百炼 API 密钥。学习内容在生成或批改时发送给后台与百炼。</p></section>`}
function missingLearning(w){let fields=[];for(let k of ['phonetic','mnemonic','scene','grammar'])if(!w[k]?.trim())fields.push(k);if(!w.meanings?.some(x=>x.trim()))fields.push('meanings');if(w.examples?.filter(e=>e.en?.trim()&&e.zh?.trim()).length<2)fields.push('examples');if(!w.syllables?.trim())fields.push('syllables');return fields}
const autoGenerationAttempts=new Set();
function resumePendingGeneration(){if(!hasAI())return;let changed=false;for(const w of db.words){if(!missingLearning(w).length)continue;const seed=SEED.find(x=>norm(x.word)===norm(w.word));if(!seed)continue;const n=normalizeWord(seed);for(const k of ['phonetic','meanings','examples','mnemonic','scene','grammar','syllables','phonicsNote','pos','root','family','affixes']){const absent=Array.isArray(w[k])?!w[k].length:!w[k]?.trim();if(absent&&(Array.isArray(n[k])?n[k].length:n[k])){w[k]=n[k];changed=true}}if(!missingLearning(w).length){w.generationError='';w.enrichFailed=false;changed=true}}if(changed){save();repaintGeneration()}const pending=db.words.filter(w=>!w.generating&&!autoGenerationAttempts.has(w.id)&&(!w.meanings?.some(t=>t.trim())||!w.phonetic?.trim())).slice(-6).reverse();if(!pending.length)return;for(const w of pending)autoGenerationAttempts.add(w.id);toast('正在补全已录入内容的中文释义和音标…');generateCards(pending.map(w=>w.id))}
let generationChain=Promise.resolve();
function generationNotice(w){if(w.generating)return '<p class="hint" role="status">正在生成中文释义、发音和例句，请稍候…</p>';if(w.generationError)return `<p class="hint" role="status">生成未完成：${esc(w.generationError)}</p><button class="secondary" onclick="enrichCurrent()">重试自动生成</button>`;if(missingLearning(w).length)return '<p class="hint">学习资料尚未完整。</p><button class="secondary" onclick="enrichCurrent()">重试自动生成</button>'; return ''}
function repaintGeneration(){if(view==='detail')renderDetail();else if(view==='library')renderLibrary()}
function generateCards(ids){let work=async()=>{let cards=[...new Set(ids)].map(id=>db.words.find(w=>w.id===id)).filter(w=>w&&missingLearning(w).length);if(!cards.length)return;for(let w of cards){w.generating=true;w.generationError=''}save();repaintGeneration();for(let i=0;i<cards.length;i+=3){let batch=cards.slice(i,i+3);try{let x=await aiJSON(wordPrompt(batch.map(w=>w.word)));for(let w of batch){let item=x.words?.find(t=>norm(t.word)===norm(w.word));if(!item){w.generationError='服务没有返回这项资料，请重试';continue}let n=normalizeWord(item);for(let k of ['phonetic','meanings','examples','mnemonic','scene','grammar','syllables','phonicsNote','pos','root','family','affixes']){let missing=Array.isArray(w[k])?(!w[k].length||(k==='examples'&&w.examples.filter(e=>e.en&&e.zh).length<2)):!w[k]?.trim();if(missing&&(Array.isArray(n[k])?n[k].length:n[k]))w[k]=n[k]}w.generationError=missingLearning(w).length?'部分资料未返回，请重试补全':'';w.enrichFailed=!!w.generationError}}catch(e){for(let w of batch){w.generationError=e.message;w.enrichFailed=true}}finally{for(let w of batch)w.generating=false;save();repaintGeneration()}}let failed=cards.filter(w=>w.generationError).length;toast(failed?`${failed} 项未完整生成，可重试`:'学习资料生成完成')};let result=generationChain.then(work,work);generationChain=result.catch(()=>{});return result}
async function enrichCurrent(){await generateCards([currentId])}
async function completePending(){await generateCards(db.words.filter(w=>missingLearning(w).length).map(w=>w.id))}
async function generatePhonics(){let w=current(),id=w.id;let btn=$('phonicsBtn');if(btn){btn.disabled=true;btn.textContent='正在分析发音…'}try{let x=await aiJSON(`分析英语发音：${JSON.stringify(w.word)}，类型：${w.kind}。返回 JSON 对象 {"word":"原文","phonetic":"美式IPA","syllables":"分段","phonicsNote":"中文重音与易错发音建议"}。如果是单词，syllables 按实际发音音节用 · 分隔，保留拼写；不要把字母随机切开。如果是词组或句子，syllables 用 · 分隔完整单词组成的自然意群，不在单词内部切分。只标注确有必要的发音难点，中文谐音仅可辅助，不冒充准确发音。自然拼读规则有例外，不能由字母切分反推全部读音。不要编造词源，不声称已经联网查证。`);if(norm(x.word)!==norm(w.word)||typeof x.syllables!=='string'||!x.syllables.trim()||typeof x.phonetic!=='string'||!x.phonetic.trim())throw Error('服务没有返回完整发音资料，请重试');w.phonetic=x.phonetic.trim();w.syllables=x.syllables.trim();w.phonicsNote=typeof x.phonicsNote==='string'?x.phonicsNote:'';w.phonicsError='';save();toast('发音分析已保存')}catch(e){w.phonicsError=e.message;save();toast('发音分析失败，可重试')}finally{if(view==='detail'&&currentId===id)renderDetail()}}

function cleanCorrection(x){let result={};for(let k of ['original','corrected','explanation','businessTip','encouragement','createdAt'])result[k]=typeof x?.[k]==='string'?x[k]:'';return result}
function correctionHistoryHTML(w){let items=w.correctionHistory?.length?w.correctionHistory:(w.lastCorrection?[w.lastCorrection]:[]);return items.map((x,index)=>({x,index})).reverse().map(({x,index})=>`<div class="hint" style="margin-top:12px"><button class="plain" style="float:right" aria-label="删除这条批改记录" title="删除这条批改记录" onclick="deleteCorrection(${index})">🗑 删除记录</button><p class="tiny">${esc(x.createdAt?new Date(x.createdAt).toLocaleString('zh-CN'):'已保存的批改')}</p>${x.original?`<p>原句：${esc(x.original)}</p>`:''}<strong>${esc(x.corrected)}</strong><p>${esc(x.explanation||'')}</p><p>${esc(x.businessTip||'')}</p><p>${esc(x.encouragement||'')}</p></div>`).join('')}

function renderReview(){let items=dueWords(),weak=db.words.filter(w=>w.status==='weak'),eligible=db.words.filter(w=>w.meanings.length);$('main').innerHTML=heading('把模糊，练成笃定。','主动回忆比反复浏览更有效；错题会提前回流。')+`<div class="stats"><div class="stat"><strong>${items.length}</strong><span>已到期</span></div><div class="stat"><strong>${weak.length}</strong><span>薄弱项</span></div><div class="stat"><strong>${eligible.length}</strong><span>可测试项</span></div></div><section class="card"><h3>选择今天的训练</h3><label>复习分类</label><select onchange="reviewCat=this.value"><option value="">所有分类</option>${db.categories.map(c=>`<option ${reviewCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="shortcuts" style="margin-top:18px"><button class="shortcut" onclick="startReview('quiz')"><span class="badge">推荐</span><strong>到期小测试 →</strong><small>英选中 · 汉选英 · 听辨 · 拼写</small></button><button class="shortcut" onclick="startReview('flash')"><span class="badge">快速回忆</span><strong>抽认卡复习 →</strong><small>先回忆，再翻面核对</small></button><button class="shortcut" onclick="startReview('quiz','weak')"><strong>薄弱项强化 →</strong><small>优先解决常错表达</small></button><button class="shortcut" onclick="startReview('quiz','all')"><strong>自由挑战 →</strong><small>从词库随机抽取 10 项</small></button></div></section><section class="card"><h3>间隔重复 · 你的记忆节奏</h3><p class="sub">初学 → 10 分钟 → 1 天 → 3 天 → 根据表现逐渐延长。每天首次答对时增长间隔（同日重复答对不虚增掌握度）；答错时降低难度系数，10 分钟后再见。连续答对 3 次且间隔达到 7 天后标为已掌握。</p><div class="pills"><span class="badge">短时回忆</span><span class="badge">间隔复习</span><span class="badge">混合题型</span><span class="badge">场景使用</span></div><p class="tiny">采用可解释的 SM-2 风格调度，并加入短时重学。记忆速度因人而异；这里的间隔是学习安排，不是精确的“遗忘百分比”。</p></section><div class="section-title"><h3>到期的记忆</h3><small>${items.length} 项</small></div><div class="list">${items.slice(0,10).map(wordrow).join('')||'<div class="card empty">暂时没有到期词。可自由挑战，或开始学新词。</div>'}</div>`}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function startReview(type,mode='due'){let items=db.words.filter(w=>w.meanings.length&&(!reviewCat||w.category===reviewCat));if(mode==='due')items=items.filter(w=>w.learned&&w.due<=Date.now());if(mode==='weak')items=items.filter(w=>w.status==='weak');if(!items.length){toast(mode==='due'?'此分类暂无到期复习，可选择自由挑战。':'暂无可测试内容；先补充中文释义。');return}queue=(mode==='due'?items.sort((a,b)=>a.due-b.due):shuffled(items)).slice(0,10).map(w=>w.id);qi=0;quiz=null;flashRevealed=false;view=type;render()}
function scheduleResult(w,correct,quality=4){if(!w.learned){w.learned=true;activity('new',w.id)}let l=log();l.attempts++;if(correct)l.correct++;l.xp+=correct?4:1;if(correct){if(w.lastSuccess!==dayKey()){w.reps=(w.reps||0)+1;w.ease=Math.max(1.3,(w.ease||2.5)+(.1-(5-quality)*(.08+(5-quality)*.02)));w.interval=w.reps===1?1:w.reps===2?3:Math.max(1,Math.round((w.interval||3)*w.ease));w.interval=Math.min(180,w.interval);w.due=Date.now()+w.interval*86400000;w.status=w.reps>=3&&w.interval>=7?'mastered':'weak';w.lastSuccess=dayKey()}}else{w.lastSuccess='';w.reps=0;w.lapses=(w.lapses||0)+1;w.ease=Math.max(1.3,(w.ease||2.5)-.2);w.interval=0;w.due=Date.now()+600000;w.status='weak'}activity('review',w.id);save()}
function makeQuiz(w){let type=qi%4,others=shuffled(db.words.filter(x=>x.id!==w.id&&x.meanings.length&&norm(x.meanings[0])!==norm(w.meanings[0]))).slice(0,3),choices=shuffled([w,...others]).map(x=>({id:x.id,text:type===0?x.meanings.join('；'):x.word}));return{type,choices,answered:false,selected:null,correct:false,spelling:''}}
function renderQuiz(){let w=db.words.find(w=>w.id===queue[qi]);if(!w){sessionEnd();return}if(!quiz)quiz=makeQuiz(w);const types=['英选中','汉选英','听音辨词','拼写填空'];$('main').innerHTML=`<button class="back" onclick="go('review')">← 结束本轮</button><div class="row between"><span class="badge">${types[quiz.type]}</span><span class="tiny">${qi+1} / ${queue.length}</span></div><div class="progress" style="margin:15px 0 25px"><i style="width:${qi/queue.length*100}%"></i></div><section class="card"><div class="eyebrow">RECALL BEFORE YOU REVEAL</div><div class="row between"><h2 style="flex:1">${quiz.type===0?esc(w.word):quiz.type===2?'听一遍，找到对应的表达。':esc(w.meanings.join('；'))}</h2><button class="pill" style="margin-top:12px" aria-label="播放题目发音" title="播放题目发音" onclick="speak(db.words.find(w=>w.id===queue[qi]).word)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5V4Z"/><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg></button></div>${quiz.type===3?`<label>写出对应的英语</label><input id="spelling" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="输入单词或表达" value="${esc(quiz.spelling)}" ${quiz.answered?'disabled':''} onkeydown="if(event.key==='Enter')answerSpell()"><button class="primary" style="margin-top:15px" onclick="answerSpell()" ${quiz.answered?'disabled':''}>提交答案</button>`:`<div class="quizchoices">${quiz.choices.map(c=>`<button class="choice ${quiz.answered?(c.id===w.id?'correct':c.id===quiz.selected?'wrong':''):''}" onclick="answerChoice('${c.id}')" ${quiz.answered?'disabled':''}>${esc(c.text)}</button>`).join('')}</div>`}${quiz.answered?`<div class="hint"><strong>${quiz.correct?(quiz.acornAwarded?'✓ 答对了！获得一颗橡果，可喂球球。':'✓ 回忆正确，记忆更牢了一点。'):'再见一次，才能记得更牢。'}</strong><p style="margin-top:8px">${esc(w.word)} · ${esc(w.meanings.join('；'))}</p><p class="tiny">${quiz.correct?'下次复习：'+new Date(w.due).toLocaleDateString('zh-CN'):'已加入薄弱项，10 分钟后安排重学。'}</p></div><div class function importPlan(obj){let p=obj.plan;if(!p||!Array.isArray(p.days)||!p.days.length)throw Error('计划需要非空 days 数组');let seen=new Set(),days=p.days.map((x,i)=>{let d=Number(x.day??i+1);if(!Number.isInteger(d)||d<1||seen.has(d))throw Error('day 应为不重复的正整数');seen.add(d);return{day:d,title:String(x.title||'第 '+d+' 天'),words:Array.isArray(x.words)?x.words.filter(w=>typeof w==='string'):[],new_count:boundedCount(x.new_count,5),review_count:boundedCount(x.review_count,10),note:String(x.note||''),done:false}}).sort((a,b)=>a.day-b.day);const plan={name:String(p.name||'我的商务英语计划'),start:dayKey(),days};if(db.plan){showModal(`<h3>替换当前学习计划？</h3><p class="sub">新计划“${esc(plan.name)}”包含 ${days.length} 天，会替换当前计划的任务勾选。词库和学习记录保留。</p><button class="primary" style="margin-top:15px" id="replacePlan">替换计划</button>`);$('replacePlan').onclick=()=>{db.plan=plan;save();closeModal();go('progress');toast('学习计划已导入。')};return}db.plan=plan;save();go('progress');toast('学习计划已导入。')}

,value/target)})))}

function achievementWall(items){let unlocked=items.filter(a=>a.on),next=items.filter(a=>!a.on).sort((a,b)=>b.ratio-a.ratio).slice(0,3),visible=showAllAchievements?items:[...unlocked.slice(-3),...next];return `<section class="card"><div class="row between"><h3>成就收藏册 · ${unlocked.length}/100</h3><button class="pill" onclick="showAllAchievements=!showAllAchievements;renderProgress()">${showAllAchievements?'收起':'查看全部100个'}</button></div><p class="sub">把每一次小进步，变成一枚小徽章。</p><div class="achievement-grid">${visible.map(a=>`<button class="achievement-tile ${a.on?'earned':'locked'}" onclick="showAchievement('${a.id}')" aria-label="${esc(a.title)}，${a.on?'已解锁':'未解锁'}"><span class="achievement-icon">${a.icon}</span><strong>${esc(a.title.split(' · ')[0])}</strong><span class="tiny">${esc(a.title.split(' · ')[1])}</span><span class="tiny">${a.on?'✓ 已解锁':Math.min(a.value,a.target)+'/'+a.target}</span></button>`).join('')}</div><p class="tiny" style="margin-top:10px">点击徽章查看解锁要求。</p></section>`}

function renderProgress(){let l=log(),t=totals(),learned=db.words.filter(w=>w.learned).length,mastered=db.words.filter(w=>w.status==='mastered').length,p=db.plan,done=p?.days.filter(d=>d.done).length||0;let dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return dayKey(d)});let achievements=achievementList();$('main').innerHTML=heading('看见自己的进步。','成长不必轰轰烈烈，持续就有力量。')+`<div class="stats"><div class="stat"><strong>${streak()}</strong><span>连续打卡天数</span></div><div class="stat"><strong>${learned}</strong><span>已学习表达</span></div><div class="stat"><strong>Lv.${Math.floor(t.xp/100)+1}</strong><span>${t.xp} 成长值</span></div></div><div class="grid"><section class="card"><div class="row between"><h3>今日打卡</h3><span class="badge">${l.checked?'✓ 目标完成':'进行中'}</span></div><label>新学 ${l.newIds.length} / ${db.settings.newGoal}</label><div class="progress"><i style="width:${db.settings.newGoal?Math.min(100,l.newIds.length/db.settings.newGoal*100):100}%"></i></div><label>复习 ${l.reviewIds.length} / ${db.settings.reviewGoal}</label><div class="progress"><i style="width:${db.settings.reviewGoal?Math.min(100,l.reviewIds.length/db.settings.reviewGoal*100):100}%"></i></div><div class="week">${dates.map(k=>`<div class="daydot ${db.logs[k]?.checked?'done':''}"><i>${db.logs[k]?.checked?'✓':k.slice(-2)}</i>${new Date(k+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'short'})}</div>`).join('')}</div><p class="tiny">同一项每天只计一次新学或复习；达到两个目标自动打卡。连续 3 / 7 / 30 天可领取额外成长值。</p><div class="row" style="margin-top:15px"><button class="secondary" onclick="go('settings')">调整目标</button><button class="primary" onclick="claimReward()">领取坚持奖励</button></div></section><section class="card"><h3>近七天 · 练习节奏</h3><div class="bars">${dates.map(k=>{let x=db.logs[k],n=(x?.newIds?.length||0)+(x?.reviewIds?.length||0);return`<div><span>${n}</span><i style="height:${Math.min(75,n*4)}px"></i><span>${k.slice(5)}</span></div>`}).join('')}</div><div class="rule"></div><div class="row between"><span> function claimReward(){let n=streak(),l=log(),milestone=[30,7,3].find(x=>n>=x);if(!milestone){toast('连续达标 3 天后，可领取第一份坚持奖励。');return}db.rewards=db.rewards||{};let key=dayKey()+':'+milestone;if(db.rewards[key]){toast('今天已领取，坚持明天再来。');return}db.rewards[key]=true;l.xp+=milestone===30?50:milestone===7?20:10;save();renderProgress();toast('坚持奖励已到账。每一次开口，都在变得更好。')}

function renderSettings(){$('main').innerHTML=`<button class="back" onclick="go('today')">← 返回今日</button>`+heading('让它适合你的节奏。','每个学习账户分别保存本机词库；只分享进度摘要。')+accountCard()+`<section class="card"><h3>每日目标</h3><div class="grid"><div><label>新学词数 / 表达数</label><input id="goalNew" type="number" min="0" max="200" value="${db.settings.newGoal}"></div><div><label>复习词数 / 表达数</label><input id="goalReview" type="number" min="0" max="200" value="${db.settings.reviewGoal}"></div></div><button class="primary" style="margin-top:15px" onclick="saveGoals()">保存目标</button><p class="tiny" style="margin-top:10px">建议开始时每日 5 新词 + 10 复习；第一天可把复习目标设为 0。</p></section>${connectionCard()}<section class="card"><h3>数据备份与恢复</h3><p class="sub">导出包含词库、掌握度、计划、打卡与设置，自动排除 API 密钥。录音单独保存在本机浏览器，不进入 JSON 备份；可逐条下载。</p><div class="row" style="margin-top:15px"><button class="primary" onclick="exportBackup()">导出 JSON 备份</button>${localStorage.getItem(activeStorageKey+':before-seed-removal')?'<button class="plain" onclick="downloadBeforeSeedRemoval()">下载词库调整前备份</button>':''}<a class="plain" href="./business-english.html" download>下载单文件 HTML</a><button class="secondary" onclick="$ ('backupFile').click()">恢复 JSON 备份</button><input type="file" id="backupFile" accept=".json,application/json" hidden onchange="readBackup(this)"></div><p class="tiny" style="margin-top:12px">当前存储：${storageOK?'本机浏览器可用':'不可用，请导出后再关闭'}。清理浏览器数据会删除学习记录。</p></section><section class="card"><h3>添加到手机主屏幕</h3><div class="row" style="margin-top:15px"><button class="secondary" onclick="installApp()">查看安装方式</button><button class="plain" onclick="downloadIcon()">下载应用图标</button></div><p class="sub">iPhone：Safari 打开网页 → 分享 → 添加到主屏幕。Android：Chrome 菜单 → 添加到主屏幕（或安装应用）。需要可访问的 HTTPS 地址；本地文件可直接学习，但部分手机不支持给文件创建主屏幕入口。</p><p class="tiny" style="margin-top:12px">下载的单文件嵌入图标、移动端元信息与动态 manifest，离线可查看本机已保存的词库。已发布网页版额外提供标准 manifest、图标与离线缓存；首次成功联网打开后可缓存应用。录音与 AI 功能仍受设备和网络条件影响。</p></section>`}

:[]).map(id=>idMap[id]).filter(Boolean),reviewIds:(Array.isArray(l.reviewIds)?l.reviewIds:[]).map(id=>idMap[id]).filter(Boolean),correct:Math.max(0,Number(l.correct)||0),attempts:Math.max(0,Number(l.attempts)||0),practices:Math.max(0,Number(l.practices)||0),xp:Math.max(0,Number(l.xp)||0),checked:!!l.checked}}
clean.settings={...clean.settings,newGoal:boundedCount(obj.settings.newGoal,5),reviewGoal:boundedCount(obj.settings.reviewGoal,10),speed:Math.max(.5,Math.min(1.2,Number(obj.settings.speed)||.85)),endpoint:typeof obj.settings.endpoint==='string'?obj.settings.endpoint:'',model:typeof obj.settings.model==='string'?obj.settings.model:''};if(clean.settings.newGoal+clean.settings.reviewGoal===0)clean.settings.newGoal=5;

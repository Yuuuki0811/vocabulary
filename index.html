cies.","zh":"所有费用报销均须符合公司会计政策。"},{"en":"She leads the accounting team responsible for monthly close.","zh":"她领导负责月度结账的会计团队。"}]},{"word":"branding","category":"市场","meanings":["品牌建设；品牌塑造"],"examples":[{"en":"Consistent branding across all channels strengthens customer recognition.","zh":"所有渠道的品牌形象保持一致，有助于提升客户辨识度。"},{"en":"The rebranding project will launch next quarter after legal review.","zh":"品牌重塑项目将在法务审核完成后于下季度启动。"}]},{"word":"employment","category":"人力","meanings":["雇佣；就业；工作岗位"],"examples":[{"en":"Full-time employment requires a signed offer letter and background check.","zh":"全职雇佣需签署录用函并完成背景调查。"},{"en":"The company’s employment practices comply with federal labor laws.","zh":"该公司雇佣实践符合联邦劳工法律。"}]},{"word":"operation","category":"项目与运营","meanings":["运营；业务活动；手术（此处不采用）"],"examples":[{"en":"Our Latin American operation launched last quarter with three local hires.","zh":"我们的拉美运营上季度启动，聘用了三名本地员工。"},{"en":"Any change to the core operation must be approved by the COO.","zh":"核心运营的任何变更均须经首席运营官批准。"}]},{"word":"strategic","category":"战略与沟通","meanings":["战略的；关键性的；有远见的"],"examples":[{"en":"We need a strategic partner in Southeast Asia, not just a distributor.","zh":"我们需要东南亚的战略合作伙伴，而不仅是一个分销商。"},{"en":"This acquisition is strategically aligned with our five-year growth plan.","zh":"此次收购在战略上与我们的五年增长计划保持一致。"}]},{"word":"mediation","category":"谈判","meanings":["调解；调停（尤指争议解决）"],"examples":[{"en":"Both parties agreed to mediation before filing a lawsuit.","zh":"双方同意在提起诉讼前进行调解。"},{"en":"The HR manager facilitated mediation between the two department heads.","zh":"人力资源经理主持了两位部门负责人的调解。"}]},{"word":"participant","category":"会议","meanings":["参与者；出席者；介入者"],"examples":[{"en":"All participants must register at least 48 hours before the virtual summit.","zh":"所有参会者须至少提前48小时注册线上峰会。"},{"en":"She was the only external participant in the executive strategy session.","zh":"她是本次高管战略会议中唯一的外部参会者。"}]},{"word":"attach","category":"邮件","meanings":["附加；附上（文件）"],"examples":[{"en":"Please attach the signed contract to your reply.","zh":"请将已签署的合同附在您的回复中。"},{"en":"I’ve attached three files—budget, timeline, and scope.","zh":"我已附上三份文件：预算、时间表和项目范围。"}]},{"word":"accountant","category":"财务","meanings":["会计师；财务人员"],"examples":[{"en":"Our accountant reviewed the Q3 expenses before submission.","zh":"我们的会计师在提交前审核了第三季度的费用。"},{"en":"The external accountant will audit the books next week.","zh":"外聘会计师将于下周审计账目。"}]},{"word":"trademark","category":"市场","meanings":["商标；注册商标"],"examples":[{"en":"This logo is a registered trademark of the company.","zh":"此标识是该公司的注册商标。"},{"en":"Avoid using competitors’ trademarks in your ad copy.","zh":"广告文案中请勿使用竞争对手的商标。"}]},{"word":"employer","category":"人力","meanings":["雇主；用人单位"],"examples":[{"en":"The employer must provide a written offer letter before onboarding.","zh":"雇主须在入职前提供书面录用函。"},{"en":"As the employer, we’re responsible for payroll tax filings.","zh":"作为雇主，我们负责工资税申报。"}]},{"word":"operational","category":"项目与运营","meanings":["运营的；运作的"],"examples":[{"en":"We need an operational plan before launching the new warehouse.","zh":"新仓库启用前，我们需要一份运营计划。"},{"en":"All teams are now operational after the system upgrade.","zh":"系统升级后，所有团队均已投入正常运作。"}]},{"word":"tactical","category":"战略与沟通","meanings":["策略性的；战术的"],"examples":[{"en":"We adjusted our tactical messaging to align with the regional campaign timeline.","zh":"我们调整了战术层面的信息传递，以配合区域活动的时间表。"},{"en":"The sales team developed a tactical plan for Q3 lead conversion.","zh":"销售团队制定了第三季度潜在客户转化的战术计划。"}]},{"word":"bargaining","category":"谈判","meanings":["讨价还价；谈判过程"],"examples":[{"en":"Her strong preparation gave her an advantage in salary bargaining.","zh":"她充分的准备使她在薪资谈判中占据优势。"},{"en":"Collective bargaining is required before the new labor agreement takes effect.","zh":"新劳工协议生效前须完成集体谈判。"}]},{"word":"participation","category":"会议","meanings":["参与；参加"],"examples":[{"en":"Full participation in the workshop is expected from all department leads.","zh":"所有部门负责人须全程参与本次研讨会。"},{"en":"Low participation in the feedback session suggests the timing needs adjustment.","zh":"反馈环节参与度低，表明时间安排需调整。"}]},{"word":"enclosure","category":"邮件","meanings":["附件；随函寄送的文件"],"examples":[{"en":"Please find the signed NDA as an enclosure to this email.","zh":"本邮件附件中附上已签署的保密协议。"},{"en":"Enclosures: Invoice #INV-2024-087 and delivery confirmation.","zh":"附件：发票#INV-2024-087及交货确认单。"}]},{"word":"bookkeeping","category":"财务","meanings":["簿记；账务记录"],"examples":[{"en":"Accurate bookkeeping is essential for timely financial reporting.","zh":"准确的簿记是及时出具财务报表的前提。"},{"en":"The intern supports the finance team with basic bookkeeping tasks.","zh":"实习生协助财务团队完成基础簿记工作。"}]},{"word":"slogan","category":"市场","meanings":["口号；广告语"],"examples":[{"en":"The new slogan 'Fresh Forward' aligns with our sustainability goals.","zh":"新口号‘新鲜前行’契合我们的可持续发展目标。"},{"en":"She pitched three slogan options to the marketing team.","zh":"她向营销团队提案了三个口号选项。"}]},{"word":"employee","category":"人力","meanings":["雇员；员工"],"examples":[{"en":"All full-time employees receive health insurance and PTO.","zh":"所有全职员工均享有健康保险和带薪休假。"},{"en":"The employee completed onboarding before joining the project team.","zh":"该员工在加入项目团队前已完成入职培训。"}]},{"word":"operate","category":"项目与运营","meanings":["运营；操作；开展（业务）"],"examples":[{"en":"The new logistics hub began to operate last Monday.","zh":"新的物流中心于上周一开始运营。"},{"en":"This software helps teams operate more efficiently across time zones.","zh":"该软件帮助团队跨越时区更高效地开展工作。"}]},{"word":"tactic","category":"战略与沟通","meanings":["战术；具体策略；应对方法"],"examples":[{"en":"Offering free training is a key tactic to win enterprise clients.","zh":"提供免费培训是赢得企业客户的关键战术。"},{"en":"The sales team adjusted its closing tactics after reviewing Q3 feedback.","zh":"销售团队在审阅第三季度反馈后调整了成交话术策略。"}]},{"word":"leverageable","category":"谈判","meanings":["可利用的；可借力的；能转化为优势的"],"examples":[{"en":"Their local distribution network is a highly leverageable asset in the APAC market.","zh":"其本地分销网络是亚太市场中极具可利用价值的资产。"},{"en":"Before the meeting, identify which terms are leverageable in your proposal.","zh":"会前请明确提案中哪些条款具有可借力性。"}]},{"word":"moderator","category":"会议","meanings":["主持人；协调人"],"examples":[{"en":"Please welcome our moderator, Ms. Lee, who will guide today’s strategy session.","zh":"欢迎我们的会议主持人李女士，她将引导今天的战略会议。"},{"en":"The moderator of the panel discussion ensured equal speaking time for all speakers.","zh":"该小组讨论的主持人确保每位发言者发言时间均等。"}]},{"word":"salutation","category":"邮件","meanings":["称呼语；问候语"],"examples":[{"en":"Use a formal salutation like 'Dear Dr. Chen' when emailing senior executives.","zh":"给高管发邮件时，请使用‘尊敬的陈博士’等正式称呼语。"},{"en":"The salutation in your proposal email was missing — please add 'Dear Marketing Team' before the body.","zh":"您提案邮件的称呼语缺失——请在正文前加上‘尊敬的市场部同事’。"}]},{"word":"ledger","category":"财务","meanings":["分类账；总账"],"examples":[{"en":"All vendor payments must be recorded in the general ledger by the 5th of each month.","zh":"所有供应商付款须于每月5日前记入总账。"},{"en":"The auditor requested access to the cash ledger for Q3 reconciliation.","zh":"审计师要求查阅第三季度现金分类账以进行对账。"}]},{"word":"tagline","category":"市场","meanings":["广告标语；品牌口号"],"examples":[{"en":"Our new tagline for the sustainability campaign is 'Progress, Not Perfection.'","zh":"本次可持续发展活动的新广告标语是‘追求进步，而非完美。’"},{"en":"The tagline appears below the logo on all digital ads and printed brochures.","zh":"该广告标语出现在所有数字广告和印刷宣传册的标识下方。"}]},{"word":"applicant","category":"人力","meanings":["申请人；应聘者"],"examples":[{"en":"We received over 200 applicants for the regional sales manager position.","zh":"我们收到了200多位区域销售经理职位的申请人。"},{"en":"Each applicant must complete the background check form before the final interview.","zh":"每位应聘者须在终面前完成背景调查表。"}]},{"word":"operator","category":"项目与运营","meanings":["操作员；运营商；（电话）接线员"],"examples":[{"en":"The machine operator confirmed the safety check was complete.","zh":"该机器操作员确认安全检查已完成。"},{"en":"Our cloud service operator handles incident response 24/7.","zh":"我们的云服务运营商全天候处理事件响应。"}]},{"word":"goal","category":"战略与沟通","meanings":["目标；目的；（绩效）指标"],"examples":[{"en":"One key goal for Q3 is to reduce customer onboarding time by 20%.","zh":"第三季度的关键目标之一是将客户上线时间缩短20%。"},{"en":"Let’s align our team goals with the company’s ESG commitments.","zh":"让我们将团队目标与公司的环境、社会和治理承诺保持一致。"}]},{"word":"stipulation","category":"谈判","meanings":["明确规定；条款；（合同中的）明示条件"],"examples":[{"en":"The contract includes a stipulation that all deliverables must be approved before payment.","zh":"合同中明确规定，所有交付物须经批准后方可付款。"},{"en":"Both parties accepted the stipulation regarding confidentiality duration.","zh":"双方均接受了关于保密期限的条款。"}]},{"word":"facilitator","category":"会议","meanings":["促进者；引导者；（会议/培训）主持人"],"examples":[{"en":"The facilitator kept the workshop on schedule and captured key decisions.","zh":"引导者把控研讨会进度，并记录关键决策。"},{"en":"She served as facilitator for the cross-regional alignment session.","zh":"她担任了此次跨区域对齐会议的引导者。"}]},{"word":"greeting","category":"邮件","meanings":["问候；（邮件/信函）开头敬语"],"examples":[{"en":"Please use a professional greeting such as 'Dear Ms. Lee' in client-facing emails.","zh":"面向客户的邮件请使用‘尊敬的李女士’等专业称呼。"},{"en":"The automated reply includes a friendly greeting and next-step instructions.","zh":"自动回复包含亲切的问候语及后续步骤说明。"}]},{"word":"debit","category":"财务","meanings":["借方；借记；应收款"],"examples":[{"en":"The vendor’s account was debited for the returned goods.","zh":"供应商账户因退货被借记。"},{"en":"Please ensure all debit entries comply with GAAP.","zh":"请确保所有借方分录符合公认会计准则。"}]},{"word":"reputation","category":"市场","meanings":["声誉；名气；信誉"],"examples":[{"en":"Our company has built a strong reputation for on-time delivery.","zh":"我司已建立起准时交付的良好声誉。"},{"en":"A single data breach can severely damage a firm’s reputation.","zh":"一次数据泄露可能严重损害企业声誉。"}]},{"word":"application","category":"人力","meanings":["申请；应用程序；应用（实例）"],"examples":[{"en":"All job applications must include a signed consent form.","zh":"所有职位申请必须附带签字同意书。"},{"en":"Late applications will not be considered.","zh":"逾期申请不予受理。"}]},{"word":"production","category":"项目与运营","meanings":["生产；产量；制作（过程）"],"examples":[{"en":"Production increased by 12% after the new line went live.","zh":"新产线投产后，产量增长了12%。"},{"en":"We monitor real-time production metrics daily.","zh":"我们每日监控实时生产指标。"}]},{"word":"ambition","category":"战略与沟通","meanings":["抱负；雄心；志向"],"examples":[{"en":"Her ambition to lead global product development aligns with our five-year roadmap.","zh":"她领导全球产品开发的抱负与我们的五年路线图一致。"},{"en":"The CEO emphasized that ambition without execution is irrelevant.","zh":"首席执行官强调，缺乏执行力的抱负毫无意义。"}]},{"word":"provision","category":"谈判","meanings":["条款；规定；准备；拨款"],"examples":[{"en":"The agreement includes a provision requiring annual audit reports.","zh":"协议包含一项条款，要求每年提交审计报告。"},{"en":"Both parties agreed to amend the force majeure provision before signing.","zh":"双方在签署前同意修改不可抗力条款。"}]},{"word":"chairperson","category":"会议","meanings":["会议主持人；主席（中性用语）"],"examples":[{"en":"The chairperson opened the meeting by reviewing last quarter’s KPIs.","zh":"主持人通过回顾上季度关键绩效指标开启会议。"},{"en":"Each committee must appoint a chairperson before the fiscal year begins.","zh":"各委员会须在财年伊始前任命一名主持人。"}]},{"word":"sincerely","category":"邮件","meanings":["真诚地；诚挚地"],"examples":[{"en":"Thank you for your prompt response. Sincerely, Maria Chen","zh":"感谢您的及时回复。此致，玛丽亚·陈"},{"en":"We look forward to your feedback. Sincerely, the Operations Team","zh":"期待您的反馈。此致，运营团队"}]},{"word":"credit","category":"财务","meanings":["信用；信贷；应收账款；学分（本义不取）"],"examples":[{"en":"New clients are granted net-30 credit after credit check approval.","zh":"新客户在信用审核通过后获准30天账期。"},{"en":"The invoice reflects a $5,000 credit for returned goods.","zh":"该发票体现了一笔5000美元的退货抵扣款。"}]},{"word":"publicity","category":"市场","meanings":["宣传；公众关注；媒体报道"],"examples":[{"en":"The product launch generated strong publicity across tech blogs.","zh":"该产品发布在各大科技博客引发广泛关注。"},{"en":"Avoid negative publicity by responding transparently to customer complaints.","zh":"通过透明回应客户投诉来避免负面宣传。"}]},{"word":"recruitment","category":"人力","meanings":["招聘；招募"],"examples":[{"en":"Recruitment for the new sales team starts next Monday.","zh":"新销售团队的招聘工作将于下周一启动。"},{"en":"The company prioritizes ethical recruitment over speed.","zh":"该公司将合规招聘置于速度之上。"}]},{"word":"manufacturing","category":"项目与运营","meanings":["制造业；制造（业）；生产过程"],"examples":[{"en":"Our manufacturing lead time has been reduced by 12% this quarter.","zh":"本季度我们的制造交期缩短了12%。"},{"en":"The audit covered quality control in manufacturing and packaging.","zh":"本次审核覆盖了制造与包装环节的质量控制。"}]},{"word":"roadmap","category":"战略与沟通","meanings":["路线图；实施路径图；发展蓝图"],"examples":[{"en":"The Q3 roadmap includes three key feature launches.","zh":"第三季度路线图包含三项关键功能上线。"},{"en":"Stakeholders approved the updated AI integration roadmap.","zh":"相关方已批准更新后的AI集成路线图。"}]},{"word":"amendment","category":"谈判","meanings":["修正案；修订条款；修改内容"],"examples":[{"en":"Both parties signed the amendment to Section 4.2 last Friday.","zh":"双方已于上周五签署第四章第4.2条的修正案。"},{"en":"No amendment is valid unless in writing and signed by authorized representatives.","zh":"任何修正案须以书面形式并经授权代表签署方为有效。"}]},{"word":"quorum","category":"会议","meanings":["法定人数；议事最低出席人数"],"examples":[{"en":"The meeting was adjourned because a quorum was not present.","zh":"因未达法定人数，会议宣布休会。"},{"en":"Per our bylaws, a quorum consists of five voting directors.","zh":"根据公司章程，法定人数为五名有表决权的董事。"}]},{"word":"acknowledgement","category":"邮件","meanings":["确认（收悉）；致谢"],"examples":[{"en":"Please send an acknowledgement once you receive the contract draft.","zh":"请在收到合同草稿后发送一份确认函。"},{"en":"We appreciate your prompt acknowledgement of our invoice.","zh":"感谢您及时确认收到我方发票。"}]},{"word":"receivable","category":"财务","meanings":["应收账款"],"examples":[{"en":"Our accounts receivable increased by 12% quarter-on-quarter.","zh":"我司应收账款环比增长12%。"},{"en":"This receivable is overdue by 45 days.","zh":"该笔应收账款已逾期45天。"}]},{"word":"advertise","category":"市场","meanings":["做广告；宣传"],"examples":[{"en":"We will advertise the new SaaS tool on LinkedIn and industry webinars.","zh":"我们将在领英和行业网络研讨会中推广这款新SaaS工具。"},{"en":"The open position was advertised internally last week.","zh":"该空缺职位已于上周在公司内部发布。"}]},{"word":"recruiter","category":"人力","meanings":["招聘人员；招聘专员"],"examples":[{"en":"Our recruiter scheduled the technical interview for tomorrow morning.","zh":"我们的招聘专员已安排技术面试于明早进行。"},{"en":"A good recruiter balances hiring speed with candidate experience.","zh":"优秀的招聘人员需兼顾招聘效率与候选人体验。"}]},{"word":"manufacture","category":"项目与运营","meanings":["制造；生产（动词）；制造业（名词）"],"examples":[{"en":"This component must be manufactured to ISO 9001 standards.","zh":"该部件须按ISO 9001标准制造。"},{"en":"The company outsourced part of its manufacture to a Tier-2 supplier.","zh":"该公司将部分制造业务外包给二级供应商。"}]},{"word":"direction","category":"战略与沟通","meanings":["指导；方向；指示；（公司）管理层"],"examples":[{"en":"The CEO outlined the company's new strategic direction in the all-hands meeting.","zh":"首席执行官在全员会上明确了公司的新战略方向。"},{"en":"Please follow the direction from Finance on invoice submission deadlines.","zh":"请遵照财务部关于发票提交截止时间的指示。"}]},{"word":"addendum","category":"谈判","meanings":["附加条款；附录；补充文件"],"examples":[{"en":"Both parties signed the addendum to extend the confidentiality period by six months.","zh":"双方签署了附加条款，将保密期延长六个月。"},{"en":"The contract includes an addendum specifying delivery milestones.","zh":"该合同包含一份明确交货里程碑的附录。"}]},{"word":"briefing","category":"会议","meanings":["简报；情况说明；（为某任务做的）准备性介绍"],"examples":[{"en":"The project kickoff includes a 30-minute briefing on scope and deliverables.","zh":"项目启动会包含一段30分钟的范围与交付物说明。"},{"en":"She requested a briefing about the client’s latest feedback before the call.","zh":"她在通话前要求就客户的最新反馈做一次简报。"}]},{"word":"acknowledgment","category":"邮件","meanings":["确认收到；致谢；认可"],"examples":[{"en":"Please send an acknowledgment once the signed NDA is received.","zh":"请在收到已签署的保密协议后发送确认回执。"},{"en":"His email served as formal acknowledgment of the revised timeline.","zh":"他的邮件正式确认已知悉修订后的时间表。"}]},{"word":"payable","category":"财务","meanings":["应付的；应支付的"],"examples":[{"en":"All invoices are payable within 15 business days of receipt.","zh":"所有发票须在收讫之日起15个工作日内支付。"},{"en":"The amount shown is the total amount payable to Vendor A.","zh":"所列金额为应付给供应商A的总额。"}]},{"word":"advertising","category":"市场","meanings":["广告；广告活动"],"examples":[{"en":"Our advertising focuses on social media and influencer partnerships.","zh":"我们的广告重点投放在社交媒体和网红合作上。"},{"en":"The team reviewed last quarter’s advertising performance against KPIs.","zh":"团队依据KPI复盘了上季度的广告效果。"}]},{"word":"hiring","category":"人力","meanings":["招聘；聘用过程"],"examples":[{"en":"Hiring for the new engineering roles will start next month.","zh":"新工程岗位的招聘将于下月启动。"},{"en":"Slow hiring is affecting our Q3 product launch timeline.","zh":"招聘进度迟缓正影响我们第三季度的产品发布计划。"}]},{"word":"manufacturer","category":"项目与运营","meanings":["制造商；生产厂商"],"examples":[{"en":"We selected a U.S.-based manufacturer with ISO 13485 certification.","zh":"我们选定了一家通过ISO 13485认证的美国制造商。"},{"en":"The manufacturer confirmed delivery by August 15.","zh":"该制造商确认将于8月15日前交货。"}]},{"word":"transformation","category":"战略与沟通","meanings":["转型；变革；转化"],"examples":[{"en":"Digital transformation requires alignment across IT, finance, and operations.","zh":"数字化转型需要IT、财务与运营部门协同对齐。"},{"en":"The board approved the three-year transformation roadmap last week.","zh":"董事会已于上周批准三年转型路线图。"}]},{"word":"ratify","category":"谈判","meanings":["正式批准；使生效（尤指经权威机构）"],"examples":[{"en":"The joint venture agreement will take effect once both boards ratify it.","zh":"合资协议须待双方董事会批准后方能生效。"},{"en":"Shareholders ratified the merger terms at yesterday’s special meeting.","zh":"股东们在昨日特别会议上批准了并购条款。"}]},{"word":"debriefing","category":"会议","meanings":["汇报会；情况回顾"],"examples":[{"en":"The project manager scheduled a debriefing on Friday afternoon.","zh":"项目经理安排了周五下午的项目汇报会。"},{"en":"We need a thorough debriefing about the client’s feedback.","zh":"我们需要就客户的反馈进行一次全面的情况回顾。"}]},{"word":"receipt","category":"邮件","meanings":["收据；收到确认"],"examples":[{"en":"Please acknowledge receipt of this invoice by replying to this email.","zh":"请通过回复本邮件确认已收到此发票。"},{"en":"The vendor emailed the receipt within one hour of payment.","zh":"供应商在付款后一小时内通过邮件发送了收据。"}]},{"word":"depreciation","category":"财务","meanings":["折旧；资产价值下降"],"examples":[{"en":"Depreciation of office equipment is recorded monthly in our accounting system.","zh":"办公设备的折旧每月在我们的会计系统中入账。"},{"en":"Tax regulations require companies to calculate depreciation of machinery over its useful life.","zh":"税务法规要求企业按机器设备的使用年限计算折旧。"}]},{"word":"advertisement","category":"市场","meanings":["广告；广告活动"],"examples":[{"en":"Our team reviewed all advertisements before the product launch.","zh":"我们团队在产品上市前审核了所有广告。"},{"en":"This advertisement targets professionals aged 25–34 on LinkedIn.","zh":"这则广告面向领英平台上25至34岁的职场人士。"}]},{"word":"hire","category":"人力","meanings":["聘用；雇用（动词）；新员工（名词）"],"examples":[{"en":"We plan to hire three software engineers this quarter.","zh":"我们计划本季度聘用三名软件工程师。"},{"en":"She is our newest hire in the marketing department.","zh":"她是市场营销部最新入职的员工。"}]},{"word":"assembly","category":"项目与运营","meanings":["组装；集会；装配线；（立法）议会"],"examples":[{"en":"Final assembly begins next Monday after QA approval.","zh":"质量部批准后，最终组装将于下周一启动。"},{"en":"The engineering team will attend the plant assembly to review workflow.","zh":"工程团队将出席工厂例会，复盘工作流程。"}]},{"word":"transition","category":"战略与沟通","meanings":["过渡；转变；转换"],"examples":[{"en":"Our transition to cloud infrastructure will take six months.","zh":"我们向云基础设施的过渡将持续六个月。"},{"en":"Leaders must manage employee concerns during the transition.","zh":"管理者须在转型期间妥善应对员工疑虑。"}]},{"word":"ratification","category":"谈判","meanings":["批准；正式认可（尤指条约、协议或任命）"],"examples":[{"en":"Contract ratification requires signatures from both legal departments.","zh":"合同批准需双方法务部门签字。"},{"en":"Ratification is pending after the joint venture agreement was signed.","zh":"合资协议签署后，批准程序尚待完成。"}]},{"word":"workshop","category":"会议","meanings":["研讨会；讲习班；车间"],"examples":[{"en":"The product launch workshop will cover messaging, pricing, and channel rollout.","zh":"产品上市研讨会将涵盖话术、定价及渠道铺货。"},{"en":"Please confirm your attendance at tomorrow’s compliance workshop.","zh":"请确认是否出席明日的合规培训会。"}]},{"word":"notification","category":"邮件","meanings":["通知；通告；告知行为"],"examples":[{"en":"System downtime notification will be sent 72 hours in advance.","zh":"系统停机通知将提前72小时发出。"},{"en":"All notifications must include a clear subject line and action deadline.","zh":"所有通知邮件须含明确主题行及行动截止时间。"}]},{"word":"amortization","category":"财务","meanings":["（资产）摊销；（贷款）分期偿还"],"examples":[{"en":"The company records amortization of its patent over ten years.","zh":"该公司将在十年内对专利进行摊销。"},{"en":"Amortization reduces the book value of intangible assets annually.","zh":"摊销每年减少无形资产的账面价值。"}]},{"word":"outreach","category":"市场","meanings":["外展服务；对外联络；市场推广活动"],"examples":[{"en":"Our digital outreach increased lead generation by 30% last quarter.","zh":"上季度我们的数字外展活动使销售线索增长了30%。"},{"en":"The NGO’s education outreach targets rural teachers.","zh":"该非营利组织的教育外展活动面向乡村教师。"}]},{"word":"interviewer","category":"人力","meanings":["面试官；采访者"],"examples":[{"en":"Each candidate meets two interviewers from different departments.","zh":"每位候选人将与来自不同部门的两位面试官面谈。"},{"en":"The interviewer took notes during the behavioral questions.","zh":"面试官在行为类问题环节做了笔记。"}]},{"word":"assemble","category":"项目与运营","meanings":["组装；召集；收集（信息/团队）"],"examples":[{"en":"The project manager will assemble the core team next Monday.","zh":"项目经理将于下周一组建核心团队。"},{"en":"We need to assemble all compliance documents before audit.","zh":"我们需要在审计前汇总全部合规文件。"}]},{"word":"adaptation","category":"战略与沟通","meanings":["适应；改编；调整（以适应新环境或要求）"],"examples":[{"en":"Market adaptation is critical when launching in Southeast Asia.","zh":"进军东南亚市场时，本地化调整至关重要。"},{"en":"The team presented an adaptation plan for remote work policies.","zh":"该团队提交了远程办公政策的调整方案。"}]},{"word":"enforce","category":"谈判","meanings":["强制执行；实施（法律、协议、规则）"],"examples":[{"en":"The buyer reserves the right to enforce the penalty clause if delivery is delayed.","zh":"若交货延迟，买方保留在本罚则条款下采取强制执行措施的权利。"},{"en":"Both parties must cooperate to enforce the confidentiality obligations.","zh":"双方须配合履行保密义务的强制执行。"}]},{"word":"seminar","category":"会议","meanings":["研讨会；专题讲座（尤指专业或学术性）"],"examples":[{"en":"We’ll host a seminar on GDPR compliance for regional sales managers next month.","zh":"我们将于下月为各区域销售经理举办一场关于GDPR合规的研讨会。"},{"en":"Attendance at the product launch seminar is mandatory for all marketing staff.","zh":"所有市场部员工必须参加本次产品发布研讨会。"}]},{"word":"remind","category":"邮件","meanings":["提醒；使想起"],"examples":[{"en":"I’m writing to remind you that the Q3 budget submission is due this Friday.","zh":"谨此提醒您，第三季度预算提交截止日期为本周五。"},{"en":"Could you please remind the team about the revised NDA template before signing?","zh":"签署前，请您提醒团队使用修订后的保密协议模板。"}]},{"word":"amortisation","category":"财务","meanings":["摊销（将无形资产或贷款成本在一定期限内系统分摊）"],"examples":[{"en":"The software license will be recorded as an intangible asset and amortised over five years.","zh":"该软件许可将列为无形资产，并在五年内进行摊销。"},{"en":"Amortisation expense reduced net income by $120,000 this quarter.","zh":"本季度摊销费用使净利润减少了12万美元。"}]},{"word":"engagement","category":"市场","meanings":["参与度；委托关系；客户合作项目"],"examples":[{"en":"Our latest campaign achieved 35% higher social media engagement than last quarter.","zh":"我方最新营销活动的社交媒体参与度较上季度提升35%。"},{"en":"This consulting engagement covers market entry strategy and local partner vetting.","zh":"本次咨询委托涵盖市场进入策略制定及本地合作伙伴尽职调查。"}]},{"word":"interviewee","category":"人力","meanings":["接受面试者"],"examples":[{"en":"The interviewee arrived ten minutes early and brought updated portfolio samples.","zh":"应聘者提前十分钟到达，并带来了更新的作品集样本。"},{"en":"Each interviewee will receive feedback within five business days.","zh":"每位应聘者将在五个工作日内收到反馈。"}]},{"word":"component","category":"项目与运营","meanings":["组成部分；部件；要素"],"examples":[{"en":"This software update includes three major components: UI redesign, API optimization, and security patching.","zh":"本次软件更新包含三大组成部分：用户界面重新设计、API优化和安全补丁。"},{"en":"Procurement lead time for the battery component has increased by 12%.","zh":"电池部件的采购交货期已增加12%。"}]},{"word":"adapt","category":"战略与沟通","meanings":["调整；使适应；改编"],"examples":[{"en":"Teams must adapt quickly to new compliance requirements before the fiscal quarter ends.","zh":"团队必须在财年季度结束前迅速适应新的合规要求。"},{"en":"We adapted the presentation for a non-technical audience by replacing jargon with plain language.","zh":"我们通过用平实语言替代术语，将演示文稿调整为面向非技术人员。"}]},{"word":"enforceable","category":"谈判","meanings":["可强制执行的；具法律约束力的"],"examples":[{"en":"A non-compete clause is only enforceable if it has reasonable geographic and temporal limits.","zh":"竞业限制条款仅在具有合理地域和时间限制时才具可执行性。"},{"en":"Both parties agreed to make the arbitration award final and enforceable in all jurisdictions.","zh":"双方同意使仲裁裁决在所有司法管辖区终局且可强制执行。"}]},{"word":"conference","category":"会议","meanings":["会议；研讨会；（正式）协商"],"examples":[{"en":"She presented the Q3 roadmap at the global product conference last Tuesday.","zh":"她于上周二在全球产品大会上发布了第三季度路线图。"},{"en":"Registration for the hybrid sales conference closes Friday at noon.","zh":"线上线下混合销售大会的报名将于本周五中午截止。"}]},{"word":"enquire","category":"邮件","meanings":["询问；打听（尤指正式或礼貌地）"],"examples":[{"en":"We enquire about the delivery schedule for the Q3 order.","zh":"我们想了解第三季度订单的交货时间安排。"},{"en":"Please enquire further if any specification is unclear.","zh":"如有任何规格不明确，请进一步咨询。"}]},{"word":"valuation","category":"财务","meanings":["估价；估值；评估（尤指资产、公司或投资价值）"],"examples":[{"en":"The auditor issued a revised valuation of the company’s intangible assets.","zh":"审计师发布了对公司无形资产的修订估值。"},{"en":"Our valuation of the startup was based on projected cash flows.","zh":"我们对这家初创企业的估值基于预测现金流。"}]},{"word":"impression","category":"市场","meanings":["印象；观感；初步判断"],"examples":[{"en":"Customer surveys show a positive impression of the new packaging design.","zh":"客户调查显示，消费者对新包装设计印象积极。"},{"en":"The keynote speaker left a professional impression on all attendees.","zh":"主题演讲人给所有与会者留下了专业印象。"}]},{"word":"credential","category":"人力","meanings":["资历证明；资质证书；可信凭据"],"examples":[{"en":"All consultants must submit valid credentials before project onboarding.","zh":"所有顾问须在项目启动前提交有效资质证明。"},{"en":"Her academic credentials and industry experience align well with the role.","zh":"她的学历资质和行业经验与该职位高度匹配。"}]},{"word":"specification","category":"项目与运营","meanings":["规格；技术参数；详细要求"],"examples":[{"en":"The vendor failed to meet the technical specification for thermal resistance.","zh":"该供应商未能达到热阻方面的技术规格要求。"},{"en":"Please review the updated specification before final sign-off.","zh":"请在最终签字前审阅更新后的规格文档。"}]},{"word":"adaptive","category":"战略与沟通","meanings":["适应性强的；能灵活调整的"],"examples":[{"en":"Our team is highly adaptive to client feedback during product development.","zh":"我们的团队在产品开发过程中能高度响应客户反馈。"},{"en":"An adaptive communication strategy helped us enter three new markets last year.","zh":"一套灵活的沟通策略帮助我们去年成功进入三个新市场。"}]},{"word":"indemnity","category":"谈判","meanings":["赔偿责任；补偿保障；免责条款"],"examples":[{"en":"The supplier agreed to provide full indemnity for any intellectual property claims arising from the software.","zh":"供应商同意就该软件引发的任何知识产权索赔承担全额赔偿责任。"},{"en":"Negotiations stalled when both parties refused to accept broad indemnity for third-party data breaches.","zh":"双方均拒绝承担第三方数据泄露的广泛赔偿责任，致使谈判陷入僵局。"}]},{"word":"symposium","category":"会议","meanings":["专题研讨会；专家座谈会议"],"examples":[{"en":"Our CFO will present new ESG metrics at tomorrow’s symposium on sustainable finance.","zh":"我司首席财务官将在明日关于可持续金融的专题研讨会上发布新的ESG指标。"},{"en":"The tech symposium brought together 200 industry leaders to discuss AI governance frameworks.","zh":"本次科技专题研讨会汇聚200位行业领袖，共同探讨人工智能治理框架。"}]},{"word":"respond","category":"邮件","meanings":["回复；回应；作出反应"],"examples":[{"en":"Please respond to this email by Friday with your availability for the Q3 review meeting.","zh":"请于周五前回复本邮件，告知您参加第三季度复盘会议的时间安排。","grammar":"respond to + noun phrase（固定搭配，不可省略to）"},{"en":"We aim to respond to all customer support inquiries within two business hours.","zh":"我们承诺在两个工作小时内回复所有客户支持咨询。","grammar":"不定式to respond作主语补足语，表目标；within引导时间状语"}]},{"word":"liquidity","category":"财务","meanings":["流动性；资产变现能力"],"examples":[{"en":"The company improved its liquidity by reducing inventory and extending payables.","zh":"该公司通过降低库存和延长应付账款周期提升了流动性。","grammar":"improved + noun（liquidity）作及物动词宾语；by + gerund短语表方式"},{"en":"Low liquidity may trigger covenant violations under our credit agreement.","zh":"流动性不足可能触发信贷协议中的违约条款。","grammar":"may + base verb表可能性；subject-verb agreement：Low liquidity（单数主语）→ may trigger"}]},{"word":"clickthrough","category":"市场","meanings":["点击率；用户从链接或广告点击进入目标页面的行为"],"examples":[{"en":"Our Q3 email campaign achieved a 12% clickthrough to the product page.","zh":"我们第三季度的邮件营销活动点击率达到了12%。"},{"en":"The client asked us to track clickthrough on all banner ads separately.","zh":"客户要求我们分别追踪所有横幅广告的点击行为。"}]},{"word":"résumé","category":"人力","meanings":["简历；个人履历摘要"],"examples":[{"en":"Please submit your résumé and cover letter by Friday.","zh":"请于周五前提交您的简历和求职信。"},{"en":"She updated her résumé to highlight cross-functional project experience.","zh":"她更新了简历，以突出跨职能项目经验。"}]},{"word":"spec","category":"项目与运营","meanings":["规格说明；技术或功能需求文档"],"examples":[{"en":"The dev team won’t start coding until the final spec is approved.","zh":"开发团队要等最终版规格说明书获批后才开始编码。"},{"en":"We need to align the UI design with the client’s written spec.","zh":"我们需要让UI设计与客户的书面规格说明保持一致。"}]},{"word":"resilience","category":"战略与沟通","meanings":["韧性；组织或个人应对压力、变化或逆境并恢复的能力"],"examples":[{"en":"Building supply chain resilience is now a top priority for procurement leaders.","zh":"构建供应链韧性已成为采购负责人的首要任务。"},{"en":"The CEO emphasized cultural resilience during the restructuring announcement.","zh":"首席执行官在重组公告中强调了企业文化韧性。"}]},{"word":"indemnify","category":"谈判","meanings":["赔偿；使免受损失；法律上承诺承担他人可能产生的责任或损失"],"examples":[{"en":"The vendor agrees to indemnify the buyer against any third-party IP claims.","zh":"供应商同意就任何第三方知识产权主张向买方提供赔偿。"},{"en":"This clause does not indemnify the service provider for gross negligence.","zh":"本条款不豁免服务提供商的重大过失责任。"}]},{"word":"presentation","category":"会议","meanings":["演示；陈述；介绍"],"examples":[{"en":"Her presentation on market entry strategy convinced the investment committee.","zh":"她关于市场进入策略的演示说服了投资委员会。"},{"en":"Please keep your presentation under 15 minutes to allow time for Q&A.","zh":"请将您的演示控制在15分钟内，以便留出问答时间。"}]},{"word":"forwarding","category":"邮件","meanings":["转发（邮件、信息等）；货运代理（行业用法）"],"examples":[{"en":"Email forwarding must be configured before the team leaves for the trade show.","zh":"团队出发参加展会前，必须配置好邮件转发功能。"},{"en":"He handled all forwarding of client requests to the appropriate department.","zh":"他负责将所有客户请求转发至相关部门。"}]},{"word":"solvency","category":"财务","meanings":["偿债能力；清偿力"],"examples":[{"en":"The audit confirmed the company’s solvency despite declining revenues.","zh":"尽管收入下降，审计确认了公司的偿债能力。"},{"en":"Regulators require annual disclosure of solvency ratios for licensed insurers.","zh":"监管机构要求持牌保险公司每年披露偿付能力比率。"}]},{"word":"audience","category":"市场","meanings":["目标受众；听众；观众"],"examples":[{"en":"Our new campaign targets a younger audience through TikTok and Instagram.","zh":"我们的新活动通过TikTok和Instagram触达更年轻的受众。"},{"en":"Understanding your audience’s pain points is essential for effective messaging.","zh":"理解目标受众的痛点，是实现有效信息传递的关键。"}]},{"word":"CV","category":"人力","meanings":["简历（curriculum vitae的缩写）"],"examples":[{"en":"Shortlisted candidates will be invited for interviews after CV review.","zh":"初选候选人将在简历审核后获邀参加面试。"},{"en":"Please submit your CV and cover letter by Friday.","zh":"请于周五前提交您的简历和求职信。"}]},{"word":"specifications","category":"项目与运营","meanings":["技术规格；详细要求"],"examples":[{"en":"The vendor must comply with all specifications outlined in Section 3.2.","zh":"供应商须符合第3.2节中列出的所有技术规格。"},{"en":"We’ll revise the specifications after client feedback next Monday.","zh":"我们将在下周一客户反馈后修订技术规格。"}]},{"word":"resilient","category":"战略与沟通","meanings":["有韧性的；适应力强的；抗压的"],"examples":[{"en":"Our supply chain is now more resilient thanks to dual-sourcing agreements.","zh":"得益于双源采购协议，我们的供应链更具韧性。"},{"en":"Leaders must foster a resilient culture that embraces change.","zh":"管理者必须培育一种能积极应对变化的韧性文化。"}]},{"word":"warranty","category":"谈判","meanings":["保修期；担保；保证条款"],"examples":[{"en":"The warranty covers parts and labor for two years from delivery.","zh":"本保修期自交货日起覆盖零部件及人工服务两年。"},{"en":"They refused to extend the warranty beyond 12 months.","zh":"他们拒绝将保修期延长至12个月以上。"}]},{"word":"demonstrate","category":"会议","meanings":["展示；证明；说明"],"examples":[{"en":"Let me demonstrate how the reporting dashboard updates in real time.","zh":"我来演示报表仪表盘如何实时更新。"},{"en":"We’ll demonstrate compliance with GDPR through our audit logs.","zh":"我们将通过审计日志证明符合GDPR要求。"}]},{"word":"apology","category":"邮件","meanings":["道歉；致歉信"],"examples":[{"en":"Please accept our sincere apology for the shipment delay.","zh":"敬请接受我们对此次发货延迟的诚挚歉意。"},{"en":"The apology email included a discount voucher and revised timeline.","zh":"这封致歉邮件附带了一张折扣券及修订后的时间表。"}]},{"word":"insolvent","category":"财务","meanings":["资不抵债的；无力偿债的"],"examples":[{"en":"The company was declared insolvent after failing to meet its debt obligations for six months.","zh":"该公司连续六个月未能履行债务义务，被裁定破产。"},{"en":"We cannot extend further credit to an insolvent client.","zh":"我们不能向资不抵债的客户继续提供信用额度。"}]},{"word":"demographic","category":"市场","meanings":["人口统计学的；按人口特征划分的"],"examples":[{"en":"Our new product targets the 25–34 demographic with high disposable income.","zh":"我们的新产品面向可支配收入较高的25–34岁人群。"},{"en":"The campaign’s performance varied significantly across each demographic segment.","zh":"该营销活动在各个人口统计细分群体中的表现差异显著。"}]},{"word":"expertise","category":"人力","meanings":["专门知识；专业技能"],"examples":[{"en":"Her expertise in supply chain optimization helped reduce lead times by 20%.","zh":"她在供应链优化方面的专业知识使交货周期缩短了20%。"},{"en":"The project requires legal and regulatory expertise not currently available in-house.","zh":"该项目需要目前公司内部尚不具备的法律与合规专业技能。"}]},{"word":"standard","category":"项目与运营","meanings":["标准；规范；基准"],"examples":[{"en":"All deliverables must comply with the ISO 9001 quality standard.","zh":"所有交付物必须符合ISO 9001质量标准。"},{"en":"We revised our internal documentation standards to align with GDPR requirements.","zh":"我们修订了内部文档规范，以符合GDPR要求。"}]},{"word":"sustainability","category":"战略与沟通","meanings":["可持续性；可持续发展能力"],"examples":[{"en":"Investors increasingly evaluate companies based on their ESG performance and long-term sustainability.","zh":"投资者日益依据企业的ESG表现及长期可持续性进行评估。"},{"en":"Our annual sustainability report outlines progress on carbon reduction and ethical sourcing.","zh":"我们的年度可持续发展报告概述了碳减排与道德采购方面的进展。"}]},{"word":"guarantee","category":"谈判","meanings":["保证；担保；保修"],"examples":[{"en":"We guarantee delivery within 10 business days.","zh":"我们保证在10个工作日内交货。"},{"en":"The contract includes a guarantee of product quality.","zh":"该合同包含产品质量保证条款。"}]},{"word":"demonstration","category":"会议","meanings":["演示；说明；示威（此处仅取商务义）"],"examples":[{"en":"Please join our live demo session for the new CRM platform.","zh":"请参加我们新CRM平台的现场演示会。"},{"en":"The sales team gave a clear demonstration of how the software integrates with existing tools.","zh":"销售团队清晰演示了该软件如何与现有工具集成。"}]},{"word":"inconvenience","category":"邮件","meanings":["不便；麻烦"],"examples":[{"en":"We apologize for any inconvenience caused by the server outage.","zh":"服务器中断给您带来的任何不便，我们深表歉意。"},{"en":"Thank you for your patience and understanding during this temporary inconvenience.","zh":"感谢您在此短暂不便期间的耐心与理解。"}]},{"word":"insolvency","category":"财务","meanings":["无力偿债；破产（法律状态，非已宣告破产）"],"examples":[{"en":"The audit flagged potential insolvency due to sustained cash flow deficits.","zh":"审计报告指出，因持续现金流赤字，公司存在潜在无力偿债风险。"},{"en":"Lenders require regular solvency reports to assess insolvency risk.","zh":"贷款方要求定期提交偿付能力报告，以评估无力偿债风险。"}]},{"word":"segmentation","category":"市场","meanings":["市场细分；分段"],"examples":[{"en":"Our latest campaign uses behavioral segmentation to target high-intent leads.","zh":"我们最新营销活动采用行为细分法，精准触达高意向潜在客户。"},{"en":"Geographic segmentation helps localize pricing and promotion strategies.","zh":"地理细分有助于本地化定价与促销策略。"}]},{"word":"competency","category":"人力","meanings":["胜任力；能力（尤指岗位所需的具体技能或行为标准）"],"examples":[{"en":"The HR team mapped all leadership competencies to the new succession plan.","zh":"人力资源团队将所有领导力胜任力映射到新的人才继任计划中。"},{"en":"She demonstrated strong analytical competency during the case interview.","zh":"她在案例面试中展现了出色的分析能力。"}]},{"word":"standardization","category":"项目与运营","meanings":["标准化；使符合统一规范的过程"],"examples":[{"en":"Standardization of reporting templates improved cross-team data comparability.","zh":"报告模板的标准化提升了跨团队数据的可比性。"},{"en":"The project manager emphasized standardization before scaling the pilot to five sites.","zh":"项目经理在将试点推广至五个地点前，强调了标准化的重要性。"}]},{"word":"governance","category":"战略与沟通","meanings":["治理；对组织决策、风险与合规的系统性监督与制衡机制"],"examples":[{"en":"Clear accountability in governance helped restore stakeholder trust after the audit.","zh":"治理中明确的责任归属，在审计后帮助恢复了利益相关方的信任。"},{"en":"The committee reviewed updates to the AI governance policy ahead of Q3 rollout.","zh":"委员会在第三季度上线前审阅了人工智能治理政策的更新内容。"}]},{"word":"exclusivity","category":"谈判","meanings":["排他性；一方在特定范围内的独占权利或地位"],"examples":[{"en":"The distributor requested 12-month exclusivity in the Southeast region.","zh":"该分销商要求在东南地区享有为期12个月的排他权。"},{"en":"Exclusivity under this agreement does not cover online sales channels.","zh":"本协议项下的排他性不涵盖线上销售渠道。"}]},{"word":"deliberation","category":"会议","meanings":["审慎考虑；正式讨论（尤指为达成共识或决策而进行的严肃商议）"],"examples":[{"en":"After 45 minutes of deliberation, the committee approved the revised budget.","zh":"经过45分钟的审慎讨论，委员会批准了修订后的预算。"},{"en":"Key risks were raised during the deliberation but deferred for deeper analysis.","zh":"关键风险在讨论中被提出，但推迟至后续深入分析。"}]},{"word":"appreciation","category":"邮件","meanings":["感激；升值；鉴赏力"],"examples":[{"en":"We express our sincere appreciation of your prompt response.","zh":"我们衷心感谢您及时回复。"},{"en":"Your support is greatly appreciated.","zh":"非常感谢您的支持。"}]},{"word":"bankruptcy","category":"财务","meanings":["破产"],"examples":[{"en":"The supplier filed for bankruptcy last month, halting all deliveries.","zh":"该供应商上月申请破产，所有交货已中止。"},{"en":"Our contract includes a clause addressing termination in case of bankruptcy.","zh":"我方合同包含破产情形下终止合作的条款。"}]},{"word":"niche","category":"市场","meanings":["利基市场；专门领域；合适位置"],"examples":[{"en":"Our new software targets the healthcare IT niche.","zh":"我们的新软件面向医疗IT这一利基市场。"},{"en":"They dominate the premium pet food niche in North America.","zh":"他们在北美高端宠物食品细分市场占据主导地位。"}]},{"word":"competence","category":"人力","meanings":["胜任力；能力；权限"],"examples":[{"en":"She demonstrated strong technical competence during the project audit.","zh":"她在项目审计中展现了扎实的技术胜任力。"},{"en":"This role requires competence in cross-functional stakeholder management.","zh":"该职位要求具备跨职能干系人管理能力。"}]},{"word":"inspection","category":"项目与运营","meanings":["检验；审查；视察"],"examples":[{"en":"The shipment will not be released until after quality inspection.","zh":"货物须经质量检验合格后方可放行。"},{"en":"A third-party inspection is scheduled for next Tuesday.","zh":"第三方检验定于下周二进行。"}]},{"word":"oversight","category":"战略与沟通","meanings":["监管；疏忽"],"examples":[{"en":"The delay resulted from oversight in vendor communication.","zh":"延误源于供应商沟通中的疏忽。"},{"en":"Oversight of compliance is assigned to the Legal Department.","zh":"合规监管职责由法务部承担。"}]},{"word":"breach","category":"谈判","meanings":["违反（合同/协议）；破坏（信任）"],"examples":[{"en":"Failure to deliver on time constitutes a material breach.","zh":"未能按时交付构成重大违约。"},{"en":"We reserve the right to terminate if there’s a breach of confidentiality.","zh":"若发生保密义务违反，我方保有终止权。"}]},{"word":"brainstorming","category":"会议","meanings":["头脑风暴（集体创意生成活动）"],"examples":[{"en":"Let’s schedule a 45-minute brainstorming session before finalizing the pitch.","zh":"在定稿提案前，我们安排一场45分钟的头脑风暴。"},{"en":"All ideas are welcome during brainstorming—no judgment at this stage.","zh":"头脑风暴期间欢迎所有想法——此阶段不作评判。"}]},{"word":"gratitude","category":"邮件","meanings":["感激；感谢之情"],"examples":[{"en":"We express our sincere gratitude for your prompt feedback.","zh":"衷心感谢您及时的反馈。"},{"en":"Thank you again—your support continues to inspire our team’s gratitude.","zh":"再次感谢——您的支持持续唤起团队的感激之情。"}]},{"word":"collateral","category":"财务","meanings":["抵押品；担保物"],"examples":[{"en":"The loan requires real estate as collateral.","zh":"该贷款要求以房地产作为抵押品。"},{"en":"We’ll assess the value of your equipment before accepting it as collateral.","zh":"在接受设备作为担保物前，我们将评估其价值。"}]},{"word":"targeting","category":"市场","meanings":["精准定位（客户、市场或广告对象）"],"examples":[{"en":"Our new campaign focuses on demographic targeting.","zh":"我们的新活动聚焦于人口统计学定向。"},{"en":"Behavioral targeting improved our ad click-through rate by 22%.","zh":"行为定向使我们的广告点击率提升了22%。"}]},{"word":"skill","category":"人力","meanings":["技能；专长"],"examples":[{"en":"Data analysis is a core skill for this role.","zh":"数据分析是该岗位的核心技能。"},{"en":"We identified three critical skills gaps in the team.","zh":"我们识别出团队中存在三项关键技能缺口。"}]},{"word":"inspect","category":"项目与运营","meanings":["检查；审查（质量、合规性、进度等）"],"examples":[{"en":"The QA team will inspect all units before shipment.","zh":"质保团队将在发货前检查所有产品单元。"},{"en":"Contract terms require the client to inspect the software within five business days.","zh":"合同条款要求客户须在五个工作日内检查软件。"}]},{"word":"transparency","category":"战略与沟通","meanings":["透明度；公开性"],"examples":[{"en":"Investors value financial transparency and timely disclosures.","zh":"投资者重视财务透明度和及时披露。"},{"en":"We committed to greater transparency in our supply chain sourcing.","zh":"我们承诺在供应链采购中提升透明度。"}]},{"word":"termination","category":"谈判","meanings":["终止；解雇；合同终结"],"examples":[{"en":"The agreement includes a 30-day notice period for termination.","zh":"协议规定终止须提前30天通知。"},{"en":"Termination without cause requires severance pay per Section 4.2.","zh":"无因解雇须按第4.2条支付遣散费。"}]},{"word":"summary","category":"会议","meanings":["摘要；概要"],"examples":[{"en":"Please distribute the meeting summary to all attendees by EOD.","zh":"请于今日下班前将会议摘要发送给所有与会者。"},{"en":"Her presentation began with a one-page summary of Q3 results.","zh":"她的演示以一页第三季度成果摘要开场。"}]},{"word":"promptly","category":"邮件","meanings":["迅速地；立即地"],"examples":[{"en":"We will review your proposal and respond promptly.","zh":"我们将审阅您的提案并尽快回复。"},{"en":"Kindly confirm receipt of this email promptly.","zh":"请立即确认已收到本邮件。"}]},{"word":"securities","category":"财务","meanings":["证券；有价证券"],"examples":[{"en":"The fund’s portfolio includes equities, bonds, and other securities.","zh":"该基金的投资组合包括股票、债券及其他证券。"},{"en":"All transactions in securities must comply with SEC regulations.","zh":"所有证券交易均须符合美国证券交易委员会的规定。"}]},{"word":"target","category":"市场","meanings":["目标；指标；对象"],"examples":[{"en":"Our Q4 revenue target is $2.5M, up 10% year-over-year.","zh":"我们第四季度营收目标为250万美元，同比增长10%。"},{"en":"This campaign targets small businesses in the Midwest.","zh":"本次营销活动面向中西部地区的中小企业。"}]},{"word":"talent","category":"人力","meanings":["人才；员工；专业能力"],"examples":[{"en":"Retaining high-potential talent remains a top HR priority this year.","zh":"留住高潜力人才仍是今年人力资源工作的重中之重。"},{"en":"We’re building a global talent pipeline for engineering roles.","zh":"我们正在为工程岗位构建全球人才储备库。"}]},{"word":"inspector","category":"项目与运营","meanings":["检查员；稽查员"],"examples":[{"en":"The project inspector identified three non-compliant welds before sign-off.","zh":"该项目检查员在签署验收前发现了三处不合格焊缝。"},{"en":"All inspectors must carry valid ID badges on site.","zh":"所有检查员在现场必须佩戴有效身份卡。"}]},{"word":"integrity","category":"战略与沟通","meanings":["正直；诚实；完整性"],"examples":[{"en":"Our supplier code of conduct emphasizes integrity in financial reporting.","zh":"我方供应商行为准则强调财务报告中的诚信。"},{"en":"Leadership integrity is non-negotiable in our annual culture survey.","zh":"领导层的正直性在我司年度文化调研中是不可协商的。"}]},{"word":"rescind","category":"谈判","meanings":["撤销；废止（正式决定、协议或命令）"],"examples":[{"en":"The buyer rescinded the letter of intent after due diligence revealed material risks.","zh":"买方在尽职调查发现重大风险后撤回了意向书。"},{"en":"This clause may be rescinded only with mutual written consent.","zh":"本条款仅可在双方书面同意下予以撤销。"}]},{"word":"conclude","category":"会议","meanings":["结束；达成（协议、结论）；推断"],"examples":[{"en":"We concluded the quarterly review meeting with clear action items and owners.","zh":"我们以明确的行动项及负责人结束了季度复盘会议。"},{"en":"The team concluded that the current vendor contract requires renegotiation.","zh":"团队得出结论：现行供应商合同需重新谈判。"}]},{"word":"courtesy","category":"邮件","meanings":["礼貌；谦恭；善意的行为"],"examples":[{"en":"As a courtesy, we’ve attached the revised NDA for your early review.","zh":"为表礼貌，我们随信附上修订后的保密协议供您提前审阅。"},{"en":"Please accept this email as a courtesy notification of the system downtime.","zh":"敬请查收本邮件，作为系统停机的礼貌性通知。"}]},{"word":"dividend","category":"财务","meanings":["股息；红利"],"examples":[{"en":"The board approved a quarterly dividend of $0.75 per share.","zh":"董事会批准了每股0.75美元的季度股息。"},{"en":"Investors closely watch dividend yield when evaluating income stocks.","zh":"投资者评估收益型股票时，会密切关注股息收益率。"}]},{"word":"prospecting","category":"市场","meanings":["潜在客户开发；市场开拓"],"examples":[{"en":"Sales reps spent the morning prospecting for healthcare clients on LinkedIn.","zh":"销售代表上午在领英上寻找医疗行业潜在客户。"},{"en":"Effective prospecting requires both research and personalized outreach.","zh":"高效的潜在客户开发既需要调研，也需要个性化触达。"}]},{"word":"aptitude","category":"人力","meanings":["天赋；资质；胜任力"],"examples":[{"en":"Her aptitude for problem-solving made her a top candidate for the operations role.","zh":"她出色的问题解决能力使她成为运营岗位的首选候选人。"},{"en":"The assessment measures technical aptitude, not just prior experience.","zh":"该测评考察的是技术资质，而不仅限于过往经验。"}]},{"word":"defect","category":"项目与运营","meanings":["缺陷；故障；瑕疵"],"examples":[{"en":"A manufacturing defect caused 12% of units to fail stress testing.","zh":"一处制造缺陷导致12%的产品未能通过压力测试。"},{"en":"All defects must be logged in the QA system before release.","zh":"所有缺陷必须在发布前录入质量保证系统。"}]},{"word":"ethical","category":"战略与沟通","meanings":["合乎道德的；伦理的"],"examples":[{"en":"The company committed to ethical AI use in all customer-facing tools.","zh":"该公司承诺在所有面向客户的工具中合乎道德地使用人工智能。"},{"en":"Stakeholders expect transparent and ethical decision-making from leadership.","zh":"利益相关方期望管理层做出透明且合乎道德的决策。"}]},{"word":"settle","category":"谈判","meanings":["达成协议；解决（争议、债务等）"],"examples":[{"en":"Both parties agreed to settle the payment terms before signing the MOU.","zh":"双方同意在签署谅解备忘录前敲定付款条款。"},{"en":"We aim to settle this pricing disagreement by Friday.","zh":"我们力争在周五前解决这一定价分歧。"}]},{"word":"conclusion","category":"会议","meanings":["结论；结束；达成（协议、交易）"],"examples":[{"en":"The conclusion of today’s workshop is that we’ll pilot the new CRM in Q3.","zh":"今日工作坊的结论是，我们将于第三季度试点新客户关系管理系统。"},{"en":"Please include a brief conclusion in your presentation deck.","zh":"请在演示文稿中加入简要结论页。"}]},{"word":"courteous","category":"邮件","meanings":["礼貌的；谦恭有礼的"],"examples":[{"en":"Her reply was prompt and courteous, which helped maintain goodwill.","zh":"她的回复迅速且礼貌，有助于维系良好关系。"},{"en":"Always remain courteous—even when declining a request.","zh":"即使拒绝请求，也务必保持礼貌。"}]},{"word":"shareholder","category":"财务","meanings":["股东；持有公司股份的个人或机构"],"examples":[{"en":"The CFO presented Q2 results directly to major shareholders.","zh":"首席财务官直接向主要股东汇报了第二季度业绩。"},{"en":"Dividend policy must balance growth needs with shareholder expectations.","zh":"股息政策须兼顾发展需求与股东预期。"}]},{"word":"generation","category":"市场","meanings":["一代人；产生；（数据/内容等）生成"],"examples":[{"en":"Our campaign targets the digital-native generation with short-form video.","zh":"本活动以数字原住民一代为目标受众，采用短视频形式。"},{"en":"Lead generation via LinkedIn has doubled since last quarter.","zh":"通过领英获取销售线索的数量较上季度翻倍。"}]},{"word":"potential","category":"人力","meanings":["潜力；潜在的可能；有发展潜力的人或事物"],"examples":[{"en":"She’s been identified as a high-potential candidate for leadership development.","zh":"她已被认定为领导力发展项目的高潜力候选人。"},{"en":"The role requires someone with strong analytical potential.","zh":"该岗位需要具备出色分析潜力的人选。"}]},{"word":"defective","category":"项目与运营","meanings":["有缺陷的；存在故障的；不合格的"],"examples":[{"en":"All defective units must be quarantined before root-cause analysis.","zh":"所有缺陷品必须在根本原因分析前隔离。"},{"en":"The supplier agreed to replace the defective batch at no cost.","zh":"供应商同意免费更换该批缺陷产品。"}]},{"word":"ethics","category":"战略与沟通","meanings":["道德规范；职业道德；伦理准则"],"examples":[{"en":"Our ethics policy prohibits accepting gifts from vendors over $25.","zh":"我司《道德规范》禁止接受供应商价值超过25美元的礼品。"},{"en":"The board reviewed the latest ethics training completion rates.","zh":"董事会审阅了最新道德培训完成率。"}]},{"word":"resolution","category":"谈判","meanings":["决议；解决；坚定的决心"],"examples":[{"en":"Both parties signed the resolution outlining next steps for dispute settlement.","zh":"双方签署了解决争议后续步骤的决议。"},{"en":"The resolution of this issue depends on mutual concessions.","zh":"该问题的解决取决于双方让步。"}]},{"word":"followup","category":"会议","meanings":["跟进；后续行动；后续沟通"],"examples":[{"en":"Please send the meeting followup by EOD Friday.","zh":"请于本周五下班前发送会议跟进纪要。"},{"en":"Her followup with the client confirmed delivery timing.","zh":"她对客户的后续沟通确认了交货时间。"}]},{"word":"formal","category":"邮件","meanings":["正式的；正规的；拘谨的"],"examples":[{"en":"Please send a formal written confirmation by Friday.","zh":"请于周五前发送一份正式的书面确认。"},{"en":"Our partnership agreement requires formal approval from both legal teams.","zh":"我们的合作协议需双方法务团队正式批准。"}]},{"word":"stockholder","category":"财务","meanings":["股东；股票持有人"],"examples":[{"en":"The annual report will be distributed to all stockholders before the AGM.","zh":"年度报告将在年度股东大会前分发给全体股东。"},{"en":"Stockholder value is a key metric for our board’s performance review.","zh":"股东价值是我们董事会绩效评估的关键指标。"}]},{"word":"funnel","category":"市场","meanings":["漏斗；（营销）流量转化路径；筛选流程"],"examples":[{"en":"We optimized the top of the funnel to increase qualified lead volume.","zh":"我们优化了漏斗顶端，以提升合格线索数量。"},{"en":"Only 12% of leads moved from the middle to the bottom of the funnel last quarter.","zh":"上季度仅有12%的线索从漏斗中部进入底部。"}]},{"word":"capability","category":"人力","meanings":["能力；技能；（组织/系统）功能；性能"],"examples":[{"en":"This role requires strong analytical capability and cross-functional collaboration.","zh":"该职位要求出色的分析能力及跨部门协作能力。"},{"en":"Our AI team has built a new forecasting capability in-house.","zh":"我司AI团队已自主开发了一项新的预测能力。"}]},{"word":"deficiency","category":"项目与运营","meanings":["不足；缺陷；缺乏；（营养/财务）缺乏症"],"examples":[{"en":"The audit identified a critical deficiency in access control procedures.","zh":"审计发现访问控制流程存在一项严重缺陷。"},{"en":"We are addressing the budget deficiency by reallocating Q3 discretionary funds.","zh":"我们正通过重新分配第三季度的弹性预算来弥补资金缺口。"}]},{"word":"ownership","category":"战略与沟通","meanings":["所有权；所有关系；责任感"],"examples":[{"en":"Clear ownership of deliverables is essential for project accountability.","zh":"交付成果的所有权界定清晰，对项目问责制至关重要。"},{"en":"She demonstrated strong ownership by resolving the client issue without escalation.","zh":"她主动解决客户问题而未上报，展现出强烈的责任感。"}]},{"word":"litigation","category":"谈判","meanings":["诉讼；法律诉讼程序"],"examples":[{"en":"The clause limits our liability and aims to avoid litigation.","zh":"该条款限制我方责任，旨在避免诉讼。"},{"en":"Both parties agreed to settle the dispute out of court rather than pursue litigation.","zh":"双方同意庭外和解，而非提起诉讼。"}]},{"word":"adjournment","category":"会议","meanings":["休会；休庭；（会议）暂停"],"examples":[{"en":"The chair announced a 15-minute adjournment for technical setup.","zh":"主持人宣布技术准备期间休会15分钟。"},{"en":"Due to time constraints, the committee voted for adjournment without finalizing the budget.","zh":"受限于时间，委员会投票决定休会，未敲定预算。"}]},{"word":"informal","category":"邮件","meanings":["非正式的；不拘礼节的；非官方的"],"examples":[{"en":"This is an informal follow-up—no action needed unless you spot an issue.","zh":"这是一封非正式跟进邮件——除非发现问题，否则无需操作。"},{"en":"We’ll share the draft informally first, then circulate the formal version next week.","zh":"我们将先非正式地分享初稿，下周再分发正式版本。"}]},{"word":"stock","category":"财务","meanings":["库存；股份；股票；现货"],"examples":[{"en":"Inventory stock declined 12% year-on-year due to supply chain delays.","zh":"受供应链延误影响，库存同比下降12%。"},{"en":"The company’s common stock trades on the NASDAQ under the ticker XYZ.","zh":"该公司普通股在纳斯达克上市，股票代码为XYZ。"}]},{"word":"referral","category":"市场","meanings":["推荐；转介；介绍客户的行为或结果"],"examples":[{"en":"Our highest-converting channel is referral from existing customers.","zh":"我们转化率最高的渠道是现有客户的推荐。"},{"en":"Each successful referral earns the referrer a $50 credit.","zh":"每成功推荐一位新客户，推荐人可获得50美元账户积分。"}]},{"word":"capacity","category":"人力","meanings":["能力；产能；职位承载力；资源上限"],"examples":[{"en":"The engineering team is operating at full capacity this quarter.","zh":"本季度工程团队已满负荷运转。"},{"en":"We’re hiring two project managers to increase delivery capacity.","zh":"我们正招聘两名项目经理以提升交付能力。"}]},{"word":"fault","category":"项目与运营","meanings":["过错；责任；缺陷（尤指系统或流程中的）"],"examples":[{"en":"The root cause analysis showed no single team was at fault.","zh":"根本原因分析显示没有单一团队应承担责任。"},{"en":"A software bug—not human error—was the fault in the data sync failure.","zh":"数据同步失败的症结在于软件漏洞，而非人为失误。"}]},{"word":"disruptive","category":"战略与沟通","meanings":["颠覆性的；打破常规的；造成显著干扰的"],"examples":[{"en":"This AI tool is not just efficient—it’s truly disruptive to legacy workflows.","zh":"这款AI工具不仅高效，更真正颠覆了传统工作流。"},{"en":"Investors favor startups with a clear disruptive value proposition.","zh":"投资者青睐拥有明确颠覆性价值主张的初创企业。"}]},{"word":"jurisdiction","category":"谈判","meanings":["司法管辖权；职权范围；管辖区域"],"examples":[{"en":"The contract specifies that disputes fall under Singaporean jurisdiction.","zh":"合同明确规定争议适用新加坡司法管辖。"},{"en":"Data storage must comply with the jurisdiction where users are based.","zh":"数据存储必须符合用户所在地的司法管辖区要求。"}]},{"word":"convene","category":"会议","meanings":["召集（会议、委员会等）"],"examples":[{"en":"The board will convene at 9 a.m. sharp tomorrow.","zh":"董事会将于明早9点整准时召开。"},{"en":"All regional managers were convened for the Q3 strategy review.","zh":"所有区域经理均被召集参加第三季度战略评审会。"}]},{"word":"concise","category":"邮件","meanings":["简明的，简洁的（尤指语言表达）"],"examples":[{"en":"Please keep your status update concise—no more than three bullet points.","zh":"请保持进度更新简洁——不超过三点要点。"},{"en":"A concise subject line helps ensure your email is opened and acted on quickly.","zh":"简洁的邮件主题有助于确保邮件被及时打开并处理。"}]},{"word":"bond","category":"财务","meanings":["债券；担保；（人与人之间的）纽带"],"examples":[{"en":"The company issued $500 million in senior unsecured bonds last quarter.","zh":"该公司上季度发行了5亿美元高级无抵押债券。"},{"en":"Strong team bonds improve collaboration and reduce turnover risk.","zh":"牢固的团队纽带能提升协作效率，并降低人员流失风险。"}]},{"word":"affiliate","category":"市场","meanings":["附属公司；关联方；使隶属；加入（组织）"],"examples":[{"en":"Our brand has over 200 retail affiliates across North America.","zh":"我司品牌在北美拥有200多家零售合作方。"},{"en":"This startup was recently affiliated with a global marketing consortium.","zh":"这家初创企业近期加入了全球营销联盟。"}]},{"word":"motivation","category":"人力","meanings":["动机；积极性；激励因素"],"examples":[{"en":"Recognition programs are proven to boost employee motivation and retention.","zh":"认可计划已被证实能提升员工积极性和留任率。"},{"en":"During the interview, assess candidates’ motivation for long-term growth in this role.","zh":"面试中应评估候选人对该岗位长期发展的内在动机。"}]},{"word":"faulty","category":"项目与运营","meanings":["有缺陷的；存在故障的"],"examples":[{"en":"The QA team identified three faulty components in the latest batch.","zh":"质量团队在最新一批次中发现了三个有缺陷的部件。"},{"en":"Please do not ship any faulty units — they must be retested first.","zh":"请勿发运任何有缺陷的单元——必须先重新测试。"}]},{"word":"competitiveness","category":"战略与沟通","meanings":["竞争力；保持竞争优势的能力"],"examples":[{"en":"Our pricing strategy directly impacts global competitiveness.","zh":"我们的定价策略直接影响全球竞争力。"},{"en":"The report highlights how digital transformation strengthens competitiveness.","zh":"该报告强调数字化转型如何增强竞争力。"}]},{"word":"comply","category":"谈判","meanings":["遵守（法规、协议、要求等）"],"examples":[{"en":"All suppliers must comply with our new data privacy standards.","zh":"所有供应商必须遵守我们的新数据隐私标准。"},{"en":"We will comply with the terms outlined in Section 4.2.","zh":"我们将遵守第4.2条中列明的条款。"}]},{"word":"punctual","category":"会议","meanings":["准时的；严格守时的"],"examples":[{"en":"Please be punctual for tomorrow’s kick-off meeting — it starts at 9:00 a.m. sharp.","zh":"请准时参加明天的启动会——会议将于上午9点整开始。"},{"en":"Her punctual attendance reinforced team trust in her reliability.","zh":"她一贯准时出席，增强了团队对其可靠性的信任。"}]},{"word":"conciseness","category":"邮件","meanings":["简洁性；言简意赅的特质"],"examples":[{"en":"The client praised the conciseness of your project summary email.","zh":"客户称赞了您项目摘要邮件的简洁性。"},{"en":"We value conciseness — please limit status updates to five lines max.","zh":"我们重视简洁性——请将进度更新控制在五行以内。"}]},{"word":"treasury","category":"财务","meanings":["财务部门；国库；资金管理职能"],"examples":[{"en":"The treasury team renegotiated the credit facility with Bank of America.","zh":"财务部与美国银行重新协商了信贷额度。"},{"en":"Cash flow forecasting is a core responsibility of treasury.","zh":"现金流预测是财务部门的核心职责。"}]},{"word":"sponsorship","category":"市场","meanings":["赞助；赞助关系；赞助权益"],"examples":[{"en":"Our sponsorship of the Tech Summit includes logo placement and speaking slots.","zh":"我方对科技峰会的赞助包含标识露出和演讲席位。"},{"en":"Sponsorship ROI is measured by lead generation and social reach.","zh":"赞助投资回报率通过销售线索量和社交媒体触达量衡量。"}]},{"word":"motivate","category":"人力","meanings":["激励；促使；激发（积极性或行动）"],"examples":[{"en":"Managers use recognition programs to motivate high performers.","zh":"管理者通过认可计划激励高绩效员工。"},{"en":"Clear career paths help motivate staff to pursue internal promotions.","zh":"清晰的职业发展路径有助于激励员工争取内部晋升。"}]},{"word":"malfunction","category":"项目与运营","meanings":["故障；失灵；运行异常"],"examples":[{"en":"The ERP system malfunction delayed order processing for two hours.","zh":"ERP系统故障导致订单处理延迟两小时。"},{"en":"If the sensor malfunctions, the dashboard displays an alert automatically.","zh":"若传感器发生故障，仪表盘将自动显示警告。"}]},{"word":"alliance","category":"战略与沟通","meanings":["联盟；战略合作关系；联合体"],"examples":[{"en":"The cloud alliance with Azure enables joint solution development.","zh":"与Azure的云联盟支持双方联合解决方案开发。"},{"en":"Alliances require clear governance terms to avoid scope creep.","zh":"联盟需明确治理条款，以防范围蔓延。"}]},{"word":"obligation","category":"谈判","meanings":["义务；合同责任；法律约束"],"examples":[{"en":"Both parties must clarify their contractual obligations before signing.","zh":"双方须在签约前明确各自的合同义务。"},{"en":"This clause does not create any additional financial obligation for the buyer.","zh":"本条款不为买方增设任何额外财务义务。"}]},{"word":"punctuality","category":"会议","meanings":["守时；准时"],"examples":[{"en":"Punctuality is expected for all virtual team meetings.","zh":"所有线上团队会议均要求准时出席。"},{"en":"Her consistent punctuality has strengthened her reputation as a reliable project lead.","zh":"她一贯守时，巩固了其作为可靠项目负责人的声誉。"}]},{"word":"relevant","category":"邮件","meanings":["相关的；切题的"],"examples":[{"en":"Please keep your reply focused and relevant to the Q2 budget proposal.","zh":"请确保回复紧扣第二季度预算提案。"},{"en":"Only attach documents that are directly relevant to this inquiry.","zh":"仅附与此咨询直接相关的文件。"}]},{"word":"yield","category":"财务","meanings":["收益率；年化回报率"],"examples":[{"en":"The 10-year Treasury note currently offers a yield of 4.2%.","zh":"十年期国债目前提供4.2%的收益率。"},{"en":"Equity funds typically generate higher long-term yields than savings accounts.","zh":"股票型基金的长期收益率通常高于储蓄账户。"}]},{"word":"sponsor","category":"市场","meanings":["赞助商；出资支持方"],"examples":[{"en":"TechCorp is the title sponsor of this year’s Innovation Summit.","zh":"科技公司是今年创新峰会的冠名赞助商。"},{"en":"Each sponsor receives branded signage and three speaking slots.","zh":"每位赞助商获配品牌标识展板及三次发言机会。"}]},{"word":"incentivize","category":"人力","meanings":["激励；促使（某人采取某种行动）"],"examples":[{"en":"We incentivize top performers with stock options.","zh":"我们用股票期权激励表现优异的员工。"},{"en":"The new policy incentivizes remote work to reduce overhead.","zh":"新政策鼓励远程办公以降低运营成本。"}]},{"word":"maintenance","category":"项目与运营","meanings":["维护；保养；持续支持"],"examples":[{"en":"Scheduled maintenance will occur this Saturday night.","zh":"计划内维护将于本周六晚间进行。"},{"en":"The vendor is responsible for software maintenance and updates.","zh":"供应商负责软件的维护与更新。"}]},{"word":"consolidation","category":"战略与沟通","meanings":["整合；合并；巩固"],"examples":[{"en":"The consolidation of regional offices reduced administrative costs by 18%.","zh":"区域办公室的整合使行政成本降低了18%。"},{"en":"Financial consolidation must comply with GAAP reporting standards.","zh":"财务合并必须符合公认会计准则的报告要求。"}]},{"word":"negotiation","category":"谈判","meanings":["谈判；协商"],"examples":[{"en":"Both parties entered negotiation in good faith.","zh":"双方本着善意进入谈判。"},{"en":"Salary negotiation typically follows the final interview round.","zh":"薪资谈判通常在终面之后进行。"}]},{"word":"interruption","category":"会议","meanings":["中断；打扰；暂停"],"examples":[{"en":"Please mute your mic to avoid audio interruption.","zh":"请关闭麦克风以避免音频中断。"},{"en":"The meeting resumed after a two-minute interruption.","zh":"会议在两分钟中断后继续进行。"}]},{"word":"relevance","category":"邮件","meanings":["相关性；切题性"],"examples":[{"en":"Please clarify the relevance of this data to our Q3 budget review.","zh":"请说明此数据与我们第三季度预算审核的相关性。"},{"en":"The relevance of your proposal was highlighted in yesterday’s meeting.","zh":"您提案的相关性在昨日会议中被重点提及。"}]},{"word":"principal","category":"财务","meanings":["委托人；资金本金；主要负责人"],"examples":[{"en":"The loan agreement specifies repayment of principal before interest.","zh":"贷款协议规定先偿还本金，再支付利息。"},{"en":"Our firm acts as principal in this transaction, not as an agent.","zh":"我方在此交易中作为委托人，而非代理人。"}]},{"word":"endorse","category":"市场","meanings":["背书；公开支持；签署（支票）"],"examples":[{"en":"A Fortune 500 CEO endorsed our sustainability report on LinkedIn.","zh":"一位《财富》500强企业CEO在领英上公开支持了我们的可持续发展报告。"},{"en":"The influencer will endorse the new skincare line starting next month.","zh":"该网红将从下月起推广这款新护肤系列产品。"}]},{"word":"wage","category":"人力","meanings":["工资（尤指按小时/日计）；开展（斗争）"],"examples":[{"en":"We adjusted the hourly wage to meet state minimum requirements.","zh":"我们已调整小时工资，以满足州最低工资要求。"},{"en":"Wage transparency is now required in all job postings.","zh":"所有职位招聘启事现须注明薪资范围。"}]},{"word":"maintain","category":"项目与运营","meanings":["维持；保养；坚持（主张）"],"examples":[{"en":"Our team maintains the CRM platform to ensure 99.9% uptime.","zh":"我团队负责维护CRM平台，确保99.9%正常运行时间。"},{"en":"She has maintained the same vendor relationship for eight years.","zh":"她已维持同一供应商关系达八年之久。"}]},{"word":"consolidate","category":"战略与沟通","meanings":["（使）合并；（使）统一；巩固"],"examples":[{"en":"The company will consolidate its three regional offices into one hub by Q3.","zh":"该公司将于第三季度前将其三个区域办事处合并为一个中心。"},{"en":"Our market position has been consolidated after the acquisition.","zh":"收购完成后，我们的市场地位得到巩固。"}]},{"word":"negotiable","category":"谈判","meanings":["可协商的；可谈判的"],"examples":[{"en":"The delivery date is negotiable, depending on your production schedule.","zh":"交货日期可协商，视贵方生产计划而定。"},{"en":"All pricing terms in this proposal are negotiable except the licensing fee.","zh":"本方案中所有定价条款均可协商，许可费除外。"}]},{"word":"interrupt","category":"会议","meanings":["打断；中断（会议、流程、通信）"],"examples":[{"en":"Please don’t interrupt while the CFO is presenting the Q2 forecast.","zh":"请勿在首席财务官汇报二季度预测时打断。"},{"en":"The system upgrade interrupted our video conference for eight minutes.","zh":"系统升级导致我们的视频会议中断了八分钟。"}]},{"word":"reference","category":"邮件","meanings":["参考；参照；推荐信；引文"],"examples":[{"en":"For your reference, I’ve attached the signed NDA and the latest version of the SOW.","zh":"供您参考，我已附上已签署的保密协议及最新版工作说明书。"},{"en":"Could you provide two professional references for the vendor evaluation?","zh":"您能为供应商评估提供两封职业推荐信吗？"}]},{"word":"capital","category":"财务","meanings":["资本；资金；本金；（大写）"],"examples":[{"en":"We need $2 million in working capital to scale operations next year.","zh":"我们明年扩大运营需200万美元的营运资金。"},{"en":"The startup raised additional capital from Series B investors.","zh":"该初创公司从B轮融资投资者处募集了额外资本。"}]},{"word":"influencer","category":"市场","meanings":["有影响力的人；常指在社交媒体上能影响受众消费决策的个体"],"examples":[{"en":"We partnered with a fitness influencer to launch our new protein bar.","zh":"我们携手一位健身领域网红推出新款蛋白棒。"},{"en":"The campaign’s success depended heavily on the influencer’s authentic engagement.","zh":"该活动的成功很大程度上取决于这位网红的真实互动。"}]},{"word":"payroll","category":"人力","meanings":["工资单；员工薪资总额；也指人力资源部门中负责薪资发放的职能"],"examples":[{"en":"The payroll department must finalize payments before Friday.","zh":"薪资部门必须在周五前完成付款。"},{"en":"Outsourcing payroll reduced our administrative overhead by 20%.","zh":"外包薪资业务使我们的行政开支降低了20%。"}]},{"word":"repair","category":"项目与运营","meanings":["维修；修复；指恢复设备、系统或流程的正常功能"],"examples":[{"en":"The server outage required urgent repair to avoid data loss.","zh":"服务器宕机需紧急维修，以防数据丢失。"},{"en":"Contractors will handle all structural repairs before the facility reopens.","zh":"承包商将在设施重新开放前完成所有结构维修。"}]},{"word":"restructure","category":"战略与沟通","meanings":["重组；对公司架构、部门职能或业务流程进行系统性调整"],"examples":[{"en":"Leadership decided to restructure the sales division to improve regional responsiveness.","zh":"管理层决定重组销售部门，以提升区域响应能力。"},{"en":"The company was restructured to separate its consumer and enterprise units.","zh":"该公司进行了重组，将消费者业务与企业业务分设。"}]},{"word":"nonnegotiable","category":"谈判","meanings":["不可协商的；指条款、条件或要求不得修改或让步"],"examples":[{"en":"Delivery date is nonnegotiable due to the client’s regulatory deadline.","zh":"交付日期不可协商，因客户有监管截止期限。"},{"en":"Confidentiality terms in the NDA are strictly nonnegotiable.","zh":"保密协议中的保密条款严格不可协商。"}]},{"word":"intervention","category":"会议","meanings":["干预；介入（尤指为解决问题或防止恶化）"],"examples":[{"en":"The project manager requested an immediate intervention from the steering committee.","zh":"项目经理请求指导委员会立即介入。"},{"en":"Early intervention is critical to avoid scope creep in agile sprints.","zh":"及早干预对避免敏捷冲刺中的范围蔓延至关重要。"}]},{"word":"refer","category":"邮件","meanings":["提交（给某人/某部门处理）；参阅；提及"],"examples":[{"en":"Please refer all billing inquiries to accounts@company.com.","zh":"请将所有账单咨询发送至accounts@company.com。"},{"en":"This request has been referred to the compliance team for review.","zh":"此项请求已转交合规团队审核。"}]},{"word":"capitalization","category":"财务","meanings":["资本化；（公司）总市值；大写（格式）"],"examples":[{"en":"R&D costs are capitalized only when technical feasibility is demonstrated.","zh":"研发费用仅在技术可行性得到证实后方可资本化。"},{"en":"The company’s market capitalization fell below $1 billion after the earnings miss.","zh":"财报不及预期后，该公司市值跌破10亿美元。"}]},{"word":"visibility","category":"市场","meanings":["可见度；曝光度；（数据/流程）可追溯性"],"examples":[{"en":"Our Q3 campaign improved brand visibility among Gen Z by 42%.","zh":"我司第三季度活动使Z世代群体中的品牌曝光度提升了42%。"},{"en":"Real-time dashboards provide greater visibility into supply chain delays.","zh":"实时仪表板提升了对供应链延误的可追溯性。"}]},{"word":"pension","category":"人力","meanings":["养老金；退休金计划"],"examples":[{"en":"Employees contribute 5% of salary to the defined-contribution pension plan.","zh":"员工按工资5%向固定缴款型养老金计划供款。"},{"en":"The new pension policy takes effect on January 1, 2025.","zh":"新养老金政策将于2025年1月1日生效。"}]},{"word":"replace","category":"项目与运营","meanings":["替换；取代；更换（人员、设备、流程等）"],"examples":[{"en":"We’ll replace the outdated server next Tuesday to minimize downtime.","zh":"我们将于下周二更换过时的服务器，以最大限度减少停机时间。"},{"en":"The project manager was replaced after missing two key deadlines.","zh":"项目经理因连续错过两个关键截止日期而被替换。"}]},{"word":"restructuring","category":"战略与沟通","meanings":["重组；机构或业务结构的调整"],"examples":[{"en":"The restructuring of the sales division will be announced at the town hall.","zh":"销售部门的重组方案将在全员大会上公布。"},{"en":"Cost savings from restructuring are expected to exceed $2 million annually.","zh":"重组带来的成本节约预计每年将超过200万美元。"}]},{"word":"mutually","category":"谈判","meanings":["相互地；彼此地"],"examples":[{"en":"Both parties agreed to keep all negotiation details mutually confidential.","zh":"双方同意对所有谈判细节承担相互保密义务。"},{"en":"The NDA ensures that sensitive information is shared only on a mutually agreed basis.","zh":"保密协议确保敏感信息仅在双方共同同意的基础上共享。"}]},{"word":"question","category":"会议","meanings":["疑问；问题；质疑（某事的真实性或合理性）"],"examples":[{"en":"Please hold your questions until the end of the presentation.","zh":"请将问题留到演示结束时再提出。"},{"en":"Several stakeholders questioned the ROI projection in the business case.","zh":"多位利益相关方对该商业案例中的投资回报率预测提出了质疑。"}]},{"word":"quotation","category":"邮件","meanings":["报价单；报盘；引述"],"examples":[{"en":"Attached is our formal quotation for the software license renewal.","zh":"附件为我方关于软件许可续订的正式报价单。"},{"en":"Please confirm if you’d like us to revise the quotation based on your feedback.","zh":"请确认是否需要我们根据您的反馈修订该报价单。"}]},{"word":"funding","category":"财务","meanings":["资金；融资"],"examples":[{"en":"Securing early-stage funding is critical for startup survival.","zh":"获得早期融资对初创企业的存续至关重要。"},{"en":"The board approved additional funding for the R&D initiative.","zh":"董事会批准为研发项目追加资金。"}]},{"word":"exposure","category":"市场","meanings":["风险暴露；市场曝光度"],"examples":[{"en":"This campaign increased our brand exposure among Gen Z consumers.","zh":"本次营销活动提升了我们的品牌在Z世代消费者中的曝光度。"},{"en":"The company reduced its foreign exchange exposure by hedging.","zh":"该公司通过套期保值降低了外汇风险暴露。"}]},{"word":"retirement","category":"人力","meanings":["退休；（债券等）到期兑付"],"examples":[{"en":"Eligibility for the company’s retirement match begins after one year of service.","zh":"员工入职满一年后，方可享受公司提供的退休金匹配计划。"},{"en":"She announced her retirement effective next March.","zh":"她宣布将于明年3月正式退休。"}]},{"word":"replacement","category":"项目与运营","meanings":["替换；替代品；替补人员"],"examples":[{"en":"The server failure triggered an immediate hardware replacement.","zh":"服务器故障触发了硬件的即时更换。"},{"en":"We’re interviewing candidates for the marketing director replacement.","zh":"我们正在面试市场营销总监职位的继任人选。"}]},{"word":"reorganization","category":"战略与沟通","meanings":["重组；机构调整"],"examples":[{"en":"The reorganization aims to streamline decision-making across regions.","zh":"此次重组旨在简化各区域的决策流程。"},{"en":"Employees received written notice of the upcoming reorganization two weeks in advance.","zh":"员工提前两周收到了关于即将开展重组的书面通知。"}]},{"word":"reciprocal","category":"谈判","meanings":["相互的；互惠的"],"examples":[{"en":"Both parties agreed to reciprocal access to each other's distribution networks.","zh":"双方同意相互开放各自分销网络。"},{"en":"The tariff reduction is reciprocal: if Country A lowers duties, Country B does the same.","zh":"关税削减是互惠的：若A国降低关税，B国亦然。"}]},{"word":"query","category":"会议","meanings":["疑问；质询；查询请求"],"examples":[{"en":"Please raise any query about the timeline during the Q&A session.","zh":"请在问答环节就时间表提出任何疑问。"},{"en":"We logged three queries from the finance team regarding budget allocation.","zh":"我们记录了财务团队关于预算分配的三个查询。"}]},{"word":"quote","category":"邮件","meanings":["报价；引述"],"examples":[{"en":"We’ll send you a formal quote by end of day tomorrow.","zh":"我们将于明日下午前向您发送正式报价。"},{"en":"Could you please quote the unit price for 500 units?","zh":"请您报一下500件的单价？"}]},{"word":"fund","category":"财务","meanings":["资金；基金；资助"],"examples":[{"en":"The R&D initiative will be funded from the innovation reserve fund.","zh":"该研发计划将从创新储备基金中拨款。"},{"en":"We need to fund the pilot program before scaling up.","zh":"我们必须先为试点项目提供资金，再扩大规模。"}]},{"word":"churn","category":"市场","meanings":["客户流失率；人员流动率"],"examples":[{"en":"Our monthly churn rate dropped to 1.2%, below the industry benchmark.","zh":"我司月度客户流失率降至1.2%，低于行业基准。"},{"en":"Sales team churn has increased, prompting a review of onboarding support.","zh":"销售团队人员流动率上升，促使我们重新评估入职支持措施。"}]},{"word":"retire","category":"人力","meanings":["退休；使（设备、系统等）停用；退出（某职位或角色）"],"examples":[{"en":"She will retire from the finance department next March.","zh":"她将于明年三月从财务部退休。"},{"en":"The company plans to retire the legacy ERP system by Q4.","zh":"公司计划在第四季度停用旧版ERP系统。"}]},{"word":"installation","category":"项目与运营","meanings":["安装；安装过程；已安装的设备或系统；（军事/机构）驻地"],"examples":[{"en":"The software installation took two days due to network configuration issues.","zh":"由于网络配置问题，软件安装耗时两天。"},{"en":"Our team managed the on-site installation of the new HVAC units.","zh":"我方团队负责新暖通空调机组的现场安装。"}]},{"word":"divestment","category":"战略与沟通","meanings":["剥离（资产、业务或股权）；撤资"],"examples":[{"en":"The divestment of the non-core division aligns with our long-term portfolio strategy.","zh":"剥离非核心业务部门符合我们的长期投资组合战略。"},{"en":"Regulatory approval is pending for the planned divestment.","zh":"拟议剥离事项尚待监管批准。"}]},{"word":"equitable","category":"谈判","meanings":["公平的；公正的（强调实质公平而非形式平等）"],"examples":[{"en":"Both parties agreed to an equitable allocation of R&D costs.","zh":"双方同意按公平原则分摊研发成本。"},{"en":"The settlement terms must be equitable, not merely equal.","zh":"和解条款须体现公平性，而非简单均等。"}]},{"word":"response","category":"会议","meanings":["回应；答复；反应（尤指对请求、问题或情况）"],"examples":[{"en":"Please provide your written response to the proposal by Friday.","zh":"请于周五前提交您对该提案的书面答复。"},{"en":"The CEO’s response to the investor’s question clarified the timeline.","zh":"首席执行官对投资者提问的回应明确了时间表。"}]},{"word":"invitation","category":"邮件","meanings":["邀请；请柬；引诱"],"examples":[{"en":"Please confirm your attendance by replying to this invitation.","zh":"请通过回复本邀请函确认您的出席。"},{"en":"We’ve sent formal invitations to all key stakeholders for the Q3 strategy review.","zh":"我们已向所有关键利益相关方发送了第三季度战略评审的正式邀请函。"}]},{"word":"financing","category":"财务","meanings":["融资；资金筹措"],"examples":[{"en":"The project’s success depends heavily on securing external financing.","zh":"该项目的成功在很大程度上取决于获得外部融资。"},{"en":"We’re evaluating financing options for the new manufacturing line.","zh":"我们正在评估新生产线的融资方案。"}]},{"word":"distribution","category":"市场","meanings":["分销；分配；分布"],"examples":[{"en":"Our distribution network covers over 80% of Tier-2 cities in the region.","zh":"我们的分销网络覆盖该地区超80%的二线城市。"},{"en":"Improving product distribution is a top priority for next fiscal year.","zh":"提升产品分销效率是下财年的首要任务。"}]},{"word":"insurance","category":"人力","meanings":["保险；保障"],"examples":[{"en":"All full-time employees are enrolled in the company’s group health insurance plan.","zh":"所有全职员工均已加入公司团体健康保险计划。"},{"en":"The offer letter outlines salary, bonus structure, and insurance benefits.","zh":"录用通知书列明了薪资、奖金结构及保险福利。"}]},{"word":"install","category":"项目与运营","meanings":["安装；部署；使就职"],"examples":[{"en":"The vendor will install the new CRM software during the weekend maintenance window.","zh":"供应商将在周末维护窗口期安装新客户关系管理软件。"},{"en":"Before we install the updated safety protocol, all team leads must complete training.","zh":"在实施更新后的安全规程前，所有团队负责人须完成培训。"}]},{"word":"divest","category":"战略与沟通","meanings":["剥离（资产、业务或股份）"],"examples":[{"en":"The company plans to divest its underperforming retail division by Q3.","zh":"该公司计划在第三季度前剥离其业绩不佳的零售事业部。"},{"en":"Regulatory pressure forced the firm to be divested of its telecom assets.","zh":"监管压力迫使该公司剥离其电信资产。"}]},{"word":"fairness","category":"谈判","meanings":["公平性；公正性"],"examples":[{"en":"Both parties emphasized fairness in the royalty rate calculation.","zh":"双方均强调特许权使用费率计算的公平性。"},{"en":"The mediator ensured fairness throughout the negotiation process.","zh":"调解员确保了整个谈判过程的公正性。"}]},{"word":"alignment","category":"会议","meanings":["一致；协同；对齐"],"examples":[{"en":"Today’s session focuses on alignment across sales and marketing KPIs.","zh":"今日会议聚焦销售与市场关键绩效指标的一致性。"},{"en":"We need full alignment on the timeline before finalizing the budget.","zh":"在敲定预算前，我们必须就时间表达成完全一致。"}]},{"word":"invite","category":"邮件","meanings":["邀请；招致（尤指负面结果）"],"examples":[{"en":"We invite you to review the draft proposal and share feedback by Friday.","zh":"诚邀您审阅提案初稿，并于周五前反馈意见。"},{"en":"You are invited to join the QBR meeting scheduled for next Tuesday.","zh":"诚邀您参加定于下周二举行的季度业务回顾会议。"}]},{"word":"refinance","category":"财务","meanings":["再融资；重新安排贷款"],"examples":[{"en":"The firm will refinance $200M in senior debt at a lower fixed rate.","zh":"该公司将以更低的固定利率对2亿美元优先债务进行再融资。"},{"en":"Ongoing refinancing efforts aim to extend maturities and reduce interest costs.","zh":"当前的再融资工作旨在延长到期期限并降低利息成本。"}]},{"word":"distributor","category":"市场","meanings":["分销商；经销商"],"examples":[{"en":"Our new distributor in Mexico will handle logistics and after-sales support.","zh":"我们在墨西哥的新分销商将负责物流及售后服务。"},{"en":"We’re evaluating three potential distributors for the Southeast Asia market.","zh":"我们正在评估三家东南亚市场的潜在分销商。"}]},{"word":"allowance","category":"人力","meanings":["津贴；补贴；允许额度"],"examples":[{"en":"The relocation allowance covers temporary housing for up to six weeks.","zh":"搬迁津贴涵盖最长六周的临时住宿费用。"},{"en":"Employees receive a monthly transportation allowance based on job level.","zh":"员工按职级领取月度交通补贴。"}]},{"word":"implementation","category":"项目与运营","meanings":["实施；执行；落实"],"examples":[{"en":"The implementation of the new CRM system begins next Monday.","zh":"新客户关系管理系统将于下周一启动实施。"},{"en":"Delayed implementation affected Q3 sales training rollout.","zh":"实施延迟影响了第三季度销售培训的开展。"}]},{"word":"globalization","category":"战略与沟通","meanings":["全球化"],"examples":[{"en":"Globalization has increased demand for multilingual customer service teams.","zh":"全球化提升了对多语种客服团队的需求。"},{"en":"Our strategy addresses risks associated with rapid globalization.","zh":"我们的战略应对快速全球化带来的相关风险。"}]},{"word":"flexibility","category":"谈判","meanings":["灵活性；弹性"],"examples":[{"en":"We value flexibility in delivery schedules during peak season.","zh":"我们在旺季重视交货时间安排的灵活性。"},{"en":"The supplier showed flexibility by accepting partial payments.","zh":"该供应商通过接受分期付款展现了灵活性。"}]},{"word":"synchronize","category":"会议","meanings":["使同步；使协调一致"],"examples":[{"en":"Please synchronize your calendar with the project timeline before Friday.","zh":"请在周五前将您的日历与项目时间表同步。"},{"en":"All regional sales reports must be synchronized by 9 a.m. EST.","zh":"所有区域销售报告须于美国东部时间上午9点前完成同步。"}]},{"word":"RSVP","category":"邮件","meanings":["请回复（法语 répondez s’il vous plaît 的缩写）"],"examples":[{"en":"Kindly RSVP to the kickoff meeting invitation by Wednesday.","zh":"请于周三前回复本次启动会邀请函。"},{"en":"RSVP is required for catering purposes.","zh":"为便于安排餐饮，请务必回复。"}]},{"word":"loan","category":"财务","meanings":["贷款；借出的款项"],"examples":[{"en":"The company applied for a short-term loan to cover Q3 payroll.","zh":"该公司申请了一笔短期贷款以支付第三季度薪资。"},{"en":"Interest on the loan is calculated monthly.","zh":"该贷款利息按月计算。"}]},{"word":"wholesaler","category":"市场","meanings":["批发商；向零售商批量供货的企业"],"examples":[{"en":"We partnered with a national wholesaler to expand distribution in the Midwest.","zh":"我们已与一家全国性批发商合作，以拓展中西部地区的分销渠道。"},{"en":"The wholesaler offers volume discounts on orders over $50,000.","zh":"该批发商对超过5万美元的订单提供批量折扣。"}]},{"word":"bonus","category":"人力","meanings":["奖金；额外奖励"],"examples":[{"en":"Sales representatives earn a quarterly bonus based on target achievement.","zh":"销售代表根据目标达成情况获得季度奖金。"},{"en":"The sign-on bonus is paid after 60 days of employment.","zh":"签约奖金将于入职满60天后发放。"}]},{"word":"execution","category":"项目与运营","meanings":["执行；实施；完成"],"examples":[{"en":"The execution of the Q3 marketing plan is on schedule.","zh":"第三季度营销计划的执行进度正常。"},{"en":"Poor execution led to a 15% delay in product launch.","zh":"执行不力导致产品上市推迟了15%。"}]},{"word":"internationalization","category":"战略与沟通","meanings":["国际化；使具备国际适应性"],"examples":[{"en":"Our platform’s internationalization includes right-to-left language support.","zh":"我们平台的国际化包括对从右向左书写的语言支持。"},{"en":"Internationalization must precede localization in global rollout.","zh":"在全球推广中，国际化必须先于本地化。"}]},{"word":"tolerance","category":"谈判","meanings":["容忍度；承受限度；公差（工程）"],"examples":[{"en":"The buyer has low tolerance for payment delays beyond 30 days.","zh":"买方对超过30天的付款延迟容忍度很低。"},{"en":"We discussed tolerance for scope changes during the kickoff call.","zh":"我们在启动会上讨论了对范围变更的容忍度。"}]},{"word":"coordination","category":"会议","meanings":["协调；协作；配合"],"examples":[{"en":"Effective coordination among teams ensured the meeting ended on time.","zh":"团队间高效协调确保会议准时结束。"},{"en":"Please confirm your availability to support coordination for next week’s workshop.","zh":"请确认您是否可协助安排下周研讨会的相关协调工作。"}]},{"word":"subscribe","category":"邮件","meanings":["订阅；注册（服务）；同意（观点）"],"examples":[{"en":"You can subscribe to our newsletter with one click.","zh":"您可一键订阅我们的电子简报。"},{"en":"All new hires must subscribe to the internal policy alerts.","zh":"所有新员工须订阅内部政策提醒邮件。"}]},{"word":"mortgage","category":"财务","meanings":["抵押贷款；房屋按揭"],"examples":[{"en":"The company secured a 15-year mortgage to finance its new warehouse.","zh":"该公司获得一笔15年期抵押贷款，用于融资新建仓库。"},{"en":"Monthly mortgage payments are recorded as long-term debt service in the cash flow statement.","zh":"月度抵押贷款还款记入现金流量表中的长期债务偿付项。"}]},{"word":"retailer","category":"市场","meanings":["零售商；零售企业"],"examples":[{"en":"This retailer expanded into three new markets last quarter.","zh":"这家零售商上季度进入了三个新市场。"},{"en":"Retailers often negotiate promotional allowances with brand owners.","zh":"零售商常与品牌方协商促销费用补贴。"}]},{"word":"commission","category":"人力","meanings":["佣金；提成；委员会"],"examples":[{"en":"Sales representat

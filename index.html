function streak(){let k=dayKey(),n=0;if(!db.logs[k]?.checked)k=previousDay(k);while(db.logs[k]?.checked){n++;k=previousDay(k)}return n}
function totals(){return Object.values(db.logs).reduce((a,l)=>({xp:a.xp+(l.xp||0),attempts:a.attempts+(l.attempts||0),correct:a.correct+(l.correct||0),practices:a.practices+(l.practices||0)}),{xp:0,attempts:0,correct:0,practices:0})}

function renderDetail(){let w=current();if(!w){go('library');return}let split=w.kind==='sentence'?splitEnglish(w.word):null;$('main').innerHTML=`<button class="back" onclick="go('${origin}')">← 返回${({today:'今日',library:'词库',add:'录入',review:'复习',progress:'成长'})[origin]||'词库'}</button><section class="card"><div class="row between"><span class="badge">${esc(w.category||'未分类')} · ${({word:'单词',phrase:'词组',sentence:'句子'})[w.kind]}</span>${status(w)}</div><h1 class="detail-word ${w.kind==='sentence'?'sentence':''}" style="margin-top:21px">${esc(w.word)}</h1><p class="phonetic">${esc(w.phonetic||'音标尚未生成')} <span class="tiny">${esc(w.pos||'')}</span></p><p class="meaning">${esc(w.meanings.join('；')||'等待自动生成中文释义')}</p><div class="row"><button class="primary" onclick="speak(current().word)">▷ 播放原音</button><button class="secondary" onclick="shadow()">↻ 跟读模式</button><button class="plain" onclick="wordChat()">ChatGPT 口语</button></div><label for="speed">语速 <span id="speedText">${db.settings.speed}×</span></label><input id="speed" type="range" min="0.5" max="1.2" step="0.05" value="${db.settings.speed}" oninput="db.settings.speed=+this.value;$('speedText').textContent=this.value+'×';save()"><p class="tiny" id="speakState" aria-live="polite">跟读：原音播放结束 → 停顿 2 秒 → 开口复述。发音采用设备英语语音。</p><div class="steps"><b>① 听与理解</b> → ② 跟读 → ③ 造句 → ④ 测试 → 自动排期</div></section><div class="detail-grid"><section class="card"><h3>自然拼读 · 找到声音的节奏</h3>${w.syllables?`<div class="syllables">${esc(w.syllables).split('·').map(x=>`<span>${x}</span>`).join('')}</div>`:`<p class="sub">${w.kind==='word'?'暂无可靠的音节拆分，点击生成学习资料。':'先整体听，再按意群停顿；点击下面的词组或单词继续学。'}</p>`}${w.phonicsNote?`<p class="hint">${esc(w.phonicsNote)}</p>`:''}<p class="tiny" style="margin-top:12px">音节拼写用于辅助阅读，实际声音以音标与原音为准。开/闭音节、元音组合等规则不能覆盖所有例外。</p><a class="tiny" href="https://www.readingrockets.org/topics/spelling-and-word-study/articles/six-syllable-types" target="_blank" rel="noopener">阅读六类音节规则 ↗</a></section><section class="card"><h3>跟读 · 录下你的进步</h3><p class="sub">先听一遍，再录一句；交替播放，比较重音与停顿。</p><div class="row" style="margin-top:17px"><button id="recordBtn" class="secondary" onclick="toggleRecord()">● 开始录音</button><button class="plain" onclick="speak(current().word)">原音对比</button></div><div id="recordArea">${recordUrl&&recordForId===w.id?`<audio controls src="${esc(recordUrl)}"></audio>`:''}</div><p class="tiny" style="margin-top:10px">录音仅留在当前页面，未上传；离开页面会清除。需要麦克风权限与 HTTPS / localhost。</p></section>${w.root?`<section class="card wide"><h3>词根词缀 · 看见构词规律</h3><p style="margin-top:12px">${esc(w.root)}</p>${w.family?`<div class="pills">${w.family.split(/\s*\/\s*/).map(x=>`<button class="pill" onclick="learnText(this.textContent)">${esc(x)}</button>`).join('')}</div>`:''}<a class="tiny" href="https://www.etymonline.com/word/${encodeURIComponent(w.word)}" target="_blank" rel="noopener">核对词源与构词资料 ↗</a><p class="tiny">构词分析不同于完整历史词源；只展示明确的词族与词缀关系。</p></section>`:''}<section class="card"><h3>联想记忆 · 让词有一个画面</h3><p style="margin-top:13px">${esc(w.mnemonic||'等待生成个性化联想。')}</p>${w.scene?`<div class="island"><div class="eyebrow">PICTURE THIS</div>${esc(w.scene)}</div>`:''}</section><section class="card"><h3>商务语法 · 用得自然</h3><p style="margin-top:13px">${esc(w.grammar||'暂无语法提示，请生成学习资料或从 ChatGPT 导入。')}</p></section><section class="card wide"><h3>把它放进真实对话</h3>${w.examples.length?w.examples.map((e,i)=>`<div class="example"><p class="en">${esc(e.en)}</p><p class="zh">${esc(e.zh)}</p><button class="pill" onclick="speak(current().examples[${i}].en)">▷ 例句发音</button></div>`).join(''):'<p class="sub">例句尚未生成。</p>'}</section>${split?`<section class="card wide"><h3>继续拆开这句话</h3><p class="sub">意群在前，单词在后。点击进入对应卡片。</p>${splitBlocks(split,false)}</section>`:''}<section class="card wide"><h3>轮到你了 · 商务造句</h3><p class="sub">用 ${esc(w.word)} 写一句工作中会用到的话。</p><textarea id="practice" placeholder="例如：We need to negotiate a better price.">${esc(w.practiceDraft||'')}</textarea><div class="row" style="margin-top:12px"><button class="primary" id="correctBtn" onclick="correctSentence()">AI 批改</button><button class="secondary" onclick="correctionChat()">复制到自己的 ChatGPT</button><button class="plain" onclick="showCorrectionImport()">粘贴批改 JSON</button></div><div id="feedback" style="margin-top:14px">${feedback}</div></section><section class="card wide"><h3>巩固与归类</h3><div class="pills">${[['new','新词'],['weak','模糊'],['mastered','已掌握']].map(([s,t])=>`<button class="pill ${w.status===s?'active':''}" onclick="mark('${s}')">${t}</button>`).join('')}</div><p class="tiny">手动标记是自我评估；测试结果会进一步调整掌握度与复习间隔。</p><label>分类</label><div class="row"><select style="flex:1" onchange="current().category=this.value;save();renderDetail()">${[...new Set([...db.categories,w.category||'未分类'])].map(c=>`<option ${w.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="plain" onclick="newCategory()">＋分类</button></div><div class="row" style="margin-top:17px"><button class="primary" onclick="finishLearning()">✓ 学完，进入测试</button><button class="secondary" onclick="enrichCurrent()">生成 / 补全资料</button><button class="plain" onclick="editCurrent()">${w.enrichFailed?'手动补充':'查看导入说明'}</button></div><p class="tiny" style="margin-top:12px">${w.learned?'下次复习：'+new Date(w.due).toLocaleString('zh-CN'):'首次学完后，安排 10 分钟后的回忆测试。'}</p></section></div>`}
function mark(s){let w=current();w.status=s;if(s!=='new'){if(!w.learned){w.learned=true;activity('new',w.id)}w.due=Date.now()+(s==='mastered'?86400000:600000)}save();renderDetail()}
function finishLearning(){let w=current();if(!w.learned){w.learned=true;w.due=Date.now()+600000;activity('new',w.id)}save();queue=[w.id];qi=0;view='quiz';quiz=null;render()}
function speak(text,after){if(!('speechSynthesis'in window)){toast('当前浏览器不支持朗读，请使用 Safari 或 Chrome。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=db.settings.speed;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>/^en/.test(v.lang))||null;u.onstart=()=>{if($('speakState'))$('speakState').textContent='正在播放原音…'};u.onend=()=>{if($('speakState'))$('speakState').textContent='播放完成。';after?.()};u.onerror=()=>toast('朗读暂不可用，请检查设备的英语语音。');speechSynthesis.speak(u)}
function shadow(){let w=current();activity('practice',w.id);speak(w.word,()=>{if($('speakState'))$('speakState').textContent='停顿 2 秒，准备跟读…';speak.timer=setTimeout(()=>{if($('speakState'))$('speakState').textContent='现在跟读：'+w.word},2000)})}
async function toggleRecord(){if(recording?.state==='recording'){recording.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('此环境不支持录音。请在 HTTPS 或 localhost 打开。');return}try{let recordedId=currentId;stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];recording=new MediaRecorder(stream);recording.ondataavailable=e=>chunks.push(e.data);recording.onstop=()=>{clearTimeout(toggleRecord.timer);if(recordUrl)URL.revokeObjectURL(recordUrl);recordForId=recordedId;recordUrl=URL.createObjectURL(new Blob(chunks,{type:recording.mimeType||'audio/webm'}));stream.getTracks().forEach(t=>t.stop());if($('recordArea')&&currentId===recordedId)$('recordArea').innerHTML=`<audio controls src="${recordUrl}"></audio><button class="pill" onclick="downloadRecording()">保存录音</button>`;if($('recordBtn')&&currentId===recordedId)$('recordBtn').textContent='● 再录一次';activity('practice',recordedId)};recording.start();$('recordBtn').textContent='■ 停止录音';toggleRecord.timer=setTimeout(()=>{if(recording?.state==='recording')recording.stop()},60000)}catch(e){stream?.getTracks().forEach(t=>t.stop());toast('录音未开始：'+e.message)}}
function downloadRecording(){downloadURL(recordUrl,'商务跟读.'+(recording?.mimeType.includes('mp4')?'m4a':'webm'))}
function splitEnglish(text){let sentences=(text.match(/[^.!?]+(?:[.!?]+["”']?|$)/g)||[]).map(s=>s.trim()).filter(Boolean);let phrases=new Set(),words=new Set();let known=['look forward to','in terms of','as soon as possible','by the end of','on behalf of','follow up on','get back to','reach an agreement','cash flow','payment terms','market share','action items','next steps','due to','in order to','as a result','business plan','sales pipeline'];for(let s of sentences){let n=norm(s);for(let p of known)if(n.includes(p))phrases.add(p);let chunks=s.split(/[,;:—]|\b(?:but|because|although|while|which|that|and)\b/i).map(x=>x.trim().replace(/[.!?]$/,'')).filter(x=>x.split(/\s+/).length>=2&&x.split(/\s+/).length<=7);chunks.forEach(x=>phrases.add(x));(s.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).forEach(x=>words.add(x.toLowerCase()))}return {sentences,phrases:[...phrases],words:[...words]}}
function splitBlocks(r,withSentences=true){return `${withSentences?`<h3 style="margin-top:18px">01 · 句子 ${r.sentences.length}</h3><div class="list" style="margin:12px 0">${r.sentences.map(s=>`<button class="wordrow" onclick="learnText(this.dataset.text)" data-text="${esc(s)}"><span>${esc(s)}</span><span>›</span></button>`).join('')}</div>`:''}<h3 style="margin-top:18px">${withSentences?'02':'01'} · 词组 / 意群 ${r.phrases.length}</h3><p class="tiny">按标点、连接词和常用搭配切分的离线建议，可在 ChatGPT 中进一步核对。</p><div class="pills">${r.phrases.map(s=>`<button class="tagbutton" data-text="${esc(s)}" onclick="learnText(this.dataset.text)">${esc(s)}</button>`).join('')}</div><h3 style="margin-top:18px">${withSentences?'03':'02'} · 单词 ${r.words.length}</h3><div class="pills">${r.words.map(s=>`<button class="pill" data-text="${esc(s)}" onclick="learnText(this.dataset.text)">${esc(s)}</button>`).join('')}</div>`}
async function learnText(text){let w=db.words.find(w=>norm(w.word)===norm(text));if(w){openWord(w.id);return}const seed=SEED.find(w=>norm(w.word)===norm(text));let n=normalizeWord(seed||{word:text,category:'切分学习'});db.words.push(n);if(!db.categories.includes(n.category))db.categories.push(n.category);save();openWord(n.id,'add');if(!seed){n.enrichFailed=true;save();if(hasAI())await enrichCurrent();else{renderDetail();toast('新卡片已保存；复制到 ChatGPT 可生成完整资料。')}}}
function renderAdd(){$('main').innerHTML=heading('把工作中的英语，变成积累。','录入后自动匹配词库；新内容交给 AI 或自己的 ChatGPT。')+`<div class="pills">${[['text','单词 / 句子'],['json','ChatGPT JSON'],['split','段落三层切分'],['plan','学习计划']].map(([v,t])=>`<button class="pill ${importMode===v?'active':''}" onclick="importText=$('importInput')?.value||importText;importMode='${v}';renderAdd()">${t}</button>`).join('')}</div><section class="card"><h3>${({text:'每行一条，自动识别类型',json:'粘贴 ChatGPT 返回的 JSON',split:'先句子，再词组，最后单词',plan:'导入你的分日学习计划'})[importMode]}</h3><p class="sub">${({text:'输入英语即可。已有词自动合并；新词自动生成释义、音标、例句。',json:'支持 words 数组。缺字段留空，不会让整批导入失败。',split:'保存的句子，在详情页也能继续拆分。',plan:'支持 plan.name 与 plan.days，任务目标会与打卡联动。'})[importMode]}</p><textarea id="importInput" style="margin-top:16px;min-height:190px" placeholder="${esc(({text:'negotiate\nWe need to revise the budget.\npayment terms',json:'{"words":[{"word":"negotiate","phonetic":"/nɪˈɡoʊʃieɪt/","meanings":["谈判"],"category":"谈判"}]}',split:'We need to negotiate better payment terms. Please send us your proposal by Friday.',plan:'{"plan":{"name":"商务英语 7 天","days":[{"day":1,"title":"谈判开场","words":["negotiate","proposal"],"new_count":2,"review_count":3,"note":"练一次角色扮演"}]}}'})[importMode])}">${esc(importText)}</textarea><div class="row" style="margin-top:14px"><button class="primary" id="importBtn" ${importBusy?'disabled':''} onclick="runImport()">${importMode==='split'?'自动三层切分':importMode==='plan'?'导入计划':'一键导入'} →</button>${importMode==='text'||importMode==='split'?'<button class="secondary" onclick="importChat()">生成 ChatGPT 提示词</button>':''}<button class="plain" onclick="$ ('importFile').click()">选择 JSON 文件</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="readImportFile(this)"></div><p class="hint" style="margin-top:16px">${hasAI()?'已配置 AI：导入新内容时自动生成。请留意接口费用。':'还未配置 AI：内置词库可直接学习。陌生词先保存待补全卡片，再复制提示词到他自己的 ChatGPT，返回 JSON 后导入；也可在设置中配置个人 AI 接口。'}</p><div id="importState" role="status"></div></section>${splitResult&&importMode==='split'?`<section class="card">${splitBlocks(splitResult)}</section>`:''}<section class="card"><h3>与自己的 ChatGPT 一起学</h3><p class="sub">① 复制网页提示词 → ② 打开他的 ChatGPT → ③ 发送并练口语 → ④ 复制 JSON 回来导入。账号之间不需要关联，也不会共享聊天记录。</p><div class="row" style="margin-top:16px"><button class="secondary" onclick="dailyChat()">复制口语陪练提示词</button><a class="plain" href="https://chatgpt.com/" target="_blank" rel="noopener">打开 ChatGPT ↗</a></div></section>`}
function extractJSON(text){text=String(text).trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');try{return JSON.parse(text)}catch(e){let a=text.indexOf('{'),b=text.lastIndexOf('}');if(a>=0&&b>a)return JSON.parse(text.slice(a,b+1));throw Error('没有找到有效 JSON')}}
function normalizeWord(x){if(!x||typeof x.word!=='string'||!x.word.trim())throw Error('word 必须是非空英文字符串');let arr=Array.isArray(x.meanings)?x.meanings:typeof x.meanings==='string'?[x.meanings]:[];return{word:x.word.trim(),phonetic:typeof x.phonetic==='string'?x.phonetic:'',meanings:arr.filter(m=>typeof m==='string'),category:typeof x.category==='string'&&x.category.trim()?x.category.trim():'未分类',mnemonic:typeof x.mnemonic==='string'?x.mnemonic:'',examples:Array.isArray(x.examples)?x.examples.filter(e=>e&&typeof e.en==='string').map(e=>({en:e.en,zh:typeof e.zh==='string'?e.zh:''})):[],root:typeof x.root==='string'?x.root:'',pos:typeof x.pos==='string'?x.pos:'',syllables:typeof x.syllables==='string'?x.syllables:'',phonicsNote:typeof x.phonicsNote==='string'?x.phonicsNote:'',scene:typeof x.scene==='string'?x.scene:'',family:typeof x.family==='string'?x.family:'',grammar:typeof x.grammar==='string'?x.grammar:'',id:uid(),kind:['word','phrase','sentence'].includes(x.kind)?x.kind:kind(x.word),status:'new',reps:0,lapses:0,ease:2.5,interval:0,due:0,learned:false}}
function mergeWords(list){if(!Array.isArray(list))throw Error('words 应为数组');let added=0,updated=0,skipped=0,ids=[];for(let x of list){try{let n=normalizeWord(x),old=db.words.find(w=>norm(w.word)===norm(n.word));if(old){for(let k of ['phonetic','meanings','mnemonic','examples','root','pos','syllables','phonicsNote','scene','family','grammar'])if(Array.isArray(n[k])?n[k].length:n[k])old[k]=n[k];if(x.category)old.category=n.category;old.enrichFailed=false;ids.push(old.id);updated++}else{db.words.push(n);ids.push(n.id);added++}let actualCat=old?.category||n.category;if(!db.categories.includes(actualCat))db.categories.push(actualCat)}catch(e){skipped++}}save();return{added,updated,skipped,ids}}
async function runImport(){importText=$('importInput').value.trim();if(!importText){toast('请先输入内容。');return}try{if(importMode==='split'){splitText=importText;splitResult=splitEnglish(splitText);renderAdd();return}if(importMode==='plan'){importPlan(extractJSON(importText));return}if(importMode==='json'){let obj=extractJSON(importText);if(obj.plan&&!obj.words){importPlan(obj);return}let r=mergeWords(obj.words);toast(`新增 ${r.added} · 更新 ${r.updated} · 跳过 ${r.skipped}`);importText='';renderAdd();return}let lines=importText.split(/\n+/).map(s=>s.trim()).filter(Boolean);if(lines.length>200)throw Error('一次最多 200 条，请分批导入。');let missing=[],items=lines.map(word=>{let seed=SEED.find(w=>norm(w.word)===norm(word)),old=db.words.find(w=>norm(w.word)===norm(word));if(old)return old;if(seed)return seed;missing.push(word);return{word,category:'我的录入'}});let r=mergeWords(items);for(let id of r.ids){let w=db.words.find(w=>w.id===id);if(!w.meanings.length)w.enrichFailed=true}save();if(missing.length&&hasAI()){importBusy=true;$('importBtn').disabled=true;$('importState').innerHTML='<p class="loading">内容已保存，正在生成学习资料…</p>';try{for(let i=0;i<missing.length;i+=10){let obj=await aiJSON(wordPrompt(missing.slice(i,i+10)));mergeWords(obj.words)}toast('导入与学习资料生成完成。')}catch(e){toast('自动生成失败，已保留待补全卡片：'+e.message)}finally{importBusy=false}}else toast(`新增 ${r.added} 项${missing.length?'；新内容待 ChatGPT 补全':''}`);importText='';renderAdd()}catch(e){toast('导入失败：'+e.message)}}
async function readImportFile(input){let f=input.files[0];if(!f)return;if(f.size>10000000){toast('文件太大，请选择小于 10MB 的 JSON。');return}try{let text=await f.text(),obj=extractJSON(text);if(obj.version&&obj.logs&&obj.settings&&Array.isArray(obj.words)){restoreBackup(obj);return}importText=text;importMode=obj.plan?'plan':'json';renderAdd()}catch(e){toast('文件读取失败：'+e.message)}}
const wordPrompt=words=>`你是面向43岁中国商务人士的英语教练。为以下英语生成可靠学习资料：${JSON.stringify(words)}。每项给出中文释义、美式 IPA、词性、商务分类、两个自然且不同场景的双语例句、与例句相关的轻量语法点、鲜明好记的联想故事与画面场景。单词按读音和六类音节原则提供 syllables（·分隔）；只有容易误读处加 phonicsNote，不要滥用中文谐音；句子按意群处理。只有确有依据的词根/词缀才填写 root，并给 family（/分隔）；不确定留空，不要猜词源。可查询 Reading Rockets 的六类音节规则和 Etymonline 词源词典后生成。只输出 JSON：{"words":[{"word":"原始英语","phonetic":"/IPA/","meanings":["中文"],"pos":"n./v./adj.","category":"主题","syllables":"","phonicsNote":"","mnemonic":"","scene":"","root":"","family":"","grammar":"","examples":[{"en":"","zh":""},{"en":"","zh":""}]}]}。保留原始英语文本。`;
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制，可粘贴到他自己的 ChatGPT。')}catch(e){showModal(`<h3>复制到自己的 ChatGPT</h3><textarea id="copyBox" style="min-height:260px;margin-top:15px">${esc(text)}</textarea><p class="sub">当前环境不能自动复制，请长按或全选复制。</p>`);$('copyBox').select()}}
function promptPanel(text,title){lastPrompt=text;showModal(`<h3>${title}</h3><p class="sub">在他自己的 ChatGPT 发送下方内容。生成资料后把 JSON 复制到网页的“ChatGPT JSON”导入。</p><textarea id="copyBox" style="margin-top:14px;min-height:220px">${esc(text)}</textarea><div class="row" style="margin-top:13px"><button class="primary" onclick="copyText($('copyBox').value)">复制提示词</button><a class="secondary" href="https://chatgpt.com/" target="_blank" rel="noopener">打开他的 ChatGPT ↗</a></div>`)}
function importChat(){importText=$('importInput').value;let words=importMode==='split'?[importText]:importText.split(/\n+/).map(s=>s.trim()).filter(Boolean);if(!words.length){toast('先输入要学习的英语。');return}promptPanel(wordPrompt(words),'让 ChatGPT 自动生成学习资料')}
function wordChat(){let w=current();promptPanel(`你是我的商务英语口语教练，我43岁，中国男性商务人士。今天练习 ${w.word}（${w.meanings.join('；')}），场景是${w.category}。请在语音模式下：先示范自然发音与重音；让我跟读；再用包含这个表达的真实商务角色扮演，一次只问一个问题，等我回答；纠正语法、用词和语气，先肯定准确之处，给简明中文解释与一条地道改进句。最后让我不看提示再次说出该表达。请从一句简单英语开始。`,'用自己的 ChatGPT 练口语')}
function dailyChat(){let items=dueWords().slice(0,3);if(!items.length)items=db.words.filter(w=>!w.learned).slice(0,3);promptPanel(`我是一位43岁的中国商务人士，正在提升英语口语。请用 ${items.map(w=>w.word).join('、')} 设计10分钟商务口语训练。依次进行：简单中文释义→示范发音→逐句跟读→一次一个问题的商务角色扮演→纠正我的表达→不看提示复述→三个小测试。用语音模式陪我练，不要一次输出所有答案。最后根据我的表现建议下一次练习时间。`,'今日口语陪练')}
function showModal(html){$('modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="操作窗口"><div class="card"><div class="row between" style="margin-bottom:16px"><span class="tiny">商语 · 个人学习空间</span><button class="plain" onclick="closeModal()">关闭 ×</button></div>${html}</div></div>`;$('modal').querySelector('button')?.focus()}
function closeModal(){$('modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function hasAI(){return !!(db.settings.endpoint&&db.settings.model&&(sessionKey||db.settings.apiKey))}
async function aiJSON(prompt){if(!hasAI())throw Error('请先配置 AI 接口或使用 ChatGPT 导入');const url=db.settings.endpoint;if(!/^https:\/\//i.test(url)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:|\/)/i.test(url))throw Error('接口须使用 HTTPS，或本机 localhost');let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);try{let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(sessionKey||db.settings.apiKey)},body:JSON.stringify({model:db.settings.model,messages:[{role:'system',content:'You are a careful business English tutor. Return valid JSON only. Never invent etymology.'},{role:'user',content:prompt}],temperature:.4}),signal:controller.signal});if(!r.ok)throw Error('接口返回 '+r.status);let result=await r.json(),content=result.choices?.[0]?.message?.content;if(!content)throw Error('接口没有返回文本；请检查兼容格式');return extractJSON(content)}finally{clearTimeout(timer)}}
async function enrichCurrent(){let w=current();if(!hasAI()){w.enrichFailed=true;save();promptPanel(wordPrompt([w.word]),'生成完整学习资料');return}toast('正在生成资料，请稍候…');try{let obj=await aiJSON(wordPrompt([w.word]));if(!obj.words?.some(x=>norm(x.word)===norm(w.word)))throw Error('未返回当前词的资料');mergeWords(obj.words);if(view==='detail'&&currentId===w.id)renderDetail();toast('学习资料已补全。')}catch(e){w.enrichFailed=true;save();toast('生成失败，可手动补充：'+e.message)}}
function editCurrent(){let w=current();if(!w.enrichFailed){toast('自动资料可通过 ChatGPT JSON 更新；手动补充仅在生成失败后开放。');return}showModal(`<h3>自动生成未完成 · 手动补充</h3><label>中文释义</label><input id="editMeaning" value="${esc(w.meanings.join('；'))}"><label>音标</label><input id="editIpa" value="${esc(w.phonetic)}"><label>完整属性 JSON（可选）</label><textarea id="editJson">${esc(JSON.stringify({word:w.word,meanings:w.meanings,phonetic:w.phonetic,examples:w.examples,grammar:w.grammar},null,2))}</textarea><button class="primary" style="margin-top:12px" onclick="saveManual()">保存补充</button>`)}
function saveManual(){try{let x=extractJSON($('editJson').value);x.word=current().word;x.meanings=$('editMeaning').value.split(/[；;]/).filter(Boolean);x.phonetic=$('editIpa').value;mergeWords([x]);closeModal();renderDetail();toast('已保存。')}catch(e){toast('JSON 格式有误：'+e.message)}}
function correctionPrompt(sentence){return `我是一位中国商务人士。目标表达：${current().word}。我的造句：${JSON.stringify(sentence)}。请纠正语法、用词、搭配和商务语气，保留原意，给一个改进版和一句鼓励。只返回 JSON：{"original":"原句","corrected":"改进的英语","explanation":"中文说明，区分错误与可选润色","businessTip":"商务场景建议","encouragement":"简短鼓励"}。`}
function correctionChat(){let s=$('practice').value.trim();if(!s){toast('先写一句话。');return}current().practiceDraft=s;save();promptPanel(correctionPrompt(s),'请自己的 ChatGPT 批改')}
function showCorrectionImport(){if($('practice')){current().practiceDraft=$('practice').value;save()}showModal('<h3>粘贴 ChatGPT 批改 JSON</h3><textarea id="correctionJson" style="margin-top:15px" placeholder="{&quot;corrected&quot;:&quot;...&quot;,&quot;explanation&quot;:&quot;...&quot;}"></textarea><button class="primary" style="margin-top:12px" onclick="importCorrection()">显示批改结果</button>')}
function importCorrection(){try{let x=extractJSON($('correctionJson').value);if(typeof x.corrected!=='string')throw Error('需要 corrected 字段');closeModal();displayCorrection(x)}catch(e){toast('格式错误：'+e.message)}}
function displayCorrection(x){feedback=`<div class="hint"><strong>${esc(x.corrected)}</strong><p style="margin-top:8px">${esc(x.explanation||'')}</p><p style="margin-top:8px">${esc(x.businessTip||'')}</p><p>${esc(x.encouragement||'很好，继续在真实场景中使用它。')}</p></div>`;current().lastCorrection=x;activity('practice',currentId);if($('feedback'))$('feedback').innerHTML=feedback}
async function correctSentence(){let s=$('practice').value.trim();if(!s){toast('先写一句话。');return}current().practiceDraft=s;save();if(!hasAI()){correctionChat();return}let id=currentId,button=$('correctBtn');button.disabled=true;button.textContent='正在批改…';try{let x=await aiJSON(correctionPrompt(s));if(typeof x.corrected!=='string')throw Error('未返回改进版');if(currentId===id&&view==='detail')displayCorrection(x)}catch(e){toast('批改失败：'+e.message)}finally{if($('correctBtn')){$('correctBtn').disabled=false;$('correctBtn').textContent='AI 批改'}}}
function renderReview(){let items=dueWords(),weak=db.words.filter(w=>w.status==='weak'),eligible=db.words.filter(w=>w.meanings.length);$('main').innerHTML=heading('把模糊，练成笃定。','主动回忆比反复浏览更有效；错题会提前回流。')+`<div class="stats"><div class="stat"><strong>${items.length}</strong><span>已到期</span></div><div class="stat"><strong>${weak.length}</strong><span>薄弱项</span></div><div class="stat"><strong>${eligible.length}</strong><span>可测试项</span></div></div><section class="card"><h3>选择今天的训练</h3><label>复习分类</label><select onchange="reviewCat=this.value"><option value="">所有分类</option>${db.categories.map(c=>`<option ${reviewCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="shortcuts" style="margin-top:18px"><button class="shortcut" onclick="startReview('quiz')"><span class="badge">推荐</span><strong>到期小测试 →</strong><small>英选中 · 汉选英 · 听辨 · 拼写</small></button><button class="shortcut" onclick="startReview('flash')"><span class="badge">快速回忆</span><strong>抽认卡复习 →</strong><small>先回忆，再翻面核对</small></button><button class="shortcut" onclick="startReview('quiz','weak')"><strong>薄弱项强化 →</strong><small>优先解决常错表达</small></button><button class="shortcut" onclick="startReview('quiz','all')"><strong>自由挑战 →</strong><small>从词库随机抽取 10 项</small></button></div></section><section class="card"><h3>间隔重复 · 你的记忆节奏</h3><p class="sub">初学 → 10 分钟 → 1 天 → 3 天 → 根据表现逐渐延长。每天首次答对时增长间隔（同日重复答对不虚增掌握度）；答错时降低难度系数，10 分钟后再见。连续答对 3 次且间隔达到 7 天后标为已掌握。</p><div class="pills"><span class="badge">短时回忆</span><span class="badge">间隔复习</span><span class="badge">混合题型</span><span class="badge">场景使用</span></div><p class="tiny">采用可解释的 SM-2 风格调度，并加入短时重学。记忆速度因人而异；这里的间隔是学习安排，不是精确的“遗忘百分比”。</p></section><div class="section-title"><h3>到期的记忆</h3><small>${items.length} 项</small></div><div class="list">${items.slice(0,10).map(wordrow).join('')||'<div class="card empty">暂时没有到期词。可自由挑战，或开始学新词。</div>'}</div>`}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function startReview(type,mode='due'){let items=db.words.filter(w=>w.meanings.length&&(!reviewCat||w.category===reviewCat));if(mode==='due')items=items.filter(w=>w.learned&&w.due<=Date.now());if(mode==='weak')items=items.filter(w=>w.status==='weak');if(!items.length){toast(mode==='due'?'此分类暂无到期复习，可选择自由挑战。':'暂无可测试内容；先补充中文释义。');return}queue=(mode==='due'?items.sort((a,b)=>a.due-b.due):shuffled(items)).slice(0,10).map(w=>w.id);qi=0;quiz=null;flashRevealed=false;view=type;render()}
function scheduleResult(w,correct,quality=4){if(!w.learned){w.learned=true;activity('new',w.id)}let l=log();l.attempts++;if(correct)l.correct++;l.xp+=correct?4:1;if(correct){if(w.lastSuccess!==dayKey()){w.reps=(w.reps||0)+1;w.ease=Math.max(1.3,(w.ease||2.5)+(.1-(5-quality)*(.08+(5-quality)*.02)));w.interval=w.reps===1?1:w.reps===2?3:Math.max(1,Math.round((w.interval||3)*w.ease));w.interval=Math.min(180,w.interval);w.due=Date.now()+w.interval*86400000;w.status=w.reps>=3&&w.interval>=7?'mastered':'weak';w.lastSuccess=dayKey()}}else{w.lastSuccess='';w.reps=0;w.lapses=(w.lapses||0)+1;w.ease=Math.max(1.3,(w.ease||2.5)-.2);w.interval=0;w.due=Date.now()+600000;w.status='weak'}activity('review',w.id);save()}
function makeQuiz(w){let type=qi%4,others=shuffled(db.words.filter(x=>x.id!==w.id&&x.meanings.length&&norm(x.meanings[0])!==norm(w.meanings[0]))).slice(0,3),choices=shuffled([w,...others]).map(x=>({id:x.id,text:type===0?x.meanings.join('；'):x.word}));return{type,choices,answered:false,selected:null,correct:false,spelling:''}}
function renderQuiz(){let w=db.words.find(w=>w.id===queue[qi]);if(!w){sessionEnd();return}if(!quiz)quiz=makeQuiz(w);const types=['英选中','汉选英','听音辨词','拼写填空'];$('main').innerHTML=`<button class="back" onclick="go('review')">← 结束本轮</button><div class="row between"><span class="badge">${types[quiz.type]}</span><span class="tiny">${qi+1} / ${queue.length}</span></div><div class="progress" style="margin:15px 0 25px"><i style="width:${qi/queue.length*100}%"></i></div><section class="card"><div class="eyebrow">RECALL BEFORE YOU REVEAL</div><h2>${quiz.type===0?esc(w.word):quiz.type===2?'听一遍，找到对应的表达。':esc(w.meanings.join('；'))}</h2>${quiz.type===2?`<button class="primary" style="margin-top:20px" onclick="speak(db.words.find(w=>w.id===queue[qi]).word)">▷ 播放题目</button>`:''}${quiz.type===3?`<label>写出对应的英语</label><input id="spelling" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="输入单词或表达" value="${esc(quiz.spelling)}" ${quiz.answered?'disabled':''} onkeydown="if(event.key==='Enter')answerSpell()"><button class="primary" style="margin-top:15px" onclick="answerSpell()" ${quiz.answered?'disabled':''}>提交答案</button>`:`<div class="quizchoices">${quiz.choices.map(c=>`<button class="choice ${quiz.answered?(c.id===w.id?'correct':c.id===quiz.selected?'wrong':''):''}" onclick="answerChoice('${c.id}')" ${quiz.answered?'disabled':''}>${esc(c.text)}</button>`).join('')}</div>`}${quiz.answered?`<div class="hint"><strong>${quiz.correct?'✓ 回忆正确，记忆更牢了一点。':'再见一次，才能记得更牢。'}</strong><p style="margin-top:8px">${esc(w.word)} · ${esc(w.meanings.join('；'))}</p><p class="tiny">${quiz.correct?'下次复习：'+new Date(w.due).toLocaleDateString('zh-CN'):'已加入薄弱项，10 分钟后安排重学。'}</p></div><div class="row" style="margin-top:18px"><button class="primary" onclick="nextQuiz()">${qi+1<queue.length?'下一题':'完成本轮'} →</button><button class="secondary" onclick="openWord(queue[qi],'review')">回详情补强</button></div>`:'<p class="tiny">先回忆再作答；测试结果会更新掌握度与下次复习时间。</p>'}</section>`}
function answerChoice(id){if(quiz?.answered)return;let w=db.words.find(w=>w.id===queue[qi]);quiz.answered=true;quiz.selected=id;quiz.correct=id===w.id;scheduleResult(w,quiz.correct);renderQuiz()}
function spellingNorm(s){return norm(s).replace(/[.!?,;:]+$/,'')}
function answerSpell(){if(quiz?.answered)return;let w=db.words.find(w=>w.id===queue[qi]);quiz.spelling=$('spelling').value.trim();if(!quiz.spelling){toast('请先输入答案。');return}quiz.answered=true;quiz.correct=spellingNorm(quiz.spelling)===spellingNorm(w.word);scheduleResult(w,quiz.correct,5);renderQuiz()}

function importPlan(obj){let p=obj.plan;if(!p||!Array.isArray(p.days)||!p.days.length)throw Error('计划需要非空 days 数组');let seen=new Set(),days=p.days.map((x,i)=>{let d=Number(x.day??i+1);if(!Number.isInteger(d)||d<1||seen.has(d))throw Error('day 应为不重复的正整数');seen.add(d);return{day:d,title:String(x.title||'第 '+d+' 天'),words:Array.isArray(x.words)?x.words.filter(w=>typeof w==='string'):[],new_count:boundedCount(x.new_count,5),review_count:boundedCount(x.review_count,10),note:String(x.note||''),done:false}}).sort((a,b)=>a.day-b.day);const plan={name:String(p.name||'我的商务英语计划'),start:dayKey(),days};if(db.plan){showModal(`<h3>替换当前学习计划？</h3><p class="sub">新计划“${esc(plan.name)}”包含 ${days.length} 天，会替换当前计划的任务勾选。词库和学习记录保留。</p><button class="primary" style="margin-top:15px" id="replacePlan">替换计划</button>`);$('replacePlan').onclick=()=>{db.plan=plan;save();closeModal();go('progress');toast('学习计划已导入。')};return}db.plan=plan;save();go('progress');toast('学习计划已导入。')}
function boundedCount(n,d){n=Number(n);return Number.isFinite(n)?Math.max(0,Math.min(200,Math.round(n))):d}
function planToday(){if(!db.plan)return null;let d=db.plan.days.find(x=>!x.done)||db.plan.days.at(-1);return d}
function startPlanDay(day){let d=db.plan?.days.find(x=>x.day===day);if(!d)return;db.settings.newGoal=d.new_count;db.settings.reviewGoal=d.review_count;if(db.settings.newGoal+db.settings.reviewGoal===0)db.settings.newGoal=1;save();let r=mergeWords(d.words.map(word=>SEED.find(w=>norm(w.word)===norm(word))||{word,category:'计划学习'}));let items=r.ids.map(id=>db.words.find(w=>w.id===id)),w=items.find(w=>!w.learned)||items[0];if(w){openWord(w.id,'progress');if(!w.meanings.length){w.enrichFailed=true;save();if(hasAI())enrichCurrent();else renderDetail()}}else go('review')}
function togglePlan(day,checked){let d=db.plan.days.find(x=>x.day===day);d.done=checked;d.completedAt=checked?dayKey():null;save();renderProgress();toast(checked?'计划任务已勾选。打卡仍按真实学习次数计算。':'已取消任务完成。')}
function renderProgress(){let l=log(),t=totals(),learned=db.words.filter(w=>w.learned).length,mastered=db.words.filter(w=>w.status==='mastered').length,p=db.plan,done=p?.days.filter(d=>d.done).length||0;let dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return dayKey(d)});let achievements=[['🌱','迈出第一步',learned>=1,'学完第 1 项表达'],['🎯','回忆达人',t.correct>=20,'累计答对 20 次'],['🔥','七日坚持',streak()>=7,'连续完成目标 7 天'],['🏅','商务表达者',mastered>=30,'掌握 30 项表达'],['🎙','开口的力量',t.practices>=10,'跟读或造句练习 10 次']];$('main').innerHTML=heading('看见自己的进步。','成长不必轰轰烈烈，持续就有力量。')+`<div class="stats"><div class="stat"><strong>${streak()}</strong><span>连续打卡天数</span></div><div class="stat"><strong>${learned}</strong><span>已学习表达</span></div><div class="stat"><strong>Lv.${Math.floor(t.xp/100)+1}</strong><span>${t.xp} 成长值</span></div></div><div class="grid"><section class="card"><div class="row between"><h3>今日打卡</h3><span class="badge">${l.checked?'✓ 目标完成':'进行中'}</span></div><label>新学 ${l.newIds.length} / ${db.settings.newGoal}</label><div class="progress"><i style="width:${db.settings.newGoal?Math.min(100,l.newIds.length/db.settings.newGoal*100):100}%"></i></div><label>复习 ${l.reviewIds.length} / ${db.settings.reviewGoal}</label><div class="progress"><i style="width:${db.settings.reviewGoal?Math.min(100,l.reviewIds.length/db.settings.reviewGoal*100):100}%"></i></div><div class="week">${dates.map(k=>`<div class="daydot ${db.logs[k]?.checked?'done':''}"><i>${db.logs[k]?.checked?'✓':k.slice(-2)}</i>${new Date(k+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'short'})}</div>`).join('')}</div><p class="tiny">同一项每天只计一次新学或复习；达到两个目标自动打卡。连续 3 / 7 / 30 天可领取额外成长值。</p><div class="row" style="margin-top:15px"><button class="secondary" onclick="go('settings')">调整目标</button><button class="primary" onclick="claimReward()">领取坚持奖励</button></div></section><section class="card"><h3>近七天 · 练习节奏</h3><div class="bars">${dates.map(k=>{let x=db.logs[k],n=(x?.newIds?.length||0)+(x?.reviewIds?.length||0);return`<div><span>${n}</span><i style="height:${Math.min(75,n*4)}px"></i><span>${k.slice(5)}</span></div>`}).join('')}</div><div class="rule"></div><div class="row between"><span>累计测试正确率</span><strong>${t.attempts?Math.round(t.correct/t.attempts*100)+'%':'尚未测试'}</strong></div><p class="tiny">${t.correct} 次正确 / ${t.attempts} 次作答；抽认卡自评也计入。近七天按不重复学习项统计。</p><div class="row between" style="margin-top:12px"><span>词库掌握进度</span><strong>${mastered}/${db.words.length}</strong></div><div class="progress"><i style="width:${mastered/db.words.length*100}%"></i></div></section></div><section class="card"><div class="row between"><h3>学习计划${p?' · '+esc(p.name):''}</h3><button class="pill" onclick="importMode='plan';go('add')">${p?'导入新计划':'＋ 导入计划'}</button></div>${p?`<p class="sub">${done}/${p.days.length} 天完成 · 从 ${esc(p.start)} 开始 · 按完成顺序推进</p><div class="progress"><i style="width:${done/p.days.length*100}%"></i></div>${p.days.map(d=>`<div class="plan-day ${d.done?'done':planToday()?.day===d.day?'current':''}"><div class="row between"><label style="margin:0;flex:1"><input type="checkbox" ${d.done?'checked':''} onchange="togglePlan(${d.day},this.checked)"> 第 ${d.day} 天 · ${esc(d.title)}</label><button class="pill" onclick="startPlanDay(${d.day})">学习 →</button></div><p class="sub">新学 ${d.new_count} · 复习 ${d.review_count} · ${esc(d.words.join(' / '))}</p>${d.note?`<p class="tiny">${esc(d.note)}</p>`:''}</div>`).join('')}`:'<p class="sub">把 ChatGPT 为他设计的分日计划导入这里，每天有明确任务。点击当天“学习”会同步每日目标；勾选不会虚增学习次数。</p><button class="secondary" style="margin-top:15px" onclick="planChat()">让 ChatGPT 生成 7 天计划</button>'}</section><section class="card"><h3>你的成就墙</h3>${achievements.map(([icon,title,on,desc])=>`<div class="achievement ${on?'':'locked'}"><b>${icon}</b><div><strong>${title} ${on?'✓':''}</strong><p class="tiny">${desc}</p></div></div>`).join('')}</section>`}
function claimReward(){let n=streak(),l=log(),milestone=[30,7,3].find(x=>n>=x);if(!milestone){toast('连续达标 3 天后，可领取第一份坚持奖励。');return}db.rewards=db.rewards||{};let key=dayKey()+':'+milestone;if(db.rewards[key]){toast('今天已领取，坚持明天再来。');return}db.rewards[key]=true;l.xp+=milestone===30?50:milestone===7?20:10;save();renderProgress();toast('坚持奖励已到账。每一次开口，都在变得更好。')}
function planChat(){promptPanel(`请为43岁中国男性商务人士设计可执行的7天商务英语计划，每天约15分钟，用自己的ChatGPT练口语。覆盖谈判、会议、邮件、财务、市场、人力、项目。每天5个新词、10项复习（第一天复习目标设0）。优先使用常用商务英语词。安排跟读、场景造句和角色扮演，在 note 写明确行动。只返回 JSON：{"plan":{"name":"商务开口7天","days":[{"day":1,"title":"...","words":["..."],"new_count":5,"review_count":0,"note":"..."}]}}，生成完整7天。`,'生成个人学习计划')}
function renderSettings(){$('main').innerHTML=`<button class="back" onclick="go('today')">← 返回今日</button>`+heading('让它适合你的节奏。','个人数据保存在当前浏览器；不同设备请用备份转移。')+`<section class="card"><h3>每日目标</h3><div class="grid"><div><label>新学词数 / 表达数</label><input id="goalNew" type="number" min="0" max="200" value="${db.settings.newGoal}"></div><div><label>复习词数 / 表达数</label><input id="goalReview" type="number" min="0" max="200" value="${db.settings.reviewGoal}"></div></div><button class="primary" style="margin-top:15px" onclick="saveGoals()">保存目标</button><p class="tiny" style="margin-top:10px">建议开始时每日 5 新词 + 10 复习；第一天可把复习目标设为 0。</p></section><section class="card"><h3>自己的 ChatGPT · 无需接口配置</h3><p class="sub">直接使用他自己的账号。网页帮他生成学习要求，ChatGPT 负责讲解、口语陪练与批改；JSON 回到网页，形成他的私人词库。个人 ChatGPT 会话与网页之间通过复制粘贴交接。</p><div class="row" style="margin-top:15px"><button class="secondary" onclick="dailyChat()">生成陪练提示词</button><a class="plain" target="_blank" rel="noopener" href="https://chatgpt.com/">打开 ChatGPT ↗</a></div></section><section class="card"><h3>可选 · 网页内 AI 自动生成与批改</h3><p class="sub">支持 Chat Completions 兼容接口；填写完整接口地址、模型与个人密钥。可使用可信的自有代理服务解决浏览器跨域问题。</p><label>完整接口地址</label><input id="endpoint" type="url" placeholder="https://你的服务/v1/chat/completions" value="${esc(db.settings.endpoint)}"><label>模型名称</label><input id="model" placeholder="服务提供的模型名称" value="${esc(db.settings.model)}"><label>个人 API 密钥</label><input id="apiKey" type="password" autocomplete="off" placeholder="默认仅保留在本次页面会话" value="${esc(sessionKey||db.settings.apiKey||'')}"><label><input id="saveKey" type="checkbox" ${db.settings.saveKey?'checked':''}> 在此设备记住密钥</label><p class="tiny">请求仅发送到上方配置的地址；不默认连接任何服务。记住密钥会明文保存在本机浏览器，请仅在自己的设备使用。ChatGPT 订阅账号登录不能替代 API 密钥。</p><div class="row" style="margin-top:15px"><button class="primary" onclick="saveAI()">保存配置</button><button class="secondary" id="testAI" onclick="testAI()">测试连接</button><button class="plain" onclick="clearAI()">清除密钥</button></div><p class="tiny" id="aiStatus" style="margin-top:12px">${hasAI()?'配置已填写，可测试连接。':'尚未配置；ChatGPT 复制导入仍可使用。'}</p></section><section class="card"><h3>数据备份与恢复</h3><p class="sub">导出包含词库、掌握度、计划、打卡与设置，自动排除 API 密钥。录音仅在当前会话，不进入备份。</p><div class="row" style="margin-top:15px"><button class="primary" onclick="exportBackup()">导出 JSON 备份</button><a class="plain" href="./business-english.html" download>下载单文件 HTML</a><button class="secondary" onclick="$ ('backupFile').click()">恢复 JSON 备份</button><input type="file" id="backupFile" accept=".json,application/json" hidden onchange="readBackup(this)"></div><p class="tiny" style="margin-top:12px">当前存储：${storageOK?'本机浏览器可用':'不可用，请导出后再关闭'}。清理浏览器数据会删除学习记录。</p></section><section class="card"><h3>添加到手机主屏幕</h3><div class="row" style="margin-top:15px"><button class="secondary" onclick="installApp()">查看安装方式</button><button class="plain" onclick="downloadIcon()">下载应用图标</button></div><p class="sub">iPhone：Safari 打开网页 → 分享 → 添加到主屏幕。Android：Chrome 菜单 → 添加到主屏幕（或安装应用）。需要可访问的 HTTPS 地址；本地文件可直接学习，但部分手机不支持给文件创建主屏幕入口。</p><p class="tiny" style="margin-top:12px">下载的单文件嵌入图标、移动端元信息与动态 manifest，离线可查看内置词库。已发布网页版额外提供标准 manifest、图标与离线缓存；首次成功联网打开后可缓存应用。录音与 AI 功能仍受设备和网络条件影响。</p></section><section class="card"><h3>学习方法与资料</h3><p class="sub">每天先复习到期项，后学少量新词；一词一场景，用跟读和造句把被动认识变成主动表达。测试错题短间隔重学，答对逐步延长。</p><div class="rule"></div><a target="_blank" rel="noopener" href="https://www.readingrockets.org/topics/spelling-and-word-study/articles/six-syllable-types">自然拼读：Reading Rockets 六类音节 ↗</a><br><a target="_blank" rel="noopener" href="https://www.etymonline.com/">词源参考：Etymonline ↗</a><br><a target="_blank" rel="noopener" href="https://www.super-memory.com/english/ol/sm2.htm">复习调度参考：SM-2 算法 ↗</a><p class="tiny" style="margin-top:12px">内置资料为学习用编辑内容；词族只对明确构词展示，例句发音采用设备语音。新内容通过 AI 生成时建议核对。网页没有后台，数据不会自动同步到其他设备。</p></section>`}
function saveGoals(){let n=boundedCount($('goalNew').value,5),r=boundedCount($('goalReview').value,10);if(n+r===0){toast('至少保留一个学习目标。');return}db.settings.newGoal=n;db.settings.reviewGoal=r;save();let l=log();if(l.newIds.length>=n&&l.reviewIds.length>=r){l.checked=true;save()}toast('每日目标已保存。')}
function saveAI(){db.settings.endpoint=$('endpoint').value.trim();db.settings.model=$('model').value.trim();sessionKey=$('apiKey').value.trim();db.settings.saveKey=$('saveKey').checked;if(db.settings.saveKey)db.settings.apiKey=sessionKey;else delete db.settings.apiKey;save();$('aiStatus').textContent=hasAI()?'配置已保存，建议测试连接。':'配置未完整；请填写接口、模型和密钥。';toast('设置已保存。')}
async function testAI(){saveAI();if(!hasAI()){toast('请先完成配置。');return}$('testAI').disabled=true;$('aiStatus').textContent='正在连接…';try{let x=await aiJSON('Return only {"ok":true}');$('aiStatus').textContent=x.ok?'✓ 连接成功，可自动生成资料与批改。':'接口可达，但返回格式需检查。'}catch(e){$('aiStatus').textContent='连接失败：'+e.message+'。请检查接口格式、密钥与 CORS 跨域许可。'}finally{$('testAI').disabled=false}}
function clearAI(){sessionKey='';delete db.settings.apiKey;db.settings.saveKey=false;save();renderSettings();toast('密钥已清除。')}
function downloadURL(url,name){let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}
function exportBackup(){let x=JSON.parse(JSON.stringify(db));delete x.settings.apiKey;x.settings.saveKey=false;x.exportedAt=new Date().toISOString();let url=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));downloadURL(url,'商语-备份-'+dayKey()+'.json');setTimeout(()=>URL.revokeObjectURL(url),10000);toast('备份已导出，不包含 API 密钥。')}
async function readBackup(input){let f=input.files[0];if(!f)return;try{if(f.size>10000000)throw Error('备份超过 10MB');restoreBackup(extractJSON(await f.text()))}catch(e){toast('恢复失败：'+e.message)}}
function validatedBackup(obj){if(obj.version!==1||!Array.isArray(obj.words)||!obj.logs||typeof obj.logs!=='object'||!obj.settings)throw Error('不是商语 v1 备份');let clean=base();clean.words=obj.words.map(x=>{let w=normalizeWord(x);w.id=uid();w.status=['new','weak','mastered'].includes(x.status)?x.status:'new';w.learned=!!x.learned;w.lastSuccess=typeof x.lastSuccess==='string'?x.lastSuccess:'';for(let k of ['reps','lapses','interval','due'])w[k]=Number.isFinite(+x[k])?Math.max(0,+x[k]):0;w.ease=Math.max(1.3,Math.min(3,Number(x.ease)||2.5));w._oldId=x.id;return w});let idMap=Object.fromEntries(clean.words.map(w=>[w._oldId,w.id]));clean.words.forEach(w=>delete w._oldId);clean.categories=[...new Set(clean.words.map(w=>w.category).concat(Array.isArray(obj.categories)?obj.categories.filter(c=>typeof c==='string'):[]))];clean.logs={};for(let [k,l]of Object.entries(obj.logs)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!l||typeof l!=='object')continue;clean.logs[k]={newIds:(Array.isArray(l.newIds)?l.newIds:[]).map(id=>idMap[id]).filter(Boolean),reviewIds:(Array.isArray(l.reviewIds)?l.reviewIds:[]).map(id=>idMap[id]).filter(Boolean),correct:Math.max(0,Number(l.correct)||0),attempts:Math.max(0,Number(l.attempts)||0),practices:Math.max(0,Number(l.practices)||0),xp:Math.max(0,Number(l.xp)||0),checked:!!l.checked}}
clean.settings={...clean.settings,newGoal:boundedCount(obj.settings.newGoal,5),reviewGoal:boundedCount(obj.settings.reviewGoal,10),speed:Math.max(.5,Math.min(1.2,Number(obj.settings.speed)||.85)),endpoint:typeof obj.settings.endpoint==='string'?obj.settings.endpoint:'',model:typeof obj.settings.model==='string'?obj.settings.model:''};if(clean.settings.newGoal+clean.settings.reviewGoal===0)clean.settings.newGoal=5;
if(obj.plan&&Array.isArray(obj.plan.days)){let seen=new Set();clean.plan={name:String(obj.plan.name||'恢复的计划'),start:/^\d{4}-\d{2}-\d{2}$/.test(obj.plan.start)?obj.plan.start:dayKey(),days:obj.plan.days.map((d,i)=>{let day=Number(d.day)||i+1;if(!Number.isInteger(day)||day<1||seen.has(day))throw Error('备份计划 day 无效');seen.add(day);return{day,title:String(d.title||''),words:Array.isArray(d.words)?d.words.filter(w=>typeof w==='string'):[],new_count:boundedCount(d.new_count,5),review_count:boundedCount(d.review_count,10),note:String(d.note||''),done:!!d.done}})}}clean.rewards=obj.rewards&&typeof obj.rewards==='object'?obj.rewards:{};return clean}
function restoreBackup(obj){let clean=validatedBackup(obj);showModal(`<h3>恢复这份备份？</h3><p class="sub">包含 ${clean.words.length} 项表达与 ${Object.keys(clean.logs).length} 天记录。恢复会替换当前本机数据，建议先导出当前备份。</p><div class="row" style="margin-top:15px"><button class="secondary" onclick="exportBackup()">先备份当前数据</button><button class="primary" id="confirmRestore">确认恢复</button></div>`);$('confirmRestore').onclick=()=>{db=clean;sessionKey='';save();closeModal();go('today');toast('备份已恢复。')}}
function installApp(){if(installPrompt){installPrompt.prompt();installPrompt=null;return}showModal('<h3>把商语放到主屏幕</h3><p style="margin-top:15px">iPhone：用 Safari 打开 HTTPS 网页，点分享按钮，再点“添加到主屏幕”。</p><p style="margin-top:15px">Android：用 Chrome 打开网页，点右上角菜单，选择“添加到主屏幕”。浏览器可能创建快捷方式，而不是完整离线应用。</p><p class="hint" style="margin-top:15px">本地 HTML 文件在部分手机无法创建入口。可以把同一个 HTML 放到你自己的 HTTPS 静态网页空间，学习数据仍只存在手机本机。不同网址或浏览器不共享 localStorage。</p>')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
let canvas=document.createElement('canvas');canvas.width=canvas.height=512;let ctx=canvas.getContext('2d');ctx.fillStyle='#17665b';ctx.fillRect(0,0,512,512);ctx.fillStyle='#edf4dd';ctx.font='bold 300px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('B.',270,270);let icon=canvas.toDataURL('image/png');$('appIcon').href=icon;$('favicon').href=icon;const manifest={name:'商语 · 商务英语记忆',short_name:'商语',start_url:location.protocol==='file:'?'./':location.pathname,display:'standalone',background_color:'#f5f7f4',theme_color:'#17665b',icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any'}]};$('manifest').href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));function downloadIcon(){downloadURL(icon,'商语-图标.png')}
if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){fetch('./manifest.webmanifest').then(r=>{if(r.ok&&r.headers.get('content-type')?.includes('manifest')){$('manifest').href='./manifest.webmanifest';$('appIcon').href='./icon.png';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}}).catch(()=>{})}if(storageOK)save();render();if(initialError)setTimeout(()=>toast(initialError),100);window.addEventListener('pagehide',()=>{stopAudio();stream?.getTracks().forEach(t=>t.stop())});
